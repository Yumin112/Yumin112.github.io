    const RoleMechanics = {
      getRoleAction(myRole, context) {
        if (!myRole) return null;
        if (ROLE_PLUGINS[myRole.id]) return ROLE_PLUGINS[myRole.id].getActionButton(context);

        const statusConfig = ROLE_STATUS_ACTIONS[myRole.id];
        if (statusConfig) {
          return {
            label: statusConfig.btnLabel,
            badge: statusConfig.badge,
            style: statusConfig.style,
            onClick: () => context.openGrantStatusModal(statusConfig)
          };
        }

        const clearConfig = ROLE_CLEAR_STATUS_ACTIONS[myRole.id];
        if (clearConfig) {
          return {
            label: clearConfig.btnLabel,
            badge: clearConfig.badge,
            style: clearConfig.style,
            onClick: () => context.openClearStatusModal(clearConfig)
          };
        }

        return null;
      },
      applyPlayerSwap(playersList, p1Id, p2Id, initiatorId = null) {
        const p1 = playersList.find(p => p.id === p1Id);
        const p2 = playersList.find(p => p.id === p2Id);
        if (!p1 || !p2) return playersList;

        const { role: role1, team: team1 } = p1;
        const { role: role2, team: team2 } = p2;

        return playersList.map(p => {
          let hasUsedMadScientistAbility = p.hasUsedMadScientistAbility;
          if (initiatorId && p.id === initiatorId) hasUsedMadScientistAbility = true;

          if (p.id === p1Id) {
            return {
              ...p,
              role: role2,
              team: team2,
              hasBeenLeprechaun: p.hasBeenLeprechaun || (role2?.id === 'leprechaun'),
              hasUsedMadScientistAbility
            };
          }
          if (p.id === p2Id) {
            return {
              ...p,
              role: role1,
              team: team1,
              hasBeenLeprechaun: p.hasBeenLeprechaun || (role1?.id === 'leprechaun'),
              hasUsedMadScientistAbility
            };
          }
          return { ...p, hasUsedMadScientistAbility };
        });
      },
      applyDrunkBuriedSwap(playersList, curBuried, drunkPlayerId) {
        if (!curBuried) return { nextPlayers: playersList, newBuried: curBuried };
        const drunkPlayer = playersList.find(p => p.id === drunkPlayerId);
        if (!drunkPlayer) return { nextPlayers: playersList, newBuried: curBuried };

        const oldRole = drunkPlayer.role;
        const newRole = curBuried;
        const isTrader = (oldRole?.id === 'trader_b' || oldRole?.id === 'trader_r');

        const nextPlayers = playersList.map(p => {
          if (p.id === drunkPlayerId) {
            return {
              ...p,
              role: newRole,
              team: newRole.team,
              hasBeenLeprechaun: p.hasBeenLeprechaun || (newRole?.id === 'leprechaun'),
              hasUsedTraderAbility: isTrader ? true : p.hasUsedTraderAbility
            };
          }
          return p;
        });
        return { nextPlayers, newBuried: oldRole };
      },
      applyGrantStatus(playersList, targetPlayerId, statusObj) {
        return playersList.map(p => {
          if (p.id === targetPlayerId) {
            const currentStatuses = p.statuses || [];
            if (currentStatuses.some(s => s.id === statusObj.id)) return p;
            return { ...p, statuses: [...currentStatuses, statusObj] };
          }
          return p;
        });
      },
      applyClearStatus(playersList, targetPlayerId, clearConfig) {
        const idsToRemove = clearConfig.filterStatusIds || [];
        return playersList.map(p => {
          if (p.id === targetPlayerId) {
            const nextStatuses = (p.statuses || []).filter(s => !idsToRemove.includes(s.id));
            return { ...p, statuses: nextStatuses };
          }
          return p;
        });
      },
      applyDualStatusGrant(playersList, t1Id, t2Id, statusObj, initiatorId = null) {
        return playersList.map(p => {
          const hasUsedDualTargetAbility = (initiatorId && p.id === initiatorId) ? true : p.hasUsedDualTargetAbility;
          if (p.id === t1Id || p.id === t2Id) {
            const currentStatuses = p.statuses || [];
            const nextStatuses = currentStatuses.some(s => s.id === statusObj.id)
              ? currentStatuses
              : [...currentStatuses, statusObj];
            return { ...p, statuses: nextStatuses, hasUsedDualTargetAbility };
          }
          return { ...p, hasUsedDualTargetAbility };
        });
      }
    };

      const resetToHome = useCallback(() => {

      const setupConnection = useCallback((code, asHost, name, uid) => {
        setConnStatus('連線伺服器中...');
        const topic = `trb_game_sync_room_${code}`;

        if (clientRef.current) {
          try { clientRef.current.end(true); } catch {}
        }

        const client = mqtt.connect(BROKER_URL, {
          clientId: `trb_${uid}_${Math.random().toString(16).substring(2, 8)}`,
          username: MQTT_USER,
          password: MQTT_PASS,
          clean: true,
          reconnectPeriod: 2000
        });
        clientRef.current = client;

        client.on('connect', () => {
          setConnStatus('🟢 已連線');
          client.subscribe(topic, { qos: 1 });
          if (asHost) client.subscribe(DISCOVERY_TOPIC, { qos: 0 });

          const currentProfile = latestStateRef.current.players?.find(p => p.id === uid) || {
            id: uid, name: name.trim(), isHost: asHost, team: null, role: null, gameRoom: null,
            hasBeenLeprechaun: false, hasUsedMadScientistAbility: false, hasUsedDualTargetAbility: false,
            hasUsedTimeLordAbility: false, hasUsedChangerAbility: false, hasUsedTraderAbility: false,
            manualWinner: null, statuses: []
          };

          if (asHost) {
            publishMsg(topic, { type: 'HOST_RECONNECTED', senderId: uid });
            setTimeout(() => {
              const cur = latestStateRef.current;
              let nextTime = cur.timeLeft;
              let nextStatus = cur.roomStatus;
              let nextRunning = cur.isTimerRunning;

              if (cur.roomStatus === 'round_active' && cur.roundEndTime > 0) {
                const diff = Math.max(0, Math.floor((cur.roundEndTime - Date.now()) / 1000));
                nextTime = diff;
                if (diff <= 0) {
                  nextStatus = 'round_paused';
                  nextRunning = false;
                }
                setTimeLeft(nextTime);
                setRoomStatus(nextStatus);
                setIsTimerRunning(nextRunning);
              }

              broadcastLatest({ timeLeft: nextTime, roomStatus: nextStatus });
              replyDiscoveryAsHost();
            }, 400);
          } else {
            publishMsg(topic, { type: 'PLAYER_PING_SYNC', senderId: uid, isHost: false, player: currentProfile });
          }
        });

        client.on('message', (t, msg) => {
          const data = safeJsonParse(msg.toString());
          if (!data) return;

          if (t === DISCOVERY_TOPIC) {
            if (data.type === 'DISCOVERY_QUERY_ROOMS' && latestStateRef.current.isHost) replyDiscoveryAsHost();
            return;
          }

          if (data.type === 'ROOM_DISBANDED') {
            alert('房長已離開，房間已解散！');
            resetToHome();
            return;
          }

          // === 房長專用邏輯 ===
          if (latestStateRef.current.isHost) {
            if (data.type === 'CHECK_ROOM_REQ') {
              const currentPlayers = latestStateRef.current.players || [];
              const isDuplicated = currentPlayers.some(p => p.id !== data.senderId && p.name === (data.playerName || '').trim());
              publishMsg(topic, isDuplicated
                ? { type: 'ROOM_JOIN_REJECTED', targetId: data.senderId, reason: 'NAME_DUPLICATED' }
                : { type: 'ROOM_VERIFIED', targetId: data.senderId, senderId: uid }
              );
              return;
            }
            if (data.type === 'REPORT_PRESENCE') {
              setPlayers(prev => {
                const next = prev.some(p => p.id === data.player.id)
                  ? prev.map(p => p.id === data.player.id ? { ...p, ...data.player } : p)
                  : [...prev, data.player];
                debouncedBroadcastLatest(300);
                return next;
              });
              return;
            }
            if (data.type === 'EXECUTE_DRUNK_SWAP') {
              const curBuried = latestStateRef.current.buriedCard;
              if (curBuried) {
                setPlayers(prev => {
                  const { nextPlayers, newBuried } = RoleMechanics.applyDrunkBuriedSwap(prev, curBuried, data.playerId);
                  setBuriedCard(newBuried);
                  setTimeout(() => broadcastLatest({ players: nextPlayers, buriedCard: newBuried }), 50);
                  return nextPlayers;
                });
              }
              return;
            }
            
            if (data.type === 'MAD_SCIENTIST_INITIATE') {
              madScientistVoteTrackerRef.current = { ...data, approvals: {} };
              publishMsg(topic, {
                type: 'MAD_SCIENTIST_PROMPT_TARGETS',
                initiatorId: data.initiatorId,
                initiatorName: data.initiatorName,
                p1Id: data.p1Id,
                p1Name: data.p1Name,
                p2Id: data.p2Id,
                p2Name: data.p2Name
              });
              return;
            }

            if (data.type === 'MAD_SCIENTIST_VOTE') {
              const tracker = madScientistVoteTrackerRef.current;
              if (!tracker) return;

              if (data.accepted) {
                tracker.approvals[data.voterId] = true;
                const p1Agreed = tracker.approvals[tracker.p1Id] === true;
                const p2Agreed = tracker.approvals[tracker.p2Id] === true;

                if (p1Agreed && p2Agreed) {
                  executeSwapOnHost(tracker.p1Id, tracker.p2Id, tracker.initiatorId);
                  publishMsg(topic, {
                    type: 'MAD_SCIENTIST_SWAP_COMPLETED',
                    initiatorId: tracker.initiatorId,
                    p1Id: tracker.p1Id,
                    p2Id: tracker.p2Id
                  });
                  madScientistVoteTrackerRef.current = null;
                } else {
                  publishMsg(topic, {
                    type: 'MAD_SCIENTIST_WAITING_OTHER',
                    initiatorId: tracker.initiatorId,
                    voterName: data.voterName
                  });
                }
              } else {
                publishMsg(topic, {
                  type: 'MAD_SCIENTIST_REJECTED',
                  initiatorId: tracker.initiatorId,
                  rejectorName: data.voterName,
                  p1Id: tracker.p1Id,
                  p2Id: tracker.p2Id
                });
                madScientistVoteTrackerRef.current = null;
              }
              return;
            }

            if (data.type === 'DUAL_STATUS_INITIATE') {
              dualStatusVoteTrackerRef.current = { ...data, approvals: {} };
              publishMsg(topic, {
                type: 'DUAL_STATUS_PROMPT_TARGETS',
                initiatorId: data.initiatorId,
                initiatorName: data.initiatorName,
                initiatorRoleName: data.initiatorRoleName,
                t1Id: data.t1Id,
                t1Name: data.t1Name,
                t2Id: data.t2Id,
                t2Name: data.t2Name,
                statusObj: data.statusObj
              });
              return;
            }

            if (data.type === 'DUAL_STATUS_VOTE') {
              const tracker = dualStatusVoteTrackerRef.current;
              if (!tracker) return;

              if (data.accepted) {
                tracker.approvals[data.voterId] = true;
                const t1Agreed = tracker.approvals[tracker.t1Id] === true;
                const t2Agreed = tracker.approvals[tracker.t2Id] === true;

                if (t1Agreed && t2Agreed) {
                  executeDualGrantOnHost(tracker.t1Id, tracker.t2Id, tracker.statusObj, tracker.initiatorId);
                  publishMsg(topic, {
                    type: 'DUAL_STATUS_COMPLETED',
                    initiatorId: tracker.initiatorId,
                    t1Id: tracker.t1Id,
                    t2Id: tracker.t2Id,
                    statusName: tracker.statusObj.name
                  });
                  dualStatusVoteTrackerRef.current = null;
                } else {
                  publishMsg(topic, {
                    type: 'DUAL_STATUS_WAITING_OTHER',
                    initiatorId: tracker.initiatorId,
                    voterName: data.voterName
                  });
                }
              } else {
                publishMsg(topic, {
                  type: 'DUAL_STATUS_REJECTED',
                  initiatorId: tracker.initiatorId,
                  rejectorName: data.voterName,
                  t1Id: tracker.t1Id,
                  t2Id: tracker.t2Id
                });
                dualStatusVoteTrackerRef.current = null;
              }
              return;
            }

            if (data.type === 'EXECUTE_GRANT_STATUS') {
              executeGrantStatusOnHost(data.targetId, data.statusObj, data.initiatorId);
              return;
            }

            if (data.type === 'EXECUTE_CLEAR_STATUS') {
              executeClearStatusOnHost(data.targetId, data.clearConfig, data.initiatorId);
              return;
            }
          }

          // === 所有玩家通訊接收 ===
          if (data.type === 'HOST_RECONNECTED' && !latestStateRef.current.isHost) {
            const myCurrent = latestStateRef.current.players?.find(p => p.id === uid) || {
              id: uid, name: name.trim(), isHost: false, team: null, role: null, gameRoom: null,
              hasBeenLeprechaun: false, hasUsedMadScientistAbility: false, hasUsedDualTargetAbility: false,
              hasUsedTimeLordAbility: false, hasUsedChangerAbility: false, hasUsedTraderAbility: false,
              manualWinner: null, statuses: []
            };
            publishMsg(topic, { type: 'REPORT_PRESENCE', senderId: uid, player: myCurrent });
            return;
          }

          if (data.type === 'TIME_LORD_SHIFT') {
            const shiftText = data.delta > 0 ? `+${data.delta} 秒` : `${data.delta} 秒`;
            setSwapStatusMessage(`⏳ ${data.userName} 發動【時間扭曲】！當前回合時間 ${shiftText}！`);
            setTimeout(() => setSwapStatusMessage(''), 4000);

            setPlayers(prev => prev.map(p => p.id === data.senderId ? { ...p, hasUsedTimeLordAbility: true } : p));

            if (latestStateRef.current.isHost) {
              const cur = latestStateRef.current;
              const nextTime = Math.max(5, cur.timeLeft + data.delta);
              const nextEndTime = cur.roundEndTime > 0 ? (cur.roundEndTime + data.delta * 1000) : 0;
              setTimeLeft(nextTime);
              setRoundEndTime(nextEndTime);
              setTimeout(() => broadcastLatest({ timeLeft: nextTime, roundEndTime: nextEndTime }), 50);
            }
            return;
          }

          if (data.type === 'CHANGER_MORPH_SUCCESS') {
            setPlayers(prev => prev.map(p => p.id === data.playerId ? {
              ...p,
              role: data.newRole,
              team: data.newRole.team,
              hasUsedChangerAbility: true
            } : p));
            if (data.playerId === uid) {
              setSwapStatusMessage(`🎉 幻形成功！你已變身為【${data.newRole.name}】！`);
              setTimeout(() => setSwapStatusMessage(''), 3500);
            }
            if (latestStateRef.current.isHost) {
              setTimeout(() => broadcastLatest(), 50);
            }
            return;
          }

          if (data.type === 'MAD_SCIENTIST_PROMPT_TARGETS') {
            if (data.p1Id === uid || data.p2Id === uid) {
              setMadScientistPendingData({
                initiatorId: data.initiatorId,
                initiatorName: data.initiatorName,
                otherName: data.p1Id === uid ? data.p2Name : data.p1Name
              });
            }
            return;
          }

          if (data.type === 'MAD_SCIENTIST_WAITING_OTHER') {
            if (data.initiatorId === uid) setSwapStatusMessage(`⏳ ${data.voterName} 已同意，正在等待另一位玩家確認...`);
            return;
          }

          if (data.type === 'MAD_SCIENTIST_REJECTED') {
            if (data.initiatorId === uid) {
              setSwapStatusMessage(`❌ 對調失敗：${data.rejectorName} 拒絕了對調請求！`);
              setTimeout(() => setSwapStatusMessage(''), 4000);
            }
            if (data.p1Id === uid || data.p2Id === uid) {
              setMadScientistPendingData(null);
              setSwapStatusMessage(`❌ 對調已取消：${data.rejectorName} 拒絕了對調。`);
              setTimeout(() => setSwapStatusMessage(''), 3000);
            }
            return;
          }

          if (data.type === 'MAD_SCIENTIST_SWAP_COMPLETED') {
            setMadScientistPendingData(null);
            const msg = data.initiatorId === uid 
              ? '🎉 雙方均已同意，角色成功對調！' 
              : (data.p1Id === uid || data.p2Id === uid ? '🎉 雙方均已同意，你的角色已被瘋狂科學家對調！' : '');
            if (msg) {
              setSwapStatusMessage(msg);
              setTimeout(() => setSwapStatusMessage(''), 3500);
            }
            return;
          }

          if (data.type === 'DUAL_STATUS_PROMPT_TARGETS') {
            if (data.t1Id === uid || data.t2Id === uid) {
              setDualStatusPendingData({
                initiatorId: data.initiatorId,
                initiatorName: data.initiatorName,
                initiatorRoleName: data.initiatorRoleName,
                otherName: data.t1Id === uid ? data.t2Name : data.t1Name,
                statusObj: data.statusObj
              });
            }
            return;
          }

          if (data.type === 'DUAL_STATUS_WAITING_OTHER') {
            if (data.initiatorId === uid) setSwapStatusMessage(`⏳ ${data.voterName} 已同意，正在等待另一位玩家確認...`);
            return;
          }

          if (data.type === 'DUAL_STATUS_REJECTED') {
            if (data.initiatorId === uid) {
              setSwapStatusMessage(`❌ 狀態賦予失敗：${data.rejectorName} 拒絕了請求！`);
              setTimeout(() => setSwapStatusMessage(''), 4000);
            }
            if (data.t1Id === uid || data.t2Id === uid) {
              setDualStatusPendingData(null);
              setSwapStatusMessage(`❌ 狀態賦予已取消：${data.rejectorName} 拒絕了請求。`);
              setTimeout(() => setSwapStatusMessage(''), 3000);
            }
            return;
          }

          if (data.type === 'DUAL_STATUS_COMPLETED') {
            setDualStatusPendingData(null);
            if (data.initiatorId === uid) {
              setSwapStatusMessage(`🎉 雙方均已同意，成功賦予【${data.statusName}】狀態！`);
              setTimeout(() => setSwapStatusMessage(''), 3500);
            }
            return;
          }

          if (data.type === 'STATUS_PROMPT_TARGET') {
            if (data.targetId === uid) {
              setStatusPromptData({
                initiatorId: data.initiatorId,
                initiatorName: data.initiatorName,
                initiatorRoleName: data.initiatorRoleName,
                initiatorRoleIcon: data.initiatorRoleIcon,
                statusObj: data.statusObj
              });
            }
            return;
          }

          if (data.type === 'STATUS_PROMPT_REJECTED') {
            if (data.initiatorId === uid) {
              setSwapStatusMessage(`❌ ${data.rejectorName} 拒絕了狀態賦予！`);
              setTimeout(() => setSwapStatusMessage(''), 3500);
            }
            return;
          }

          if (data.type === 'STATUS_GRANTED_SUCCESS') {
            if (data.initiatorId === uid) {
              setSwapStatusMessage(`🎉 對方已同意，成功賦予【${data.statusName}】！`);
              setTimeout(() => setSwapStatusMessage(''), 3000);
            } else if (data.targetId === uid) {
              setSwapStatusMessage(`✨ 你已獲得【${data.statusName}】狀態！`);
              setTimeout(() => setSwapStatusMessage(''), 3500);
            }
            return;
          }

          if (data.type === 'CLEAR_STATUS_PROMPT_TARGET') {
            if (data.targetId === uid) {
              setClearStatusPromptData({
                initiatorId: data.initiatorId,
                initiatorName: data.initiatorName,
                initiatorRoleName: data.initiatorRoleName,
                initiatorRoleIcon: data.initiatorRoleIcon,
                clearConfig: data.clearConfig
              });
            }
            return;
          }

          if (data.type === 'CLEAR_STATUS_REJECTED') {
            if (data.initiatorId === uid) {
              setSwapStatusMessage(`❌ ${data.rejectorName} 拒絕了狀態清除！`);
              setTimeout(() => setSwapStatusMessage(''), 3500);
            }
            return;
          }

          if (data.type === 'STATUS_CLEARED_SUCCESS') {
            if (data.initiatorId === uid) {
              setSwapStatusMessage(`🎉 對方已同意，成功執行【${data.actionTitle}】！`);
              setTimeout(() => setSwapStatusMessage(''), 3000);
            } else if (data.targetId === uid) {
              setSwapStatusMessage(`✨ 你的狀態已成功被清除/治癒！`);
              setTimeout(() => setSwapStatusMessage(''), 3500);
            }
            return;
          }

          if (data.type === 'DUAL_STATUS_GRANTED_SUCCESS') {
            if (data.t1Id === uid || data.t2Id === uid) {
              setSwapStatusMessage(`✨ 你已獲得【${data.statusName}】狀態！`);
              setTimeout(() => setSwapStatusMessage(''), 3500);
            }
            return;
          }

          if (data.senderId === uid) return;

          switch (data.type) {
            case 'PLAYER_PING_SYNC':
              if (latestStateRef.current.isHost) {
                setPlayers(prev => {
                  const existing = prev.find(p => p.id === data.player.id);
                  let next;
                  if (existing) {
                    next = prev.map(p => p.id === data.player.id ? { ...p, name: data.player.name || p.name } : p);
                  } else {
                    const isGameRunning = ['round_active', 'round_paused', 'round_manual_paused', 'ended'].includes(latestStateRef.current.roomStatus);
                    next = [...prev, {
                      ...data.player,
                      team: isGameRunning ? data.player.team : null,
                      role: isGameRunning ? data.player.role : null,
                      manualWinner: isGameRunning ? data.player.manualWinner : null,
                      statuses: isGameRunning ? (data.player.statuses || []) : []
                    }];
                  }
                  debouncedBroadcastLatest(300);
                  return next;
                });
              }
              break;
            case 'PLAYER_LEFT':
              setPlayers(prev => {
                const next = prev.filter(p => p.id !== data.playerId);
                if (latestStateRef.current.isHost) debouncedBroadcastLatest(150);
                return next;
              });
              break;
            case 'SWAP_REQUEST':
              if (data.targetId === uid) {
                setSwapRequestData({ fromId: data.fromId, fromName: data.fromName, fromRoleName: data.fromRoleName });
              }
              break;
            case 'SWAP_REJECTED':
              if (data.fromId === uid) {
                setSwapStatusMessage('對方拒絕了身分交換請求！');
                setTimeout(() => setSwapStatusMessage(''), 3000);
              }
              break;
            case 'SWAP_SUCCESS':
              if (data.player1Id === uid || data.player2Id === uid) {
                setSwapStatusMessage('🎉 身分已成功交換！');
                setTimeout(() => setSwapStatusMessage(''), 2500);
              }
              break;
            case 'EXECUTE_SWAP':
              if (latestStateRef.current.isHost) executeSwapOnHost(data.player1Id, data.player2Id);
              break;
            case 'FULL_SYNC':
              setPlayers(data.players);
              setRoomStatus(data.roomStatus);
              if (data.roleCounts) setRoleCounts(data.roleCounts);
              if (data.roundSettings) setRoundSettings(data.roundSettings);
              setCurrentRoundIndex(data.currentRoundIndex);

              if (['waiting', 'room_assigned'].includes(data.roomStatus)) {
                setSwapRequestData(null);
                setMadScientistPendingData(null);
                setStatusPromptData(null);
                setShowGrantStatusModal(false);
                setShowClearStatusModal(false);
                setClearStatusPromptData(null);
                setShowVoyeurModal(false);
                setShowSwapTargetModal(false);
                setShowMadScientistModal(false);
                setShowDrunkConfirmModal(false);
                setShowDualStatusModal(false);
                setDualStatusPendingData(null);
                setShowTimeLordModal(false);
                setShowChangerModal(false);
              }

              if (data.roomStatus === 'round_active' && data.roundEndTime > 0) {
                setRoundEndTime(data.roundEndTime);
                const actualRemaining = Math.max(0, Math.floor((data.roundEndTime - Date.now()) / 1000));
                setTimeLeft(actualRemaining);
              } else {
                setTimeLeft(data.timeLeft);
                if (data.roundEndTime !== undefined) setRoundEndTime(data.roundEndTime);
              }

              if (data.buriedCard !== undefined) setBuriedCard(data.buriedCard);
              if (data.gameResult !== undefined) setGameResult(data.gameResult);

              if (['round_active', 'round_paused', 'round_manual_paused', 'room_assigned', 'ended'].includes(data.roomStatus)) {
                setGameState('game');
                setIsTimerRunning(data.roomStatus === 'round_active');
              } else if (data.roomStatus === 'waiting') {
                setGameState('lobby');
                setIsTimerRunning(false);
              }
              break;
            case 'TIME_SYNC':
              if (!latestStateRef.current.isHost) {
                if (data.roundEndTime && data.roundEndTime > 0) {
                  setRoundEndTime(data.roundEndTime);
                  const actualRemaining = Math.max(0, Math.floor((data.roundEndTime - Date.now()) / 1000));
                  setTimeLeft(actualRemaining);
                } else {
                  setTimeLeft(prev => (Math.abs(prev - data.timeLeft) > 2 ? data.timeLeft : prev));
                }
              }
              break;
          }
        });

        client.on('error', () => setConnStatus('連線重試中...'));
      }, [publishMsg, broadcastLatest, debouncedBroadcastLatest, replyDiscoveryAsHost, executeSwapOnHost, executeGrantStatusOnHost, executeClearStatusOnHost, executeDualGrantOnHost, resetToHome]);

      // 冷啟動還原
      useEffect(() => {
        const storedId = StorageManager.getUid();
        setMyPlayerId(storedId);

        const savedRoomId = localStorage.getItem(STORAGE_KEYS.ROOM_ID);
        const savedPlayerName = localStorage.getItem(STORAGE_KEYS.PLAYER_NAME);
        const savedIsHost = localStorage.getItem(STORAGE_KEYS.IS_HOST) === 'true';

        if (savedRoomId && savedPlayerName) {
          setRoomId(savedRoomId);
          setPlayerName(savedPlayerName);
          setIsHost(savedIsHost);

          let initialList = [];
          const savedContext = StorageManager.getContext();

          if (savedContext.roomStatus) {
            setGameState(savedContext.gameState || 'lobby');

            if (savedContext.roundSettings) setRoundSettings(savedContext.roundSettings);
            if (savedContext.roleCounts) setRoleCounts(savedContext.roleCounts);
            if (savedContext.currentRoundIndex !== undefined) setCurrentRoundIndex(savedContext.currentRoundIndex);
            if (savedContext.buriedCard !== undefined) setBuriedCard(savedContext.buriedCard);
            if (savedContext.gameResult !== undefined) setGameResult(savedContext.gameResult);

            let restoredStatus = savedContext.roomStatus;
            let restoredRunning = Boolean(savedContext.isTimerRunning);
            let restoredTimeLeft = savedContext.timeLeft || 0;
            let restoredEndTime = savedContext.roundEndTime || 0;

            if (restoredStatus === 'round_active') {
              if (restoredEndTime > 0) {
                const diff = Math.max(0, Math.floor((restoredEndTime - Date.now()) / 1000));
                restoredTimeLeft = diff;
                if (diff <= 0) {
                  restoredStatus = 'round_paused';
                  restoredRunning = false;
                }
              } else if (savedContext.savedAt && restoredTimeLeft > 0) {
                const elapsedSec = Math.floor((Date.now() - savedContext.savedAt) / 1000);
                restoredTimeLeft = Math.max(0, restoredTimeLeft - elapsedSec);
                if (restoredTimeLeft <= 0) {
                  restoredStatus = 'round_paused';
                  restoredRunning = false;
                } else {
                  restoredEndTime = Date.now() + restoredTimeLeft * 1000;
                }
              }
            }

            setRoomStatus(restoredStatus);
            setIsTimerRunning(restoredRunning);
            setTimeLeft(restoredTimeLeft);
            setRoundEndTime(restoredEndTime);

            if (Array.isArray(savedContext.players) && savedContext.players.length > 0) {
              initialList = savedContext.players;
            } else if (savedContext.myProfile) {
              initialList = [savedContext.myProfile];
            }
          }

          if (initialList.length === 0) {
            initialList = [{
              id: storedId, name: savedPlayerName, isHost: savedIsHost, team: null, role: null,
              gameRoom: null, hasBeenLeprechaun: false, hasUsedMadScientistAbility: false,
              hasUsedDualTargetAbility: false, hasUsedTimeLordAbility: false, hasUsedChangerAbility: false,
              hasUsedTraderAbility: false, manualWinner: null, statuses: []
            }];
          }
          setPlayers(initialList);
          setupConnection(savedRoomId, savedIsHost, savedPlayerName, storedId);
        }
      }, [setupConnection]);

      // 計時器排程
      useEffect(() => {
        if (isTimerRunning && roomStatus === 'round_active' && timeLeft > 0) {
          timerIntervalRef.current = setInterval(() => {
            setTimeLeft(prev => {
              const currentEnd = latestStateRef.current.roundEndTime;
              let nextSec = prev - 1;

              if (currentEnd && currentEnd > 0) {
                nextSec = Math.max(0, Math.floor((currentEnd - Date.now()) / 1000));
              }

              if (nextSec <= 0) {
                clearInterval(timerIntervalRef.current);
                if (latestStateRef.current.isHost) {
                  setIsTimerRunning(false);
                  setRoomStatus('round_paused');
                  setRoundEndTime(0);
                  broadcastLatest({ roomStatus: 'round_paused', timeLeft: 0, roundEndTime: 0 });
                }
                return 0;
              }

              if (latestStateRef.current.isHost && nextSec % 30 === 0 && clientRef.current) {
                publishMsg(`trb_game_sync_room_${roomId}`, {
                  type: 'TIME_SYNC', senderId: myPlayerId, timeLeft: nextSec, roundEndTime: currentEnd
                }, { qos: 0 });
              }
              return nextSec;
            });
          }, 1000);
        } else {
          clearInterval(timerIntervalRef.current);
        }
        return () => clearInterval(timerIntervalRef.current);
      }, [isTimerRunning, roomStatus, timeLeft, roomId, myPlayerId, broadcastLatest, publishMsg]);

      const finalizeVictory = useCallback((resultText) => {
        setGameResult(resultText);
        setShowVictoryModal(false);
        broadcastLatest({ gameResult: resultText });
      }, [broadcastLatest]);

      const isRoleInGame = useCallback((roleKeys) => {
        const keys = Array.isArray(roleKeys) ? roleKeys : [roleKeys];
        return keys.some(key => (roleCounts[key] || 0) > 0);
      }, [roleCounts]);

      const getAutoDecisionForNode = useCallback((nodeKey, prevNodeKey) => {
        if (!nodeKey) return null;

        if (nodeKey.includes('ENG')) {
          if (!isRoleInGame(['engineer'])) return true;
        }

        if (nodeKey.includes('DOC')) {
          if (!isRoleInGame(['doctor'])) return true;
        }

        if (nodeKey.includes('PYRO')) {
          if (!isRoleInGame(['pyrotech'])) return false;
        }

        if (nodeKey.includes('DRONE')) {
          const hasDrone = isRoleInGame(['blue_drone']);
          const hasFist = isRoleInGame(['red_fist']);
          const hasBoth = hasDrone && hasFist;

          if (!hasBoth) {
            if (prevNodeKey && prevNodeKey.includes('ENG')) return false;
            if (prevNodeKey && prevNodeKey.includes('DOC')) return true;
            return false;
          }
        }

        return null;
      }, [isRoleInGame]);

      const advanceToNode = useCallback((targetNodeKey, prevNodeKey = null) => {
        let curr = targetNodeKey;
        let prev = prevNodeKey;

        while (curr) {
          const nodeConfig = DECISION_TREE[curr];
          if (!nodeConfig) break;

          const autoAnswer = getAutoDecisionForNode(curr, prev);

          if (autoAnswer !== null) {
            const nextResult = autoAnswer ? nodeConfig.resultYes : nodeConfig.resultNo;
            if (nextResult !== undefined) {
              finalizeVictory(nextResult);
              return;
            }
            prev = curr;
            curr = autoAnswer ? nodeConfig.onYes : nodeConfig.onNo;
          } else {
            setVictoryCurrentNode(curr);
            setShowVictoryModal(true);
            return;
          }
        }
      }, [DECISION_TREE, getAutoDecisionForNode, finalizeVictory]);

      const handleDecisionChoice = (isYes) => {
        const currentNode = DECISION_TREE[victoryCurrentNode];
        if (!currentNode) return;

        const nextResult = isYes ? currentNode.resultYes : currentNode.resultNo;
        if (nextResult !== undefined) {
          finalizeVictory(nextResult);
          return;
        }

        const nextNodeKey = isYes ? currentNode.onYes : currentNode.onNo;
        if (nextNodeKey) {
          advanceToNode(nextNodeKey, victoryCurrentNode);
        }
      };

      const startVictoryDetermination = useCallback(() => {
        setVictoryCurrentNode('ROOT');
        setShowVictoryModal(true);
        advanceToNode('ROOT', null);
      }, [advanceToNode]);

      const handleCreateRoom = () => {
        const trimmedName = playerName.trim() || '房長';
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        const me = {
          id: myPlayerId, name: trimmedName, isHost: true, team: null, role: null,
          gameRoom: null, hasBeenLeprechaun: false, hasUsedMadScientistAbility: false,
          hasUsedDualTargetAbility: false, hasUsedTimeLordAbility: false, hasUsedChangerAbility: false,
          hasUsedTraderAbility: false, manualWinner: null, statuses: []
        };

        StorageManager.saveSession(code, trimmedName, true);
        setRoomId(code);
        setIsHost(true);
        setPlayers([me]);
        setBuriedCard(null);
        setGameResult(null);
        setRoomStatus('waiting');
        setGameState('lobby');
        setupConnection(code, true, trimmedName, myPlayerId);
      };

      const executeJoinRoom = (targetCode) => {
        const trimmedName = playerName.trim() || '特工';
        const code = (targetCode || joinRoomInput).trim();
        if (code.length !== 6) {
          alert('請輸入 6 碼數字房號！');
          return;
        }

        setIsVerifying(true);
        setConnStatus('連線伺服器中...');

        const topic = `trb_game_sync_room_${code}`;
        const tempClient = mqtt.connect(BROKER_URL, {
          clientId: `trb_v_${myPlayerId}_${Math.random().toString(16).slice(2, 8)}`,
          username: MQTT_USER,
          password: MQTT_PASS,
          clean: true,
          connectTimeout: 5000
        });

        let verified = false;
        const timeoutTimer = setTimeout(() => {
          if (!verified) {
            try { tempClient.end(true); } catch {}
            setIsVerifying(false);
            setConnStatus('未連線');
            alert(`找不到房間「${code}」或房長不在線！\n（若使用 Instagram/LINE 開啟，請點選右上角改用 Safari 或 Chrome 瀏覽器）`);
          }
        }, 6000);

        tempClient.on('connect', () => {
          setConnStatus('🟢 已連線');
          tempClient.subscribe(topic, { qos: 1 }, (err) => {
            if (!err) {
              tempClient.publish(topic, JSON.stringify({
                type: 'CHECK_ROOM_REQ', senderId: myPlayerId, playerName: trimmedName
              }), { qos: 1 });
            }
          });
        });

        tempClient.on('message', (t, msg) => {
          const data = safeJsonParse(msg.toString());
          if (!data) return;

          if (data.type === 'ROOM_JOIN_REJECTED' && (!data.targetId || data.targetId === myPlayerId)) {
            verified = true;
            clearTimeout(timeoutTimer);
            try { tempClient.end(true); } catch {}
            setIsVerifying(false);
            setConnStatus('未連線');
            alert(data.reason === 'NAME_DUPLICATED'
              ? `⚠ 加入失敗：房間「${code}」內已存在名為「${trimmedName}」的玩家！\n請更換一個暱稱後再試。`
              : '無法加入房間，已被房長拒絕！');
            return;
          }

          if (data.type === 'ROOM_VERIFIED' && (!data.targetId || data.targetId === myPlayerId)) {
            verified = true;
            clearTimeout(timeoutTimer);
            try { tempClient.end(true); } catch {}
            setIsVerifying(false);
            setShowRoomsModal(false);

            StorageManager.saveSession(code, trimmedName, false);
            setRoomId(code);
            setIsHost(false);
            setGameState('lobby');

            const selfPlayer = {
              id: myPlayerId, name: trimmedName, isHost: false, team: null, role: null,
              gameRoom: null, hasBeenLeprechaun: false, hasUsedMadScientistAbility: false,
              hasUsedDualTargetAbility: false, hasUsedTimeLordAbility: false, hasUsedChangerAbility: false,
              hasUsedTraderAbility: false, manualWinner: null, statuses: []
            };
            setPlayers([selfPlayer]);
            setupConnection(code, false, trimmedName, myPlayerId);
          }
        });

        tempClient.on('error', () => {
          clearTimeout(timeoutTimer);
          setIsVerifying(false);
          setConnStatus('未連線');
          try { tempClient.end(true); } catch {}
          alert('伺服器連線失敗，請檢查網路或確認帳號密碼設定！');
        });
      };

      const handleLeaveRoom = () => {
        const confirmMsg = isHost ? '您是房長，離開後將會解散房間，確定要離開嗎？' : '確定要離開當前房間嗎？';
        if (!window.confirm(confirmMsg)) return;

        if (clientRef.current && roomId) {
          publishMsg(`trb_game_sync_room_${roomId}`, {
            type: isHost ? 'ROOM_DISBANDED' : 'PLAYER_LEFT',
            playerId: myPlayerId, senderId: myPlayerId
          });
          setTimeout(resetToHome, 300);
        } else {
          resetToHome();
        }
      };

      const handleOpenRoomsModal = () => {
        setShowRoomsModal(true);
        setOnlineRooms([]);
        setIsSearchingRooms(true);
        setConnStatus('連線伺服器中...');

        if (discoveryClientRef.current) {
          try { discoveryClientRef.current.end(true); } catch {}
        }

        const discClient = mqtt.connect(BROKER_URL, {
          clientId: `trb_disc_${myPlayerId}_${Math.random().toString(16).slice(2, 6)}`,
          username: MQTT_USER, password: MQTT_PASS, clean: true, connectTimeout: 5000
        });
        discoveryClientRef.current = discClient;

        discClient.on('connect', () => {
          setConnStatus('🟢 已連線');
          discClient.subscribe(DISCOVERY_TOPIC, { qos: 0 }, () => {
            discClient.publish(DISCOVERY_TOPIC, JSON.stringify({ type: 'DISCOVERY_QUERY_ROOMS', senderId: myPlayerId }), { qos: 0 });
          });
        });

        discClient.on('message', (topic, message) => {
          const data = safeJsonParse(message.toString());
          if (data?.type === 'DISCOVERY_ROOM_ANNOUNCE' && data.roomId) {
            setOnlineRooms(prev => [
              ...prev.filter(r => r.roomId !== data.roomId),
              { roomId: data.roomId, hostName: data.hostName, playerCount: data.playerCount, roomStatus: data.roomStatus, receivedAt: Date.now() }
            ]);
          }
        });

        discClient.on('error', () => setConnStatus('連線重試中...'));
        setTimeout(() => setIsSearchingRooms(false), 1500);
      };

      const handleCloseRoomsModal = () => {
        setShowRoomsModal(false);
        if (discoveryClientRef.current) {
          try { discoveryClientRef.current.end(true); } catch {}
          discoveryClientRef.current = null;
        }
        if (gameState === 'home') setConnStatus('未連線');
      };

      const handleStartAssignRooms = () => {
        if (players.length < 2) return alert('至少需要 2 位玩家加入才能開始！');
        if (totalCardsInDeck < players.length) return alert(`卡池張數 (${totalCardsInDeck} 張) 少於在線玩家 (${players.length} 人)！請於角色池設定增加卡片。`);

        const shuffled = [...players].sort(() => Math.random() - 0.5);
        const half = Math.ceil(shuffled.length / 2);

        const assigned = shuffled.map((p, idx) => ({
          ...p, 
          team: null, 
          role: null, 
          statuses: [], 
          hasBeenLeprechaun: false, 
          hasUsedMadScientistAbility: false,
          hasUsedDualTargetAbility: false,
          hasUsedTimeLordAbility: false,
          hasUsedChangerAbility: false,
          hasUsedTraderAbility: false,
          manualWinner: null,
          gameRoom: idx < half ? '房間 A (Room A)' : '房間 B (Room B)'
        }));

        setPlayers(assigned);
        setRoomStatus('room_assigned');
        setIsTimerRunning(false);
        setRoundEndTime(0);
        setGameState('game');

        broadcastLatest({
          players: assigned, 
          roomStatus: 'room_assigned', 
          currentRoundIndex: 0,
          timeLeft: roundSettings[0] * 60, 
          roundEndTime: 0, 
          buriedCard: null, 
          gameResult: null
        });
      };

      const handleConfirmDealCardsAndStart = () => {
        let deck = [];
        rolesCatalog.forEach(role => {
          for (let i = 0; i < (roleCounts[role.id] || 0); i++) deck.push({ ...role });
        });
        deck.sort(() => Math.random() - 0.5);

        const assignedWithRoles = players.map((p, idx) => {
          const r = deck[idx] || rolesCatalog[0];
          const initialStatus = INITIAL_ROLE_STATUSES[r.id];
          const initialStatuses = initialStatus ? [initialStatus] : [];

          return {
            ...p,
            team: r.team,
            role: r,
            hasBeenLeprechaun: r.id === 'leprechaun',
            hasUsedMadScientistAbility: false,
            hasUsedDualTargetAbility: false,
            hasUsedTimeLordAbility: false,
            hasUsedChangerAbility: false,
            hasUsedTraderAbility: false,
            manualWinner: null,
            statuses: initialStatuses
          };
        });

        const generatedBuried = (deck.length === players.length + 1) ? deck[players.length] : null;
        const initialTime = roundSettings[0] * 60;
        const targetEnd = Date.now() + initialTime * 1000;

        setPlayers(assignedWithRoles);
        setBuriedCard(generatedBuried);
        setCurrentRoundIndex(0);
        setTimeLeft(initialTime);
        setRoundEndTime(targetEnd);
        setRoomStatus('round_active');
        setIsTimerRunning(true);
        setGameResult(null);

        broadcastLatest({
          players: assignedWithRoles, roomStatus: 'round_active', currentRoundIndex: 0,
          timeLeft: initialTime, roundEndTime: targetEnd, buriedCard: generatedBuried, gameResult: null
        });
      };

      const handleTogglePauseTimer = () => {
        if (!isHost) return;
        if (isTimerRunning && roomStatus === 'round_active') {
          const currentEnd = roundEndTime;
          const remaining = (currentEnd > 0)
            ? Math.max(0, Math.floor((currentEnd - Date.now()) / 1000))
            : timeLeft;

          setTimeLeft(remaining);
          setRoundEndTime(0);
          setIsTimerRunning(false);
          setRoomStatus('round_manual_paused');
          broadcastLatest({ roomStatus: 'round_manual_paused', timeLeft: remaining, roundEndTime: 0 });
        } else if (!isTimerRunning && roomStatus === 'round_manual_paused') {
          const newEnd = Date.now() + timeLeft * 1000;
          setRoundEndTime(newEnd);
          setIsTimerRunning(true);
          setRoomStatus('round_active');
          broadcastLatest({ roomStatus: 'round_active', timeLeft, roundEndTime: newEnd });
        }
      };

      const handleForceEndGame = () => {
        if (!isHost) return;
        if (!window.confirm('確定要直接結束倒數並結算遊戲嗎？')) return;

        setIsTimerRunning(false);
        setRoundEndTime(0);
        setTimeLeft(0);
        setRoomStatus('ended');

        broadcastLatest({ roomStatus: 'ended', timeLeft: 0, roundEndTime: 0 });
        startVictoryDetermination();
      };

      const handleTogglePlayerVictory = (targetPlayerId) => {
        if (!isHost || roomStatus !== 'ended') return;

        setPlayers(prev => {
          const next = prev.map(p => {
            if (p.id === targetPlayerId) {
              const defaultWin = (gameResult === '紅隊獲勝' && p.team === 'red') || (gameResult === '藍隊獲勝' && p.team === 'blue');
              const currentEffectiveWin = p.manualWinner !== undefined && p.manualWinner !== null ? p.manualWinner : defaultWin;
              return { ...p, manualWinner: !currentEffectiveWin };
            }
            return p;
          });
          setTimeout(() => broadcastLatest({ players: next }), 50);
          return next;
        });
      };

      const handleNextRoundConfirm = () => {
        if (currentRoundIndex + 1 < roundSettings.length) {
          const nextIdx = currentRoundIndex + 1;
          const nextTime = roundSettings[nextIdx] * 60;
          const nextEnd = Date.now() + nextTime * 1000;

          setCurrentRoundIndex(nextIdx);
          setTimeLeft(nextTime);
          setRoundEndTime(nextEnd);
          setRoomStatus('round_active');
          setIsTimerRunning(true);
          broadcastLatest({ roomStatus: 'round_active', currentRoundIndex: nextIdx, timeLeft: nextTime, roundEndTime: nextEnd });
        } else {
          setRoomStatus('ended');
          setIsTimerRunning(false);
          setRoundEndTime(0);
          broadcastLatest({ roomStatus: 'ended', timeLeft: 0, roundEndTime: 0 });

          if (isHost) startVictoryDetermination();
        }
      };

      const handleTouchMove = (e) => {
        if (!isColorOnly || !cardRef.current) return;
        const touch = e.touches[0];
        if (!touch) return;
        const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
        if (!targetElement || !cardRef.current.contains(targetElement)) {
          setIsColorOnly(false);
        }
      };

      const handleSendSwapRequest = (targetPlayer) => {
        setShowSwapTargetModal(false);
        if (targetPlayer.id === myPlayerId) return;

        setSwapStatusMessage(`已向 ${targetPlayer.name} 發送交換請求，等待對方確認中...`);
        publishMsg(`trb_game_sync_room_${roomId}`, {
          type: 'SWAP_REQUEST', senderId: myPlayerId, fromId: myPlayerId,
          fromName: myInfo.name, fromRoleName: myInfo.role?.name, targetId: targetPlayer.id
        });
      };

      const handleAcceptSwap = () => {
        if (!swapRequestData) return;
        const { fromId: p1Id } = swapRequestData;
        const p2Id = myPlayerId;
        setSwapRequestData(null);

        if (latestStateRef.current.isHost) {
          executeSwapOnHost(p1Id, p2Id);
        } else {
          publishMsg(`trb_game_sync_room_${roomId}`, {
            type: 'EXECUTE_SWAP', senderId: myPlayerId, player1Id: p1Id, player2Id: p2Id
          });
        }
      };

      const handleRejectSwap = () => {
        if (!swapRequestData) return;
        publishMsg(`trb_game_sync_room_${roomId}`, {
          type: 'SWAP_REJECTED', senderId: myPlayerId, fromId: swapRequestData.fromId
        });
        setSwapRequestData(null);
      };

      const handleConfirmDrunkSwap = () => {
        setShowDrunkConfirmModal(false);
        if (!buriedCard) return;

        const isTrader = (myInfo.role?.id === 'trader_b' || myInfo.role?.id === 'trader_r');

        if (latestStateRef.current.isHost) {
          const curBuried = latestStateRef.current.buriedCard;
          setPlayers(prev => {
            const { nextPlayers, newBuried } = RoleMechanics.applyDrunkBuriedSwap(prev, curBuried, myPlayerId);
            setBuriedCard(newBuried);
            setTimeout(() => broadcastLatest({ players: nextPlayers, buriedCard: newBuried }), 50);
            return nextPlayers;
          });
        } else {
          if (isTrader) {
            setPlayers(prev => prev.map(p => p.id === myPlayerId ? { ...p, hasUsedTraderAbility: true } : p));
          }
          publishMsg(`trb_game_sync_room_${roomId}`, {
            type: 'EXECUTE_DRUNK_SWAP', senderId: myPlayerId, playerId: myPlayerId
          });
        }
      };

      const handleTriggerMadScientistSwap = useCallback((p1Id, p2Id) => {
        const p1 = players.find(p => p.id === p1Id);
        const p2 = players.find(p => p.id === p2Id);
        if (!p1 || !p2) return;

        publishMsg(`trb_game_sync_room_${roomId}`, {
          type: 'MAD_SCIENTIST_INITIATE',
          senderId: myPlayerId,
          initiatorId: myPlayerId,
          initiatorName: myInfo.name,
          p1Id,
          p1Name: p1.name,
          p2Id,
          p2Name: p2.name
        });
        setSwapStatusMessage(`已向 ${p1.name} 與 ${p2.name} 發送對調請求，等待雙方同意中...`);
      }, [players, myPlayerId, myInfo.name, roomId, publishMsg]);

      const handleMadScientistTargetVote = (accepted) => {
        if (!madScientistPendingData) return;
        publishMsg(`trb_game_sync_room_${roomId}`, {
          type: 'MAD_SCIENTIST_VOTE',
          senderId: myPlayerId,
          voterId: myPlayerId,
          voterName: myInfo.name,
          accepted
        });
        setMadScientistPendingData(null);
      };

      const handleToggleScientistTarget = (pid) => {
        setSelectedScientistTargets(prev => {
          if (prev.includes(pid)) return prev.filter(id => id !== pid);
          return prev.length >= 2 ? [prev[1], pid] : [...prev, pid];
        });
      };

      const handleConfirmScientistSwap = () => {
        if (selectedScientistTargets.length !== 2) return;
        madScientistConfig?.onConfirm(selectedScientistTargets[0], selectedScientistTargets[1]);
        setShowMadScientistModal(false);
        setSelectedScientistTargets([]);
      };

      const handleOpenGrantStatusModal = (config) => {
        setActiveStatusConfig(config);
        setShowGrantStatusModal(true);
      };

      const handleSendStatusGrantRequest = (targetPlayer) => {
        setShowGrantStatusModal(false);
        if (!activeStatusConfig || targetPlayer.id === myPlayerId) return;

        setSwapStatusMessage(`已向 ${targetPlayer.name} 發送賦予【${activeStatusConfig.statusName}】請求，等待對方確認中...`);
        publishMsg(`trb_game_sync_room_${roomId}`, {
          type: 'STATUS_PROMPT_TARGET',
          senderId: myPlayerId,
          initiatorId: myPlayerId,
          initiatorName: myInfo.name,
          initiatorRoleName: myInfo.role?.name || '未知角色',
          initiatorRoleIcon: myInfo.role?.icon || '⭐',
          targetId: targetPlayer.id,
          statusObj: {
            id: activeStatusConfig.statusId,
            name: activeStatusConfig.statusName,
            icon: activeStatusConfig.statusIcon
          }
        });
      };

      const handleAcceptStatusGrant = () => {
        if (!statusPromptData) return;
        const { initiatorId, statusObj } = statusPromptData;
        const targetId = myPlayerId;
        setStatusPromptData(null);

        if (latestStateRef.current.isHost) {
          executeGrantStatusOnHost(targetId, statusObj, initiatorId);
        } else {
          publishMsg(`trb_game_sync_room_${roomId}`, {
            type: 'EXECUTE_GRANT_STATUS',
            senderId: myPlayerId,
            initiatorId,
            targetId,
            statusObj
          });
        }
      };

      const handleRejectStatusGrant = () => {
        if (!statusPromptData) return;
        publishMsg(`trb_game_sync_room_${roomId}`, {
          type: 'STATUS_PROMPT_REJECTED',
          senderId: myPlayerId,
          initiatorId: statusPromptData.initiatorId,
          rejectorName: myInfo.name
        });
        setStatusPromptData(null);
      };

      const handleToggleRole = (roleId) => {
        if (!isHost) return;
        setTempRoleCounts(prev => {
          const isSelected = (prev[roleId] || 0) > 0;
          const next = { ...prev, [roleId]: isSelected ? 0 : 1 };

          if (!isSelected) {
            const currentRole = rolesCatalog.find(r => r.id === roleId);
            if (currentRole?.pairs) {
              const pairIds = Array.isArray(currentRole.pairs)
                ? currentRole.pairs
                : currentRole.pairs.split(',').map(s => s.trim()).filter(Boolean);
              pairIds.forEach(pId => { next[pId] = 1; });
            }
          }
          return next;
        });
      };

      const activeQuestion = DECISION_TREE[victoryCurrentNode];

      return (
        <div className="max-w-4xl mx-auto pb-12">
          <Header
            connStatus={connStatus}
            roomId={roomId}
            playersCount={players.length}
            isHost={isHost}
            onLeave={handleLeaveRoom}
          />

          {gameState === 'home' && (
            <div className="max-w-md mx-auto bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-xl mt-6 space-y-4">
              <div>
                <label className="block text-sm font-medium text-zinc-300 mb-1">您的暱稱</label>
                <input
                  type="text"
                  value={playerName}
                  onChange={(e) => setPlayerName(e.target.value)}
                  placeholder="輸入暱稱 (例如: 特工 007)"
                  className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>

              <button
                type="button"
                onClick={handleCreateRoom}
                className="w-full bg-gradient-to-r from-red-600 via-purple-600 to-blue-600 hover:opacity-90 text-white font-semibold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2 active:scale-95"
              >
                <span>👑 建立新房間 (當房長)</span>
              </button>

              <button
                type="button"
                onClick={handleOpenRoomsModal}
                className="w-full bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 font-semibold py-2.5 rounded-xl transition shadow flex items-center justify-center gap-2 active:scale-95 text-sm"
              >
                <span>📋 查看當前所有線上房間</span>
              </button>

              <div className="relative flex py-1 items-center">
                <div className="flex-grow border-t border-zinc-800"></div>
                <span className="flex-shrink mx-4 text-xs text-zinc-500">或手動輸入 6 碼房間號</span>
                <div className="flex-grow border-t border-zinc-800"></div>
              </div>

              <div className="flex gap-2">
                <input
                  type="tel"
                  maxLength={6}
                  value={joinRoomInput}
                  onChange={(e) => setJoinRoomInput(e.target.value)}
                  placeholder="輸入 6 碼房號"
                  className="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2 text-white font-mono text-center tracking-widest placeholder-zinc-500 focus:outline-none"
                />
                <button
                  type="button"
                  disabled={isVerifying}
                  onClick={() => executeJoinRoom(joinRoomInput)}
                  className="bg-zinc-700 hover:bg-zinc-600 px-6 py-2 rounded-xl text-white font-medium transition active:scale-95 disabled:opacity-50 min-w-[80px]"
                >
                  {isVerifying ? '驗證中...' : '加入'}
                </button>
              </div>
            </div>
          )}

          {showRoomsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl flex flex-col shadow-2xl overflow-hidden max-h-[85vh]">
                <div className="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950/40">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📋</span>
                    <h3 className="font-bold text-white text-base">線上房間列表</h3>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleOpenRoomsModal}
                      disabled={isSearchingRooms}
                      className="text-xs bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 px-2.5 py-1 rounded-lg transition"
                    >
                      {isSearchingRooms ? '掃描中...' : '🔄 重新整理'}
                    </button>
                    <button onClick={handleCloseRoomsModal} className="text-zinc-400 hover:text-white text-sm w-7 h-7 flex items-center justify-center rounded-lg bg-zinc-800">
                      ✕
                    </button>
                  </div>
                </div>

                <div className="p-4 overflow-y-auto space-y-2.5 flex-1">
                  {onlineRooms.length === 0 ? (
                    <div className="text-center py-10 space-y-2">
                      <div className="text-3xl animate-pulse">📡</div>
                      <p className="text-sm text-zinc-400 font-medium">
                        {isSearchingRooms ? '正在搜尋附近的線上房間...' : '目前沒有探索到在線房間'}
                      </p>
                      <p className="text-xs text-zinc-500">您可以直接建立房間，或請房長開啟房間後點選右上角重新整理。</p>
                    </div>
                  ) : (
                    onlineRooms.map(room => (
                      <div
                        key={room.roomId}
                        className="bg-zinc-800/80 border border-zinc-700/80 hover:border-indigo-500/60 p-3.5 rounded-xl flex items-center justify-between gap-3 transition"
                      >
                        <div className="space-y-1">
                          <div className="flex items-center gap-2">
                            <span className="font-mono text-base font-bold text-amber-400 tracking-wider">#{room.roomId}</span>
                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${
                              room.roomStatus === 'waiting'
                                ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                                : 'bg-zinc-700 text-zinc-400'
                            }`}>
                              {room.roomStatus === 'waiting' ? '等候中' : '進行中'}
                            </span>
                          </div>
                          <div className="text-xs text-zinc-300 flex items-center gap-2">
                            <span>房長: <strong className="text-white">{room.hostName}</strong></span>
                            <span>•</span>
                            <span>在線: <strong className="text-indigo-400">{room.playerCount}</strong> 人</span>
                          </div>
                        </div>

                        <button
                          disabled={isVerifying}
                          onClick={() => {
                            setJoinRoomInput(room.roomId);
                            executeJoinRoom(room.roomId);
                          }}
                          className="bg-gradient-to-r from-red-600 to-blue-600 hover:opacity-90 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow active:scale-95 disabled:opacity-50 shrink-0"
                        >
                          {isVerifying ? '加入中...' : '一鍵加入'}
                        </button>
                      </div>
                    ))
                  )}
                </div>

                <div className="p-3 bg-zinc-950/60 border-t border-zinc-800 text-[11px] text-zinc-400 text-center">
                  💡 點選一鍵加入後，系統會自動幫您帶入房號並驗證暱稱進入房間。
                </div>
              </div>
            </div>
          )}

          {gameState === 'lobby' && (
            <div className="space-y-6">
              <div className="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <span>等待大廳</span>
                    <span className="text-sm bg-zinc-800 px-3 py-0.5 rounded-full text-zinc-300">
                      在線人數: <strong className="text-amber-400">{players.length}</strong> 人
                    </span>
                    {totalCardsInDeck === players.length + 1 && (
                      <span className="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold">
                        ⚰ 將啟用埋葬卡
                      </span>
                    )}
                  </h2>
                  <p className="text-xs text-zinc-400 mt-1">
                    斷線、重新整理或關閉分頁重新開啟皆可自動連回。房號：<strong className="text-white font-mono text-sm">{roomId}</strong>
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2.5">
                  {isHost ? (
                    <React.Fragment>
                      <button
                        onClick={() => { setTempRoundSettings([...roundSettings]); setShowRoundConfigModal(true); }}
                        className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-3.5 py-2 rounded-xl text-xs font-semibold text-zinc-200 transition active:scale-95"
                      >
                        ⚙ 回合設定 ({roundSettings.length}輪)
                      </button>

                      <button
                        onClick={() => { setTempRoleCounts({ ...roleCounts }); setShowDeckModal(true); }}
                        className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-3.5 py-2 rounded-xl text-xs font-semibold text-zinc-200 transition active:scale-95"
                      >
                        🃏 角色池配置 ({totalCardsInDeck}張)
                      </button>

                      <button
                        onClick={handleStartAssignRooms}
                        className="bg-gradient-to-r from-red-600 to-blue-600 hover:opacity-90 px-6 py-2.5 rounded-xl font-bold text-white shadow-lg transition active:scale-95"
                      >
                        🎲 開始遊戲 & 分房
                      </button>
                    </React.Fragment>
                  ) : (
                    <span className="text-xs text-amber-400 bg-amber-400/10 px-4 py-2 rounded-xl border border-amber-400/20 animate-pulse font-medium">
                      ⏳ 等待房長開始遊戲...
                    </span>
                  )}
                </div>
              </div>

              <div className="bg-zinc-900/60 border border-zinc-800/80 p-4 rounded-xl flex flex-col sm:flex-row gap-3 sm:gap-4 text-xs text-zinc-400 justify-between items-start sm:items-center">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-amber-400 font-bold flex items-center gap-1 shrink-0">⏱ 回合時間:</span>
                  <div className="flex flex-wrap items-center gap-1.5">
                    {roundSettings.map((min, idx) => (
                      <span key={idx} className="bg-zinc-800 border border-zinc-700 px-2 py-1 rounded-md text-zinc-200 font-medium whitespace-nowrap">
                        <span className="text-zinc-400">R{idx + 1}:</span> <strong className="text-amber-400">{min}</strong>分
                      </span>
                    ))}
                  </div>
                </div>
                <div className="text-[11px] text-zinc-500 shrink-0">第一階段先分房就位，確認後才發放身分與計時。</div>
              </div>

              <div className="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
                <h3 className="text-sm font-semibold text-zinc-400 mb-3">線上玩家列表 ({players.length})</h3>
                <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3">
                  {players.map((p, idx) => (
                    <div
                      key={p.id}
                      className={`p-3 rounded-xl border flex items-center gap-2.5 ${
                        p.id === myPlayerId ? 'bg-indigo-950/40 border-indigo-500/50' : 'bg-zinc-800/40 border-zinc-800'
                      }`}
                    >
                      <div className="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-xs">{idx + 1}</div>
                      <div className="truncate">
                        <div className="text-sm font-medium truncate flex items-center gap-1">
                          {p.name}
                          {p.isHost && <span className="text-amber-400 text-xs">👑</span>}
                        </div>
                        {p.id === myPlayerId && <div className="text-[10px] text-indigo-400">你自己</div>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <RoleCatalogCard
                activeRolesInDeck={activeRolesInDeck}
                totalCardsInDeck={totalCardsInDeck}
                allRolesCatalog={rolesCatalog}
              />
            </div>
          )}

          {gameState === 'game' && (
            <div className="space-y-6">
              {roomStatus === 'room_assigned' && (
                <div className="space-y-5">
                  <div className="bg-gradient-to-r from-indigo-900/40 via-purple-900/40 to-blue-900/40 border border-indigo-500/50 p-5 rounded-2xl text-center shadow-xl space-y-3">
                    <div className="inline-block bg-indigo-500/20 text-indigo-300 text-xs px-3 py-1 rounded-full font-bold">
                      📍 第一階段：分配房間與實體就位
                    </div>
                    <h2 className="text-xl sm:text-2xl font-black text-white">請所有玩家移動至所屬的實體房間</h2>
                    <p className="text-xs sm:text-sm text-zinc-300 max-w-xl mx-auto">
                      全員就位前身分尚未發放。請確認自己所在的房間，等候全員移動完畢後由房長按下發放按鈕！
                    </p>

                    <div className="inline-flex items-center gap-2 bg-indigo-950 border border-indigo-400 px-4 py-2 rounded-xl mt-2">
                      <span className="text-xs text-indigo-200">你被分配到：</span>
                      <strong className="text-base text-amber-300 font-black">{myInfo.gameRoom || '未分配'}</strong>
                    </div>

                    {isHost ? (
                      <div className="pt-2">
                        <button
                          onClick={handleConfirmDealCardsAndStart}
                          className="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-zinc-950 font-black px-8 py-3.5 rounded-2xl text-base shadow-2xl transition active:scale-95"
                        >
                          🚀 全員就位完畢：發放身分並開始計時
                        </button>
                      </div>
                    ) : (
                      <div className="text-xs text-amber-400/90 font-medium animate-pulse pt-1">
                        ⏳ 請先前往所屬房間，等待房長確認全員就位...
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-zinc-900/80 border border-indigo-500/30 rounded-2xl p-4">
