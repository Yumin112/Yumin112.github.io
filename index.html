    const RoleMechanics = {
      getRoleAction(myRole, context) {
        if (!myRole) return null;
        if (ROLE_PLUGINS[myRole.id]) return ROLE_PLUGINS[myRole.id].getActionButton(context);

        const statusConfig = ROLE_STATUS_ACTIONS[myRole.id];
        if (statusConfig) {
          return {
            label: statusConfig.btnLabel,
            badge: statusConfig.badge,
            style: statusConfig.style,
            onClick: () => context.openGrantStatusModal(statusConfig)
          };
        }

        const clearConfig = ROLE_CLEAR_STATUS_ACTIONS[myRole.id];
        if (clearConfig) {
          return {
            label: clearConfig.btnLabel,
            badge: clearConfig.badge,
            style: clearConfig.style,
            onClick: () => context.openClearStatusModal(clearConfig)
          };
        }

        return null;
      },
      applyPlayerSwap(playersList, p1Id, p2Id, initiatorId = null) {
        const p1 = playersList.find(p => p.id === p1Id);
        const p2 = playersList.find(p => p.id === p2Id);
        if (!p1 || !p2) return playersList;

        const { role: role1, team: team1 } = p1;
        const { role: role2, team: team2 } = p2;

        return playersList.map(p => {
          if (p.id === p1Id) return { ...p, role: role2, team: team2 };
          if (p.id === p2Id) return { ...p, role: role1, team: team1 };
          return p;
        });
      },
      applyGrantStatus(playersList, targetPlayerId, statusObj) {
        return playersList.map(p => {
          if (p.id === targetPlayerId) {
            const currentStatuses = p.statuses || [];
            if (currentStatuses.some(s => s.id === statusObj.id)) return p;
            return { ...p, statuses: [...currentStatuses, statusObj] };
          }
          return p;
        });
      }
    };

          <div className="flex items-center gap-2">
            <div className="bg-zinc-800/80 border border-zinc-700 px-3 py-1.5 rounded-lg flex items-center gap-2">
              <span className="text-xs text-zinc-400">房號:</span>
              <span className="text-base font-mono font-bold tracking-widest text-amber-400">{roomId}</span>
              <span className="text-xs bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded">
                {isHost ? '房長' : '玩家'}
              </span>
            </div>
            <button
              onClick={onLeave}
              className="bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-300 hover:text-rose-200 text-xs px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 active:scale-95"
            >
              🚪 離開
            </button>
          </div>
        )}
      </header>
    );

    function App() {
      const rolesCatalog = window.OFFICIAL_ROLES_CATALOG || DEFAULT_ROLES;

      const [gameState, setGameState] = useState('home'); 
      const [roomId, setRoomId] = useState('');
      const [joinRoomInput, setJoinRoomInput] = useState('');
      const [playerName, setPlayerName] = useState('');
      const [myPlayerId, setMyPlayerId] = useState('');
      const [isHost, setIsHost] = useState(false);
      const [connStatus, setConnStatus] = useState('未連線');
      const [isVerifying, setIsVerifying] = useState(false);

      const [players, setPlayers] = useState([]);
      const [roomStatus, setRoomStatus] = useState('waiting');
      const [buriedCard, setBuriedCard] = useState(null);

      const [roundSettings, setRoundSettings] = useState([3, 2, 1]); 
      const [currentRoundIndex, setCurrentRoundIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(180);
      const [roundEndTime, setRoundEndTime] = useState(0);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      const [roleCounts, setRoleCounts] = useState({ pres: 1, bomb: 1, doctor: 1, engineer: 1 });
      const [isColorOnly, setIsColorOnly] = useState(false);

      // 通用彈窗與機制 State
      const [showSwapTargetModal, setShowSwapTargetModal] = useState(false);
      const [swapModalConfig, setSwapModalConfig] = useState(null);
      const [swapRequestData, setSwapRequestData] = useState(null); 
      const [swapStatusMessage, setSwapStatusMessage] = useState('');

      const [showGrantStatusModal, setShowGrantStatusModal] = useState(false);
      const [activeStatusConfig, setActiveStatusConfig] = useState(null);
      const [statusPromptData, setStatusPromptData] = useState(null);

      const [showSeerModal, setShowSeerModal] = useState(false);
      const [seerCountdown, setSeerCountdown] = useState(30);

      const [showWhiteTeamModal, setShowWhiteTeamModal] = useState(false);
      const [showGamblerModal, setShowGamblerModal] = useState(false);

      const [gameResult, setGameResult] = useState(null);

      const clientRef = useRef(null);
      const timerIntervalRef = useRef(null);
      const seerTimerRef = useRef(null);
      const cardRef = useRef(null);
      const latestStateRef = useRef({});

      useEffect(() => {
        const stateSnapshot = {
          players, roomStatus, roundSettings, roleCounts, currentRoundIndex,
          timeLeft, roundEndTime, isTimerRunning, isHost, roomId, myPlayerId, playerName,
          gameState, buriedCard, gameResult
        };
        latestStateRef.current = stateSnapshot;

        if (roomId && myPlayerId) {
          const myProfile = players.find(p => p.id === myPlayerId);
          StorageManager.saveContext({ ...stateSnapshot, myProfile });
        }
      }, [players, roomStatus, roundSettings, roleCounts, currentRoundIndex, timeLeft, roundEndTime, isTimerRunning, isHost, roomId, myPlayerId, playerName, gameState, buriedCard, gameResult]);

      const myInfo = useMemo(() => {
        return players.find(p => p.id === myPlayerId) || {
          name: playerName, team: null, role: null, gameRoom: null, statuses: [],
          hasUsedCapitalistAbility: false, hasUsedSocialistAbility: false, gamblerBet: null
        };
      }, [players, myPlayerId, playerName]);

      const isCardCloaked = useMemo(() => {
        return Boolean(myInfo.statuses?.some(s => s.id === 'card_cloaked'));
      }, [myInfo.statuses]);

      const myTeamMeta = useMemo(() => getTeamMeta(myInfo.team), [myInfo.team]);

      const publishMsg = useCallback((topic, payload, opts = { qos: 1 }) => {
        if (clientRef.current?.connected) {
          clientRef.current.publish(topic, JSON.stringify(payload), opts);
        }
      }, []);

      const broadcastLatest = useCallback((override = {}) => {
        const s = { ...latestStateRef.current, ...override };
        if (!s.roomId) return;
        publishMsg(`trb_game_sync_room_${s.roomId}`, {
          type: 'FULL_SYNC',
          senderId: s.myPlayerId,
          players: s.players,
          roomStatus: s.roomStatus,
          roleCounts: s.roleCounts,
          roundSettings: s.roundSettings,
          currentRoundIndex: s.currentRoundIndex,
          timeLeft: s.timeLeft,
          roundEndTime: s.roundEndTime,
          buriedCard: s.buriedCard,
          gameResult: s.gameResult
        });
      }, [publishMsg]);

      const resetToHome = useCallback(() => {
        if (seerTimerRef.current) clearInterval(seerTimerRef.current);
        if (clientRef.current) {
          try { clientRef.current.end(true); } catch {}
          clientRef.current = null;
        }
        StorageManager.clearSession();
        setRoomId('');
        setIsHost(false);
        setPlayers([]);
        setGameState('home');
        setRoomStatus('waiting');
        setIsTimerRunning(false);
        setSwapRequestData(null);
        setShowGrantStatusModal(false);
        setStatusPromptData(null);
        setShowSeerModal(false);
        setShowWhiteTeamModal(false);
        setShowGamblerModal(false);
        setSwapStatusMessage('');
        setConnStatus('未連線');
      }, []);

      const setupConnection = useCallback((code, asHost, name, uid) => {
        setConnStatus('連線伺服器中...');
        const topic = `trb_game_sync_room_${code}`;

        if (clientRef.current) {
          try { clientRef.current.end(true); } catch {}
        }

        const client = mqtt.connect(BROKER_URL, {
          clientId: `trb_${uid}_${Math.random().toString(16).substring(2, 8)}`,
          username: MQTT_USER,
          password: MQTT_PASS,
          clean: true,
          reconnectPeriod: 2000
        });
        clientRef.current = client;

        client.on('connect', () => {
          setConnStatus('🟢 已連線');
          client.subscribe(topic, { qos: 1 });
          const currentProfile = latestStateRef.current.players?.find(p => p.id === uid) || {
            id: uid, name: name.trim(), isHost: asHost, team: null, role: null, gameRoom: null, statuses: []
          };
          publishMsg(topic, { type: 'PLAYER_PING_SYNC', senderId: uid, isHost: asHost, player: currentProfile });
        });

        client.on('message', (t, msg) => {
          const data = safeJsonParse(msg.toString());
          if (!data) return;

          // 房長專用邏輯
          if (latestStateRef.current.isHost) {
            if (data.type === 'EXECUTE_SWAP') {
              setPlayers(prev => {
                let next = RoleMechanics.applyPlayerSwap(prev, data.player1Id, data.player2Id);
                // 額外狀態處理 (盜身魔 / 身分竊賊)
                if (data.extraActionType === 'BODY_SNATCH') {
                  next = RoleMechanics.applyGrantStatus(next, data.player1Id, { id: 'shy', name: '害羞', icon: '🙈' });
                } else if (data.extraActionType === 'IDENTITY_THEFT') {
                  next = RoleMechanics.applyGrantStatus(next, data.player1Id, { id: 'card_cloaked', name: '隱匿', icon: '😶‍🌫️' });
                }
                setTimeout(() => broadcastLatest({ players: next }), 50);
                return next;
              });
              return;
            }

            if (data.type === 'EXECUTE_FORCE_TRANSFORM') {
              setPlayers(prev => {
                const next = prev.map(p => {
                  if (p.id === data.targetId) {
                    return {
                      ...p,
                      team: data.newTeam,
                      role: { id: `${data.newTeam}_team`, name: `${data.newTeam === 'blue' ? '藍' : '紅'}隊成員`, team: data.newTeam, icon: data.newTeam === 'blue' ? '🔵' : '🔴', desc: '由特殊角色能力轉化而成。' }
                    };
                  }
                  if (p.id === data.initiatorId) {
                    if (data.abilityKey === 'capitalist') return { ...p, hasUsedCapitalistAbility: true };
                    if (data.abilityKey === 'socialist') return { ...p, hasUsedSocialistAbility: true };
                  }
                  return p;
                });
                setTimeout(() => broadcastLatest({ players: next }), 50);
                return next;
              });
              return;
            }

            if (data.type === 'EXECUTE_GRANT_STATUS') {
              setPlayers(prev => {
                const next = RoleMechanics.applyGrantStatus(prev, data.targetId, data.statusObj);
                setTimeout(() => broadcastLatest({ players: next }), 50);
                return next;
              });
              return;
            }
          }

          // 所有玩家通訊接收
          if (data.senderId === uid) return;

          switch (data.type) {
            case 'SWAP_REQUEST':
              if (String(data.targetId) === String(uid)) {
                setSwapRequestData(data);
              }
              break;
            case 'SWAP_REJECTED':
              if (data.fromId === uid) {
                if (data.isHunterCounter) {
                  setSwapStatusMessage('🏹 對方是獵人！你的請求被拒絕，且你的身分卡已被遮蔽！');
                } else {
                  setSwapStatusMessage('❌ 對方拒絕了交換請求！');
                }
                setTimeout(() => setSwapStatusMessage(''), 3500);
              }
              break;
            case 'FULL_SYNC':
              setPlayers(data.players);
              setRoomStatus(data.roomStatus);
              setCurrentRoundIndex(data.currentRoundIndex);
              setTimeLeft(data.timeLeft);
              if (data.gameResult !== undefined) setGameResult(data.gameResult);
              break;
          }
        });
      }, [publishMsg, broadcastLatest]);

      // 通靈者 30 秒倒數計時
      useEffect(() => {
        if (showSeerModal) {
          if (seerTimerRef.current) clearInterval(seerTimerRef.current);
          seerTimerRef.current = setInterval(() => {
            setSeerCountdown(prev => {
              if (prev <= 1) {
                clearInterval(seerTimerRef.current);
                setShowSeerModal(false);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          if (seerTimerRef.current) clearInterval(seerTimerRef.current);
        }
        return () => {
          if (seerTimerRef.current) clearInterval(seerTimerRef.current);
        };
      }, [showSeerModal]);

      // 發送交換或轉換請求
      const handleSendSwapRequest = (targetPlayer) => {
        setShowSwapTargetModal(false);
        if (!targetPlayer || targetPlayer.id === myPlayerId) return;

        setSwapStatusMessage(`已向 ${targetPlayer.name} 發送請求，等待對方確認中...`);
        publishMsg(`trb_game_sync_room_${roomId}`, {
          type: 'SWAP_REQUEST',
          senderId: myPlayerId,
          fromId: myPlayerId,
          fromName: myInfo.name,
          fromRoleName: isCardCloaked ? '神秘玩家' : (myInfo.role?.name || '未知角色'),
          fromTeam: myInfo.team,
          targetId: targetPlayer.id,
          extraActionType: swapModalConfig?.extraActionType || null
        });
      };

      // 確認接受請求
      const handleAcceptSwap = () => {
        if (!swapRequestData) return;
        const { fromId: p1Id, extraActionType } = swapRequestData;
        const p2Id = myPlayerId;
        setSwapRequestData(null);

        if (extraActionType === 'CAPITALIST_FORCE_BLUE') {
          publishMsg(`trb_game_sync_room_${roomId}`, {
            type: 'EXECUTE_FORCE_TRANSFORM', senderId: myPlayerId, initiatorId: p1Id, targetId: p2Id, newTeam: 'blue', abilityKey: 'capitalist'
          });
        } else if (extraActionType === 'SOCIALIST_FORCE_RED') {
          publishMsg(`trb_game_sync_room_${roomId}`, {
            type: 'EXECUTE_FORCE_TRANSFORM', senderId: myPlayerId, initiatorId: p1Id, targetId: p2Id, newTeam: 'red', abilityKey: 'socialist'
          });
        } else {
          publishMsg(`trb_game_sync_room_${roomId}`, {
            type: 'EXECUTE_SWAP', senderId: myPlayerId, player1Id: p1Id, player2Id: p2Id, extraActionType
          });
        }
      };

      // 拒絕請求（含獵人反擊機制）
      const handleRejectSwap = (isHunterCounter = false) => {
        if (!swapRequestData) return;
        publishMsg(`trb_game_sync_room_${roomId}`, {
          type: 'SWAP_REJECTED',
          senderId: myPlayerId,
          fromId: swapRequestData.fromId,
          isHunterCounter
        });

        // 獵人主動反擊遮蔽對方
        if (isHunterCounter) {
          publishMsg(`trb_game_sync_room_${roomId}`, {
            type: 'EXECUTE_GRANT_STATUS',
            senderId: myPlayerId,
            targetId: swapRequestData.fromId,
            statusObj: { id: 'card_cloaked', name: '隱匿(被遮蔽)', icon: '😶‍🌫️' }
          });
          setSwapStatusMessage('🏹 獵人反擊成功！已遮蔽發起者的身分卡！');
          setTimeout(() => setSwapStatusMessage(''), 3000);
        }
        setSwapRequestData(null);
      };

      // 白隊自主換隊
      const handleWhiteTeamTransform = (chosenTeam) => {
        setShowWhiteTeamModal(false);
        setPlayers(prev => prev.map(p => {
          if (p.id === myPlayerId) {
            return {
              ...p,
              team: chosenTeam,
              role: { id: `${chosenTeam}_team`, name: `${chosenTeam === 'blue' ? '藍' : '紅'}隊成員`, team: chosenTeam, icon: chosenTeam === 'blue' ? '🔵' : '🔴', desc: '白隊成員最終轉化。' }
            };
          }
          return p;
        }));
        publishMsg(`trb_game_sync_room_${roomId}`, {
          type: 'EXECUTE_FORCE_TRANSFORM', senderId: myPlayerId, initiatorId: myPlayerId, targetId: myPlayerId, newTeam: chosenTeam, abilityKey: 'white_team'
        });
      };

      // 賭徒下注預測
      const handleGamblerBet = (betChoice) => {
        setShowGamblerModal(false);
        setPlayers(prev => prev.map(p => p.id === myPlayerId ? { ...p, gamblerBet: betChoice } : p));
        setSwapStatusMessage(`🎲 下注成功！你預測【${betChoice}】獲勝。`);
        setTimeout(() => setSwapStatusMessage(''), 3000);
      };

      return (
        <div className="max-w-4xl mx-auto pb-12">
          <Header
            connStatus={connStatus}
            roomId={roomId}
            playersCount={players.length}
            isHost={isHost}
            onLeave={resetToHome}
          />

          {gameState === 'home' && (
            <div className="max-w-md mx-auto bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-xl mt-6 space-y-4">
              <div>
                <label className="block text-sm font-medium text-zinc-300 mb-1">您的暱稱</label>
                <input
                  type="text"
                  value={playerName}
                  onChange={(e) => setPlayerName(e.target.value)}
                  placeholder="輸入暱稱"
                  className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-white focus:outline-none"
                />
              </div>

              <button
                type="button"
                onClick={() => {
                  const code = Math.floor(100000 + Math.random() * 900000).toString();
                  const name = playerName.trim() || '房長';
                  const uid = StorageManager.getUid();
                  setMyPlayerId(uid);
                  setRoomId(code);
                  setIsHost(true);
                  setGameState('game');
                  setPlayers([{ id: uid, name, isHost: true, team: 'blue', role: DEFAULT_ROLES[0], statuses: [] }]);
                  setupConnection(code, true, name, uid);
                }}
                className="w-full bg-gradient-to-r from-red-600 to-blue-600 hover:opacity-90 text-white font-semibold py-3 rounded-xl transition shadow active:scale-95"
              >
                👑 快速建立測試房間
              </button>
            </div>
          )}

          {gameState === 'game' && (
            <div className="space-y-6">
              {swapStatusMessage && (
                <div className="max-w-sm mx-auto border text-xs px-4 py-2.5 rounded-xl text-center font-bold animate-pulse bg-emerald-500/20 border-emerald-500 text-emerald-300">
                  {swapStatusMessage}
                </div>
              )}

              {/* 核心身分卡展示區 */}
              <div className="max-w-sm mx-auto">
                <div
                  ref={cardRef}
                  className={`select-none rounded-2xl p-6 flex flex-col justify-between shadow-2xl border-2 min-h-[350px] transition-all duration-150 ${
                    isCardCloaked 
                      ? 'bg-gradient-to-br from-teal-950 via-zinc-950 to-cyan-950 border-teal-500/70 shadow-cyan-950/50' 
                      : myTeamMeta.cardBg
                  }`}
                >
                  <div className="flex justify-between items-start">
                    <span className={`text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wider border ${
                      isCardCloaked ? 'bg-teal-500/20 text-teal-300 border-teal-400/40' : myTeamMeta.badge
                    }`}>
                      {isCardCloaked ? '??? 陣營未知' : myTeamMeta.label}
                    </span>
                    <span className="text-3xl">{isCardCloaked ? '😶‍🌫️' : (myInfo.role?.icon || '⭐')}</span>
                  </div>

                  {isCardCloaked ? (
                    <div className="text-center my-4 space-y-2">
                      <h2 className="text-2xl font-black text-teal-300 tracking-wider">😶‍🌫️ 身分已被遮蔽</h2>
                      <div className="p-3 bg-zinc-950/80 border border-teal-800/60 rounded-xl space-y-1">
                        <p className="text-xs font-bold text-teal-200">你的資訊已被完全遮蔽！</p>
                        <p className="text-[11px] text-zinc-400 leading-relaxed">
                          本局身分、隊伍顏色與角色能力說明已被遮蔽。原角色技能仍可使用（按鈕文字已隱匿）。
                        </p>
                      </div>
                    </div>
                  ) : (
                    <div className="text-center my-3">
                      <h2 className="text-2xl font-black text-white">{myInfo.role?.name || '身分載入中...'}</h2>
                      <p className="text-xs text-zinc-200 mt-2.5 px-3 leading-relaxed bg-zinc-950/60 py-2.5 rounded-xl border border-zinc-800 break-words">
                        {myInfo.role?.desc || '暫無專屬說明'}
                      </p>
                    </div>
                  )}

                  {/* 特殊狀態展示 */}
                  {myInfo.statuses && myInfo.statuses.length > 0 && (
                    <div className="bg-zinc-950/80 border border-purple-500/40 rounded-xl p-2.5 my-2 space-y-1">
                      <div className="text-[11px] font-bold text-purple-300">✨ 你目前持有的特殊狀態：</div>
                      <div className="flex flex-wrap gap-1.5">
                        {myInfo.statuses.map(st => (
                          <span key={st.id} className="text-xs bg-purple-500/20 text-purple-200 border border-purple-400/50 px-2 py-0.5 rounded-md font-semibold flex items-center gap-1">
                            <span>{st.icon}</span>
                            <span>{st.name}</span>
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 角色技能按鈕 */}
                  {(() => {
                    const action = RoleMechanics.getRoleAction(myInfo.role, {
                      currentRoundIndex, roundSettings, buriedCard, timeLeft, myPlayerState: myInfo,
                      openSwapModal: (config) => {
                        setSwapModalConfig(config);
                        setShowSwapTargetModal(true);
                      },
                      openSeerModal: () => { setSeerCountdown(30); setShowSeerModal(true); },
                      openWhiteTeamModal: () => setShowWhiteTeamModal(true),
                      openGamblerModal: () => setShowGamblerModal(true)
                    });

                    if (!action) return null;

                    return (
                      <div className="my-2">
                        <button
                          type="button"
                          onClick={action.onClick}
                          className={`w-full font-black py-2.5 px-4 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-sm border ${
                            isCardCloaked
                              ? 'bg-gradient-to-r from-teal-700 via-teal-800 to-cyan-900 border-teal-400 text-teal-100 hover:from-teal-600 hover:to-cyan-800'
                              : `bg-gradient-to-r ${action.style}`
                          }`}
                        >
                          <span>{isCardCloaked ? '⚡ 發動技能' : action.label}</span>
                          {action.badge && !isCardCloaked && (
                            <span className="text-xs bg-zinc-950/30 px-2 py-0.5 rounded-full text-zinc-900">
                              {action.badge}
                            </span>
                          )}
                        </button>
                      </div>
                    );
                  })()}

                  <div className="text-[11px] text-zinc-400 text-center bg-zinc-950/40 py-1.5 rounded-lg border border-zinc-800/60">
                    玩家: <strong className="text-zinc-200">{myInfo.name}</strong>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：通用目標玩家選擇 (盜身魔 / 身分竊賊 / 資本家 / 社會主義者) */}
          {showSwapTargetModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-indigo-500/80 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                  <h3 className="text-base font-bold text-white">選擇目標玩家</h3>
                  <button onClick={() => setShowSwapTargetModal(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>
                {swapModalConfig?.ruleDesc && <p className="text-xs text-zinc-300">{swapModalConfig.ruleDesc}</p>}

                <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
                  {players.filter(p => p.id !== myPlayerId).map(p => (
                    <button
                      key={p.id}
                      type="button"
                      onClick={() => handleSendSwapRequest(p)}
                      className="w-full text-left p-3 rounded-xl border border-zinc-700 bg-zinc-800/80 hover:bg-zinc-700 hover:border-indigo-400 transition flex items-center justify-between cursor-pointer active:scale-95"
                    >
                      <span className="font-bold text-sm text-zinc-100">{p.name}</span>
                      <span className="text-xs text-indigo-300 bg-indigo-950/60 px-2 py-1 rounded-md">選取</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：被發起交換/轉換請求確認 (含獵人反擊判定) */}
          {swapRequestData && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border-2 border-amber-500 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 text-center">
                <div className="text-4xl animate-bounce">⚡</div>
                <h3 className="text-lg font-black text-white">收到技能 / 身分請求！</h3>
                <p className="text-sm text-zinc-300 leading-relaxed">
                  來自玩家 <strong className="text-amber-400 font-bold">{swapRequestData.fromName}</strong> 
                  （身分：{swapRequestData.fromRoleName}）對你發動了請求：
                  <span className="block mt-1 font-bold text-indigo-300">
                    {swapRequestData.extraActionType === 'BODY_SNATCH' && '「交換身分，並將你變為【害羞】」'}
                    {swapRequestData.extraActionType === 'IDENTITY_THEFT' && '「竊取你的身分，並將你的卡牌【遮蔽】」'}
                    {swapRequestData.extraActionType === 'CAPITALIST_FORCE_BLUE' && '「強迫將你的角色卡牌換為【藍隊成員】」'}
                    {swapRequestData.extraActionType === 'SOCIALIST_FORCE_RED' && '「強迫將你的角色卡牌換為【紅隊成員】」'}
                    {!swapRequestData.extraActionType && '「進行身分交換」'}
                  </span>
                </p>

                <div className="flex flex-col gap-2 pt-2">
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => handleRejectSwap(false)}
                      className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2.5 rounded-xl border border-zinc-700 transition active:scale-95 text-sm"
                    >
                      拒絕
                    </button>
                    <button
                      type="button"
                      onClick={handleAcceptSwap}
                      className="flex-1 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-black py-2.5 rounded-xl shadow transition active:scale-95 text-sm"
                    >
                      同意
                    </button>
                  </div>

                  {/* 獵人專屬反擊選項：若自己是獵人且發起者非同隊 */}
                  {(myInfo.role?.id === 'hunter_b' || myInfo.role?.id === 'hunter_r') && swapRequestData.fromTeam !== myInfo.team && (
                    <button
                      type="button"
                      onClick={() => handleRejectSwap(true)}
                      className="w-full bg-gradient-to-r from-rose-600 to-red-700 hover:from-rose-500 hover:to-red-600 text-white font-bold py-2.5 rounded-xl border border-red-400 transition active:scale-95 text-xs shadow"
                    >
                      🏹 獵人反擊：拒絕並遮蔽對方
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：白隊成員最終選邊站 */}
          {showWhiteTeamModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border-2 border-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 text-center">
                <div className="text-4xl animate-bounce">🏳️</div>
                <h3 className="text-lg font-black text-white">白隊成員：最終陣營選擇</h3>
                <p className="text-xs text-zinc-300">
                  依照規則，在最後一輪結束前你必須選擇歸屬於「藍隊成員」或「紅隊成員」：
                </p>

                <div className="flex gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => handleWhiteTeamTransform('blue')}
                    className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-xl transition active:scale-95 text-sm shadow"
                  >
                    🔵 成為藍隊成員
                  </button>
                  <button
                    type="button"
                    onClick={() => handleWhiteTeamTransform('red')}
                    className="flex-1 bg-red-600 hover:bg-red-500 text-white font-black py-3 rounded-xl transition active:scale-95 text-sm shadow"
                  >
                    🔴 成為紅隊成員
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：賭徒下注預測 */}
          {showGamblerModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border-2 border-amber-500 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 text-center">
                <div className="text-4xl animate-spin">🎲</div>
                <h3 className="text-lg font-black text-amber-300">賭徒：預測終局獲勝陣營</h3>
                <p className="text-xs text-zinc-300">
                  猜測遊戲結束時的獲勝隊伍，若最終判定與你的猜測相符，你將單獨獲勝：
                </p>

                <div className="grid grid-cols-2 gap-2.5 pt-2">
                  {['特殊陣營獲勝', '藍隊獲勝', '紅隊獲勝', '沒有隊伍獲勝'].map(choice => (
                    <button
                      key={choice}
                      type="button"
                      onClick={() => handleGamblerBet(choice)}
                      className={`p-2.5 rounded-xl border text-xs font-bold transition active:scale-95 ${
                        myInfo.gamblerBet === choice
                          ? 'bg-amber-500 text-zinc-950 border-amber-400 shadow'
                          : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border-zinc-700'
                      }`}
                    >
                      {choice}
                    </button>
                  ))}
                </div>

                <button
                  type="button"
                  onClick={() => setShowGamblerModal(false)}
                  className="w-full text-zinc-400 hover:text-white text-xs py-1"
                >
                  取消
                </button>
              </div>
            </div>
          )}

          {/* 彈窗：通靈者專屬全場透視視窗 */}
          {showSeerModal && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-3">
              <div className="bg-zinc-900 border-2 border-purple-500 w-full max-w-2xl max-h-[90vh] rounded-2xl flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-zinc-800 flex justify-between items-center bg-purple-950/40">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl animate-pulse">🔮</span>
                    <div>
                      <h3 className="font-black text-white text-base">通靈之眼：全場身分透視</h3>
                      <p className="text-[11px] text-purple-300">限第一輪前 30 秒查驗全體玩家陣營與角色</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="bg-rose-500/20 border border-rose-500/40 text-rose-300 px-3 py-1 rounded-lg text-xs font-bold animate-pulse">
                      ⏳ 剩餘 {seerCountdown} 秒自動關閉
                    </div>
                    <button onClick={() => setShowSeerModal(false)} className="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center">
                      ✕
                    </button>
                  </div>
                </div>

                <div className="p-4 overflow-y-auto space-y-2 flex-1">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    {players.map(p => {
                      const meta = getTeamMeta(p.team);
                      return (
                        <div key={p.id} className={`p-3 rounded-xl border flex items-center justify-between gap-3 ${meta.listBg}`}>
                          <div className="flex items-center gap-2.5">
                            <span className="text-2xl shrink-0">{p.role?.icon || '❓'}</span>
                            <div>
                              <div className="font-bold text-sm text-zinc-100 flex items-center gap-1.5">
                                <span>{p.name}</span>
                                {p.id === myPlayerId && <span className="text-xs text-indigo-400">(你)</span>}
                              </div>
                              <div className="text-xs text-zinc-300 font-semibold">{p.role?.name || '未知角色'}</div>
                            </div>
                          </div>
                          <span className={`text-[10px] px-2 py-0.5 rounded font-bold border shrink-0 ${meta.badge}`}>
                            {meta.label}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
