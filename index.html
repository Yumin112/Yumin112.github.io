<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Two Rooms and a Boom!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="./team.js"></script>
  <script src="./roles.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #09090b 100%);
      min-height: 100vh;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="p-2 sm:p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const BROKER_URL = 'wss://vff8e223.ala.asia-southeast1.emqxsl.com:8084/mqtt';
    const MQTT_USER = 'yumin112for2r1b!';
    const MQTT_PASS = '2r1bweb!';
    const DISCOVERY_TOPIC = 'trb_public_lobby_discovery';
    const SK = { UID: 'trb_uid_v6', ROOM: 'trb_room', NAME: 'trb_name', HOST: 'trb_host', CTX: 'trb_ctx' };

    const parseJSON = (str, fb = null) => { try { return JSON.parse(str); } catch { return fb; } };
    const formatTime = (s) => `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;

    const Storage = {
      getUid: () => {
        let u = localStorage.getItem(SK.UID);
        if (!u) { u = 'u_' + Math.random().toString(36).slice(2, 9); localStorage.setItem(SK.UID, u); }
        return u;
      },
      saveSession: (r, n, h) => { localStorage.setItem(SK.ROOM, r); localStorage.setItem(SK.NAME, n); localStorage.setItem(SK.HOST, String(h)); },
      saveCtx: (c) => localStorage.setItem(SK.CTX, JSON.stringify({ ...c, savedAt: Date.now() })),
      getCtx: () => parseJSON(localStorage.getItem(SK.CTX), {}),
      clear: () => Object.values(SK).forEach(k => k !== SK.UID && localStorage.removeItem(k))
    };

    const getTeamMeta = (t) => {
      const k = (t || '').toLowerCase();
      const m = (window.OFFICIAL_TEAM_CONFIG && window.OFFICIAL_TEAM_CONFIG[0]) || {};
      if (k === 'gray' && m.grey) return m.grey;
      if (m[k]) return m[k];
      return { label: `${t || '未知'}隊`, cardBg: 'bg-zinc-900 border-zinc-700', badge: 'bg-zinc-800 text-zinc-300 border-zinc-600', listBg: 'bg-zinc-900 border-zinc-800' };
    };

    const getHostageCount = (cnt, rds, idx) => {
      const sch = cnt <= 10 ? [1,1,1,1,1] : cnt <= 13 ? [2,2,2,1,1] : cnt <= 17 ? [3,2,2,1,1] : cnt <= 21 ? [4,3,2,1,1] : [5,4,3,2,1];
      return (rds === 3 ? sch.slice(2) : sch)[idx] || 1;
    };

    // 特殊狀態賦予技能設定
    const STATUS_MAP = {
      zombie: { id: 'infected', name: '感染 (殭屍病毒)', icon: '🧟', label: '🧟 賦予感染狀態', style: 'from-emerald-600 to-green-700 text-white' },
      cult_leader: { id: 'cultist', name: '信徒', icon: '🛐', label: '🛐 吸收為信徒', style: 'from-purple-600 to-violet-800 text-white' },
      thug_b: { id: 'coy', name: '靦腆', icon: '🥊', label: '🥊 賦予靦腆狀態', style: 'from-rose-600 to-red-700 text-white' },
      thug_r: { id: 'coy', name: '靦腆', icon: '🥊', label: '🥊 賦予靦腆狀態', style: 'from-rose-600 to-red-700 text-white' },
      dealer_b: { id: 'foolish', name: '愚蠢', icon: '🃏', label: '🃏 賦予愚蠢狀態', style: 'from-amber-600 to-yellow-600 text-zinc-950' },
      dealer_r: { id: 'foolish', name: '愚蠢', icon: '🃏', label: '🃏 賦予愚蠢狀態', style: 'from-amber-600 to-yellow-600 text-zinc-950' },
      criminal_b: { id: 'shy', name: '害羞', icon: '🦹', label: '🦹 賦予害羞狀態', style: 'from-indigo-600 to-blue-700 text-white' },
      criminal_r: { id: 'shy', name: '害羞', icon: '🦹', label: '🦹 賦予害羞狀態', style: 'from-indigo-600 to-blue-700 text-white' }
    };

    const RoleMechanics = {
      getAction(role, ctx) {
        if (!role) return null;
        if (role.id === 'hot_potato') return { label: '🔄 身分交換', style: 'from-amber-500 to-orange-600 text-zinc-950', onClick: () => ctx.openSwap('🥔 燙手山芋：交換給互動玩家', () => false) };
        if (role.id === 'leprechaun') return { label: '🔄 身分交換', style: 'from-emerald-500 to-teal-600 text-zinc-950', onClick: () => ctx.openSwap('🍀 小妖精：曾當過者不可再換', t => Boolean(t.hasBeenLep)) };
        if (role.id === 'drunk' && ctx.curRound === ctx.maxRounds - 1 && ctx.buried) return { label: '🍺 換取埋葬卡', style: 'from-purple-500 to-amber-500 text-zinc-950', onClick: ctx.openDrunk };
        if (role.id.startsWith('mad_scientist_') && !ctx.me?.usedMad) return { label: '🧪 操控角色對調', style: 'from-lime-500 to-emerald-600 text-zinc-950', onClick: ctx.openScientist };
        
        if (STATUS_MAP[role.id]) {
          const cfg = STATUS_MAP[role.id];
          return { label: cfg.label, style: cfg.style, onClick: () => ctx.openStatus(cfg) };
        }
        return null;
      },
      swapPlayers(list, p1Id, p2Id, initId) {
        const p1 = list.find(p => p.id === p1Id), p2 = list.find(p => p.id === p2Id);
        if (!p1 || !p2) return list;
        return list.map(p => {
          const used = initId && p.id === initId ? true : p.usedMad;
          if (p.id === p1Id) return { ...p, role: p2.role, team: p2.team, hasBeenLep: p.hasBeenLep || p2.role?.id === 'leprechaun', usedMad: used };
          if (p.id === p2Id) return { ...p, role: p1.role, team: p1.team, hasBeenLep: p.hasBeenLep || p1.role?.id === 'leprechaun', usedMad: used };
          return { ...p, usedMad: used };
        });
      },
      grantStatus(list, targetId, status) {
        return list.map(p => p.id === targetId ? { ...p, statuses: (p.statuses || []).some(s => s.id === status.id) ? p.statuses : [...(p.statuses || []), status] } : p);
      }
    };

    function App() {
      const rolesCatalog = window.OFFICIAL_ROLES_CATALOG || [];
      const [gameState, setGameState] = useState('home');
      const [roomId, setRoomId] = useState('');
      const [joinInput, setJoinInput] = useState('');
      const [name, setName] = useState('');
      const [uid, setUid] = useState(Storage.getUid());
      const [isHost, setIsHost] = useState(false);
      const [conn, setConn] = useState('未連線');
      const [isVerifying, setIsVerifying] = useState(false);

      const [players, setPlayers] = useState([]);
      const [status, setStatus] = useState('waiting');
      const [buried, setBuried] = useState(null);
      const [roundSettings, setRoundSettings] = useState([3, 2, 1]);
      const [roundIdx, setRoundIdx] = useState(0);
      const [timeLeft, setTimeLeft] = useState(180);
      const [timerRunning, setTimerRunning] = useState(false);
      const [roleCounts, setRoleCounts] = useState({ pres: 1, bomb: 1, doctor: 1, engineer: 1 });
      const [gameResult, setGameResult] = useState(null);

      // 互動彈窗
      const [isColorOnly, setIsColorOnly] = useState(false);
      const [showDeck, setShowDeck] = useState(false);
      const [tempRoles, setTempRoles] = useState({});
      const [showRoundModal, setShowRoundModal] = useState(false);
      const [tempRounds, setTempRounds] = useState([3, 2, 1]);
      const [msg, setMsg] = useState('');
      
      const [swapModal, setSwapModal] = useState(null);
      const [swapReq, setSwapReq] = useState(null);
      const [drunkModal, setDrunkModal] = useState(false);
      const [statusModal, setStatusModal] = useState(null);
      const [statusReq, setStatusReq] = useState(null);
      const [scientistModal, setScientistModal] = useState(false);
      const [scientistTargets, setScientistTargets] = useState([]);
      const [scientistReq, setScientistReq] = useState(null);
      const [victoryModal, setVictoryModal] = useState(false);
      const [victoryStep, setVictoryStep] = useState(1);
      const [victoryAns, setVictoryAns] = useState({});

      const clientRef = useRef(null);
      const timerRef = useRef(null);
      const scientistVotesRef = useRef(null);
      const syncRef = useRef({});

      syncRef.current = { roomId, uid, isHost, name, players, status, buried, roundSettings, roundIdx, timeLeft, roleCounts, gameResult, timerRunning };

      const myInfo = useMemo(() => players.find(p => p.id === uid) || { name, id: uid, statuses: [] }, [players, uid, name]);
      const totalCards = useMemo(() => Object.values(roleCounts).reduce((s, c) => s + (c || 0), 0), [roleCounts]);
      const meta = useMemo(() => getTeamMeta(myInfo.team), [myInfo.team]);

      const pub = useCallback((topic, data, qos = 1) => {
        if (clientRef.current?.connected) clientRef.current.publish(topic, JSON.stringify(data), { qos });
      }, []);

      const broadcast = useCallback((override = {}) => {
        const s = { ...syncRef.current, ...override };
        if (!s.roomId) return;
        pub(`trb_game_sync_room_${s.roomId}`, { type: 'SYNC', ...s });
      }, [pub]);

      const showNotify = (text, ms = 3000) => { setMsg(text); setTimeout(() => setMsg(''), ms); };

      const connectMqtt = useCallback((code, host, pName, pUid) => {
        setConn('連線中...');
        const topic = `trb_game_sync_room_${code}`;
        if (clientRef.current) try { clientRef.current.end(true); } catch {}

        const cl = mqtt.connect(BROKER_URL, { clientId: `trb_${pUid}_${Math.random().toString(16).slice(2, 6)}`, username: MQTT_USER, password: MQTT_PASS, clean: true });
        clientRef.current = cl;

        cl.on('connect', () => {
          setConn('🟢 已連線');
          cl.subscribe(topic);
          if (host) cl.subscribe(DISCOVERY_TOPIC, { qos: 0 });
          const me = syncRef.current.players.find(p => p.id === pUid) || { id: pUid, name: pName, isHost: host, statuses: [] };
          if (host) broadcast(); else pub(topic, { type: 'JOIN', player: me });
        });

        cl.on('message', (t, m) => {
          const d = parseJSON(m.toString());
          if (!d) return;
          const s = syncRef.current;

          if (t === DISCOVERY_TOPIC && d.type === 'DISC_REQ' && s.isHost) {
            pub(DISCOVERY_TOPIC, { type: 'DISC_RES', roomId: s.roomId, host: s.name, count: s.players.length, status: s.status }, 0);
            return;
          }
          if (d.type === 'DISBAND') { alert('房間已解散！'); resetAll(); return; }

          if (s.isHost) {
            if (d.type === 'CHECK_NAME') {
              const dup = s.players.some(p => p.id !== d.senderId && p.name === d.name);
              pub(topic, { type: dup ? 'REJECT_NAME' : 'VERIFIED', targetId: d.senderId });
              return;
            }
            if (d.type === 'JOIN') {
              setPlayers(prev => {
                const next = prev.some(p => p.id === d.player.id) ? prev.map(p => p.id === d.player.id ? { ...p, ...d.player } : p) : [...prev, d.player];
                setTimeout(() => broadcast({ players: next }), 50);
                return next;
              });
              return;
            }
            if (d.type === 'EXEC_SWAP') {
              setPlayers(prev => {
                const next = RoleMechanics.swapPlayers(prev, d.p1, d.p2, d.initiator);
                pub(topic, { type: 'SWAP_DONE', p1: d.p1, p2: d.p2 });
                setTimeout(() => broadcast({ players: next }), 50);
                return next;
              });
              return;
            }
            if (d.type === 'EXEC_DRUNK') {
              const curB = s.buried;
              if (curB) {
                const target = s.players.find(p => p.id === d.playerId);
                const nextB = target?.role;
                const next = s.players.map(p => p.id === d.playerId ? { ...p, role: curB, team: curB.team } : p);
                setBuried(nextB); setPlayers(next);
                broadcast({ players: next, buriedCard: nextB });
              }
              return;
            }
            if (d.type === 'EXEC_STATUS') {
              setPlayers(prev => {
                const next = RoleMechanics.grantStatus(prev, d.targetId, d.status);
                pub(topic, { type: 'STATUS_DONE', targetId: d.targetId, initiatorId: d.initiatorId, name: d.status.name });
                setTimeout(() => broadcast({ players: next }), 50);
                return next;
              });
              return;
            }
            if (d.type === 'SCIENTIST_INIT') {
              scientistVotesRef.current = { p1: d.p1, p2: d.p2, init: d.initiator, approvals: {} };
              pub(topic, { type: 'SCIENTIST_PROMPT', ...d });
              return;
            }
            if (d.type === 'SCIENTIST_VOTE') {
              const v = scientistVotesRef.current;
              if (!v) return;
              if (d.ok) {
                v.approvals[d.uid] = true;
                if (v.approvals[v.p1.id] && v.approvals[v.p2.id]) {
                  setPlayers(prev => {
                    const next = RoleMechanics.swapPlayers(prev, v.p1.id, v.p2.id, v.init.id);
                    pub(topic, { type: 'SCIENTIST_OK', p1Id: v.p1.id, p2Id: v.p2.id, initId: v.init.id });
                    setTimeout(() => broadcast({ players: next }), 50);
                    return next;
                  });
                  scientistVotesRef.current = null;
                }
              } else {
                pub(topic, { type: 'SCIENTIST_NO', initId: v.init.id, name: d.name });
                scientistVotesRef.current = null;
              }
              return;
            }
          }

          // 客戶端訊息
          if (d.type === 'SWAP_PROMPT' && d.targetId === pUid) setSwapReq(d);
          if (d.type === 'SWAP_NO' && d.initId === pUid) showNotify('對方拒絕了身分交換！');
          if (d.type === 'SWAP_DONE' && (d.p1 === pUid || d.p2 === pUid)) showNotify('🎉 身分交換成功！');

          if (d.type === 'STATUS_PROMPT' && d.targetId === pUid) setStatusReq(d);
          if (d.type === 'STATUS_NO' && d.initId === pUid) showNotify(`${d.name} 拒絕了狀態賦予！`);
          if (d.type === 'STATUS_DONE') {
            if (d.initiatorId === pUid) showNotify(`🎉 成功賦予【${d.name}】！`);
            if (d.targetId === pUid) showNotify(`✨ 你獲得了【${d.name}】狀態！`);
          }

          if (d.type === 'SCIENTIST_PROMPT' && (d.p1.id === pUid || d.p2.id === pUid)) setScientistReq(d);
          if (d.type === 'SCIENTIST_NO' && d.initId === pUid) showNotify(`❌ ${d.name} 拒絕了角色對調！`);
          if (d.type === 'SCIENTIST_OK') {
            if (d.initId === pUid) showNotify('🎉 角色對調成功完成！');
            if (d.p1Id === pUid || d.p2Id === pUid) { setScientistReq(null); showNotify('🎉 你的角色已被對調！'); }
          }

          if (d.type === 'SYNC') {
            setPlayers(d.players); setStatus(d.status);
            if (d.roleCounts) setRoleCounts(d.roleCounts);
            if (d.roundSettings) setRoundSettings(d.roundSettings);
            setRoundIdx(d.roundIdx); setTimeLeft(d.timeLeft);
            if (d.buriedCard !== undefined) setBuried(d.buriedCard);
            if (d.gameResult !== undefined) setGameResult(d.gameResult);
            setGameState(d.status === 'waiting' ? 'lobby' : 'game');
            setTimerRunning(d.status === 'round_active');
          }
        });
      }, [pub, broadcast]);

      const resetAll = () => {
        if (clientRef.current) try { clientRef.current.end(true); } catch {}
        Storage.clear();
        setRoomId(''); setIsHost(false); setPlayers([]); setBuried(null); setGameResult(null);
        setGameState('home'); setStatus('waiting'); setTimerRunning(false); setConn('未連線');
      };

      useEffect(() => {
        const r = localStorage.getItem(SK.ROOM), n = localStorage.getItem(SK.NAME), h = localStorage.getItem(SK.HOST) === 'true';
        if (r && n) {
          setRoomId(r); setName(n); setIsHost(h);
          const c = Storage.getCtx();
          if (c.status) { setStatus(c.status); setGameState(c.status === 'waiting' ? 'lobby' : 'game'); setPlayers(c.players || []); }
          connectMqtt(r, h, n, uid);
        }
      }, [connectMqtt, uid]);

      // 計時器
      useEffect(() => {
        if (timerRunning && status === 'round_active' && timeLeft > 0) {
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                if (syncRef.current.isHost) { setStatus('round_paused'); setTimerRunning(false); broadcast({ status: 'round_paused', timeLeft: 0 }); }
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else clearInterval(timerRef.current);
        return () => clearInterval(timerRef.current);
      }, [timerRunning, status, timeLeft, broadcast]);

      const createRoom = () => {
        const n = name.trim() || '房長', c = Math.floor(100000 + Math.random() * 900000).toString();
        const me = { id: uid, name: n, isHost: true, statuses: [] };
        Storage.saveSession(c, n, true);
        setRoomId(c); setName(n); setIsHost(true); setPlayers([me]); setGameState('lobby');
        connectMqtt(c, true, n, uid);
      };

      const joinRoom = (code) => {
        const n = name.trim() || '特工', c = code.trim();
        if (c.length !== 6) return alert('請輸入 6 碼房號！');
        setIsVerifying(true);
        const temp = mqtt.connect(BROKER_URL, { clientId: `chk_${uid}`, username: MQTT_USER, password: MQTT_PASS });
        const timer = setTimeout(() => { try { temp.end(true); } catch {} setIsVerifying(false); alert('房長未在線或房號錯誤！'); }, 5000);
        temp.on('connect', () => { temp.subscribe(`trb_game_sync_room_${c}`); temp.publish(`trb_game_sync_room_${c}`, JSON.stringify({ type: 'CHECK_NAME', senderId: uid, name: n })); });
        temp.on('message', (_, m) => {
          const d = parseJSON(m.toString());
          if (d?.targetId === uid) {
            clearTimeout(timer); try { temp.end(true); } catch {} setIsVerifying(false);
            if (d.type === 'REJECT_NAME') alert('暱稱重複，請更換！');
            if (d.type === 'VERIFIED') {
              Storage.saveSession(c, n, false);
              setRoomId(c); setName(n); setIsHost(false); setGameState('lobby');
              connectMqtt(c, false, n, uid);
            }
          }
        });
      };

      const startDeal = () => {
        if (players.length < 2) return alert('至少需 2 人！');
        if (totalCards < players.length) return alert('卡牌數不足！');
        let deck = [];
        rolesCatalog.forEach(r => { for (let i = 0; i < (roleCounts[r.id] || 0); i++) deck.push({ ...r }); });
        deck.sort(() => Math.random() - 0.5);

        const assigned = [...players].sort(() => Math.random() - 0.5).map((p, idx) => ({
          ...p, role: deck[idx], team: deck[idx].team, hasBeenLep: deck[idx].id === 'leprechaun', usedMad: false, statuses: []
        }));
        const newBuried = deck.length === players.length + 1 ? deck[players.length] : null;
        const initTime = roundSettings[0] * 60;
        setPlayers(assigned); setBuried(newBuried); setRoundIdx(0); setTimeLeft(initTime); setStatus('round_active'); setTimerRunning(true); setGameState('game');
        broadcast({ players: assigned, buriedCard: newBuried, roundIdx: 0, timeLeft: initTime, status: 'round_active' });
      };

      const nextRound = () => {
        if (roundIdx + 1 < roundSettings.length) {
          const next = roundIdx + 1, time = roundSettings[next] * 60;
          setRoundIdx(next); setTimeLeft(time); setStatus('round_active'); setTimerRunning(true);
          broadcast({ roundIdx: next, timeLeft: time, status: 'round_active' });
        } else {
          setStatus('ended'); setTimerRunning(false); broadcast({ status: 'ended', timeLeft: 0 });
          if (isHost) { setVictoryStep(1); setVictoryAns({}); setVictoryModal(true); }
        }
      };

      const judgeVictory = (ans) => {
        const doc = (roleCounts.doctor || 0) > 0, eng = (roleCounts.engineer || 0) > 0;
        if (ans.sameRoom) return eng ? (ans.engShared ? '紅隊獲勝' : (doc && ans.docShared ? '藍隊獲勝' : '沒有隊伍獲勝')) : '紅隊獲勝';
        return doc ? (ans.docShared ? '藍隊獲勝' : (eng && ans.engShared ? '紅隊獲勝' : '沒有隊伍獲勝')) : '藍隊獲勝';
      };

      return (
        <div className="max-w-2xl mx-auto pb-10">
          <header className="flex justify-between items-center py-3 border-b border-zinc-800 mb-4">
            <div className="flex items-center gap-2">
              <span className="text-2xl">💣</span>
              <div>
                <h1 className="text-lg font-black tracking-wide bg-gradient-to-r from-red-500 via-amber-400 to-blue-500 bg-clip-text text-transparent">2R1B</h1>
                <span className="text-[10px] text-zinc-500">{conn}</span>
              </div>
            </div>
            {roomId && (
              <div className="flex items-center gap-2">
                <span className="text-xs font-mono bg-zinc-800 px-2 py-1 rounded text-amber-400 font-bold">#{roomId}</span>
                <button onClick={() => { if (confirm('確定離開？')) { pub(`trb_game_sync_room_${roomId}`, { type: isHost ? 'DISBAND' : 'SYNC' }); resetAll(); } }} className="text-xs bg-rose-500/20 text-rose-300 px-2 py-1 rounded">🚪 離開</button>
              </div>
            )}
          </header>

          {gameState === 'home' && (
            <div className="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 space-y-4">
              <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="輸入暱稱" className="w-full bg-zinc-800 px-4 py-2.5 rounded-xl border border-zinc-700 text-white outline-none focus:border-indigo-500" />
              <button onClick={createRoom} className="w-full bg-gradient-to-r from-red-600 to-blue-600 py-3 rounded-xl font-bold shadow active:scale-95">👑 建立新房間</button>
              <div className="flex gap-2">
                <input type="tel" maxLength={6} value={joinInput} onChange={e => setJoinInput(e.target.value)} placeholder="6 碼房號" className="flex-1 bg-zinc-800 px-3 py-2 rounded-xl text-center font-mono border border-zinc-700 outline-none" />
                <button disabled={isVerifying} onClick={() => joinRoom(joinInput)} className="bg-zinc-700 px-5 py-2 rounded-xl font-bold disabled:opacity-50">加入</button>
              </div>
            </div>
          )}

          {gameState === 'lobby' && (
            <div className="space-y-4">
              <div className="bg-zinc-900 p-4 rounded-xl border border-zinc-800 flex justify-between items-center">
                <div>
                  <div className="font-bold text-sm">在線人數: <span className="text-amber-400">{players.length}</span> 人</div>
                  <div className="text-xs text-zinc-400">牌庫: {totalCards} 張 {totalCards === players.length + 1 && '(含埋葬卡)'}</div>
                </div>
                {isHost ? (
                  <div className="flex gap-2">
                    <button onClick={() => { setTempRoles({ ...roleCounts }); setShowDeck(true); }} className="text-xs bg-zinc-800 px-3 py-1.5 rounded-lg border border-zinc-700">🃏 卡池</button>
                    <button onClick={startDeal} className="text-xs bg-emerald-600 px-4 py-1.5 rounded-lg font-bold shadow">🎲 發牌開始</button>
                  </div>
                ) : <span className="text-xs text-amber-400 animate-pulse">等候房長...</span>}
              </div>

              <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                {players.map(p => (
                  <div key={p.id} className={`p-2 rounded-lg border text-center text-xs truncate ${p.id === uid ? 'border-indigo-500 bg-indigo-950/30' : 'border-zinc-800 bg-zinc-900'}`}>
                    <div className="truncate font-semibold">{p.name} {p.isHost && '👑'}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {gameState === 'game' && (
            <div className="space-y-4">
              <div className={`p-4 rounded-xl border flex justify-between items-center ${status === 'round_paused' ? 'bg-amber-950/40 border-amber-500 animate-pulse' : 'bg-zinc-900 border-zinc-800'}`}>
                <div>
                  <div className="text-[10px] text-zinc-400">第 {roundIdx + 1} / {roundSettings.length} 輪</div>
                  <div className="text-3xl font-black font-mono">{formatTime(timeLeft)}</div>
                </div>
                {status === 'round_paused' && <div className="text-xs text-amber-300 font-bold">需交換 {getHostageCount(players.length, roundSettings.length, roundIdx)} 位人質</div>}
                {isHost && status === 'round_paused' && <button onClick={nextRound} className="text-xs bg-amber-500 text-zinc-950 font-black px-3 py-2 rounded-lg">下一步 👉</button>}
              </div>

              {msg && <div className="p-2 rounded-lg text-center text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">{msg}</div>}

              {/* 身分卡片 */}
              <div
                onMouseDown={() => setIsColorOnly(true)} onMouseUp={() => setIsColorOnly(false)}
                onTouchStart={() => setIsColorOnly(true)} onTouchEnd={() => setIsColorOnly(false)}
                className={`p-6 rounded-2xl border-2 select-none min-h-[300px] flex flex-col justify-between shadow-2xl transition ${meta.cardBg}`}
              >
                {isColorOnly ? (
                  <div className="my-auto text-center space-y-2 pointer-events-none">
                    <span className={`text-xl font-black px-4 py-1 rounded-full border ${meta.badge}`}>{meta.label}</span>
                    <div className="text-xs text-zinc-400">放開以恢復完整卡面</div>
                  </div>
                ) : (
                  <React.Fragment>
                    <div className="flex justify-between items-center">
                      <span className={`text-xs px-2 py-0.5 rounded font-bold border ${meta.badge}`}>{meta.label}</span>
                      <span className="text-3xl">{myInfo.role?.icon || '⭐'}</span>
                    </div>

                    <div className="text-center my-4">
                      <h2 className="text-2xl font-black">{myInfo.role?.name || '身分載入中...'}</h2>
                      <p className="text-xs text-zinc-300 mt-2 bg-zinc-950/50 p-2.5 rounded-xl border border-zinc-800 break-words">{myInfo.role?.desc}</p>
                    </div>

                    {/* 玩家個人持有狀態 */}
                    {myInfo.statuses?.length > 0 && (
                      <div className="bg-zinc-950/80 p-2 rounded-lg border border-purple-500/40 my-2">
                        <div className="text-[10px] text-purple-300 font-bold mb-1">✨ 你持有的特殊狀態:</div>
                        <div className="flex flex-wrap gap-1">
                          {myInfo.statuses.map(s => <span key={s.id} className="text-[10px] bg-purple-500/20 text-purple-200 border border-purple-400 px-1.5 py-0.5 rounded">{s.icon} {s.name}</span>)}
                        </div>
                      </div>
                    )}

                    {/* 角色外掛/特殊技能按鈕 */}
                    {status !== 'ended' && (() => {
                      const act = RoleMechanics.getAction(myInfo.role, {
                        curRound: roundIdx, maxRounds: roundSettings.length, buried, me: myInfo,
                        openSwap: (rule, dis) => setSwapModal({ rule, dis }),
                        openDrunk: () => setDrunkModal(true),
                        openScientist: () => { setScientistTargets([]); setScientistModal(true); },
                        openStatus: (cfg) => setStatusModal(cfg)
                      });
                      if (!act) return null;
                      return (
                        <button onClick={e => { e.stopPropagation(); act.onClick(); }} className={`w-full py-2.5 rounded-xl font-black text-xs bg-gradient-to-r ${act.style} shadow active:scale-95 my-1`}>
                          {act.label}
                        </button>
                      );
                    })()}

                    <div className="text-[10px] text-zinc-500 text-center">玩家: {myInfo.name}</div>
                  </React.Fragment>
                )}
              </div>

              {/* 終局結算揭曉 */}
              {status === 'ended' && (
                <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-3">
                  <div className="text-center font-black text-lg text-amber-400">{gameResult || '結算完成'}</div>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    {players.map(p => (
                      <div key={p.id} className="bg-zinc-800/60 p-2 rounded-lg border border-zinc-700">
                        <div className="font-bold flex justify-between"><span>{p.name}</span><span>{getTeamMeta(p.team).label}</span></div>
                        <div className="text-zinc-400 text-[11px] truncate">{p.role?.icon} {p.role?.name}</div>
                        {p.statuses?.map(s => <span key={s.id} className="text-[9px] bg-purple-900/50 text-purple-300 px-1 rounded mr-1 inline-block mt-1">{s.icon} {s.name}</span>)}
                      </div>
                    ))}
                  </div>
                  {buried && <div className="text-center text-xs p-2 bg-amber-950/40 border border-amber-500/50 rounded-lg">⚰️ 埋葬卡: {buried.icon} {buried.name}</div>}
                  {isHost && (
                    <button onClick={() => { setStatus('waiting'); setGameState('lobby'); broadcast({ status: 'waiting' }); }} className="w-full py-2 bg-zinc-800 rounded-lg text-xs font-bold">返回大廳</button>
                  )}
                </div>
              )}
            </div>
          )}

          {/* 彈窗：特殊狀態目標選擇 (不顯示任何房間資訊) */}
          {statusModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-purple-500 w-full max-w-xs rounded-2xl p-4 space-y-3 shadow-2xl">
                <div className="flex justify-between font-bold text-sm text-purple-300">
                  <span>{statusModal.icon} 賦予【{statusModal.name}】</span>
                  <button onClick={() => setStatusModal(null)}>✕</button>
                </div>
                <div className="max-h-52 overflow-y-auto space-y-1.5">
                  {players.filter(p => p.id !== uid).map(p => (
                    <button key={p.id} onClick={() => {
                      setStatusModal(null);
                      showNotify(`已向 ${p.name} 發送請求，等候同意...`);
                      pub(`trb_game_sync_room_${roomId}`, { type: 'STATUS_PROMPT', initiatorId: uid, initName: myInfo.name, targetId: p.id, status: { id: statusModal.id, name: statusModal.name, icon: statusModal.icon } });
                    }} className="w-full text-left p-2.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 flex justify-between items-center text-xs">
                      <span className="font-bold">{p.name}</span>
                      <span className="text-purple-400">選擇 👉</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：收到狀態賦予確認 */}
          {statusReq && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border-2 border-purple-500 w-full max-w-xs rounded-2xl p-5 text-center space-y-3">
                <div className="text-3xl">{statusReq.status.icon}</div>
                <div className="text-sm font-bold">{statusReq.initName} 想對你賦予【{statusReq.status.name}】</div>
                <div className="flex gap-2">
                  <button onClick={() => { pub(`trb_game_sync_room_${roomId}`, { type: 'STATUS_NO', initId: statusReq.initiatorId, name: myInfo.name }); setStatusReq(null); }} className="flex-1 py-2 bg-zinc-800 rounded-lg text-xs">拒絕</button>
                  <button onClick={() => { pub(`trb_game_sync_room_${roomId}`, { type: 'EXEC_STATUS', targetId: uid, initiatorId: statusReq.initiatorId, status: statusReq.status }); setStatusReq(null); }} className="flex-1 py-2 bg-purple-600 rounded-lg text-xs font-bold text-white">同意</button>
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：身分交換目標選擇 */}
          {swapModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-amber-500 w-full max-w-xs rounded-2xl p-4 space-y-3">
                <div className="flex justify-between font-bold text-sm text-amber-300"><span>🔄 身分交換</span><button onClick={() => setSwapModal(null)}>✕</button></div>
                <div className="text-[11px] text-zinc-400">{swapModal.rule}</div>
                <div className="max-h-52 overflow-y-auto space-y-1.5">
                  {players.filter(p => p.id !== uid).map(p => (
                    <button key={p.id} disabled={swapModal.dis(p)} onClick={() => {
                      setSwapModal(null);
                      pub(`trb_game_sync_room_${roomId}`, { type: 'SWAP_PROMPT', initId: uid, initName: myInfo.name, roleName: myInfo.role?.name, targetId: p.id });
                    }} className="w-full text-left p-2.5 rounded-lg bg-zinc-800 disabled:opacity-40 flex justify-between text-xs font-bold">
                      <span>{p.name}</span><span>👉</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 收到交換身分確認 */}
          {swapReq && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border-2 border-amber-500 w-full max-w-xs rounded-2xl p-5 text-center space-y-3">
                <div className="text-3xl">🔄</div>
                <div className="text-sm font-bold">{swapReq.initName} ({swapReq.roleName}) 請求與你互換身分！</div>
                <div className="flex gap-2">
                  <button onClick={() => { pub(`trb_game_sync_room_${roomId}`, { type: 'SWAP_NO', initId: swapReq.initId }); setSwapReq(null); }} className="flex-1 py-2 bg-zinc-800 rounded-lg text-xs">拒絕</button>
                  <button onClick={() => { pub(`trb_game_sync_room_${roomId}`, { type: 'EXEC_SWAP', p1: swapReq.initId, p2: uid }); setSwapReq(null); }} className="flex-1 py-2 bg-amber-500 text-zinc-950 rounded-lg text-xs font-black">同意</button>
                </div>
              </div>
            </div>
          )}

          {/* 酒鬼確認 */}
          {drunkModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-purple-500 w-full max-w-xs rounded-2xl p-5 text-center space-y-3">
                <div className="text-3xl">🍺</div>
                <div className="text-sm font-bold">酒醒！換取未知的埋葬卡？</div>
                <div className="flex gap-2">
                  <button onClick={() => setDrunkModal(false)} className="flex-1 py-2 bg-zinc-800 rounded-lg text-xs">取消</button>
                  <button onClick={() => { pub(`trb_game_sync_room_${roomId}`, { type: 'EXEC_DRUNK', playerId: uid }); setDrunkModal(false); }} className="flex-1 py-2 bg-purple-600 rounded-lg text-xs font-bold">確認</button>
                </div>
              </div>
            </div>
          )}

          {/* 瘋狂科學家對調 */}
          {scientistModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-lime-500 w-full max-w-xs rounded-2xl p-4 space-y-3">
                <div className="flex justify-between font-bold text-sm text-lime-400"><span>🧪 選擇 2 位玩家對調</span><button onClick={() => setScientistModal(false)}>✕</button></div>
                <div className="max-h-52 overflow-y-auto space-y-1">
                  {players.filter(p => p.id !== uid).map(p => (
                    <button key={p.id} onClick={() => setScientistTargets(prev => prev.includes(p.id) ? prev.filter(x => x !== p.id) : prev.length >= 2 ? [prev[1], p.id] : [...prev, p.id])} className={`w-full text-left p-2 rounded-lg border text-xs flex justify-between ${scientistTargets.includes(p.id) ? 'border-lime-400 bg-lime-950/40 text-lime-300' : 'border-zinc-800 bg-zinc-800'}`}>
                      <span>{p.name}</span>{scientistTargets.includes(p.id) && <span>✓</span>}
                    </button>
                  ))}
                </div>
                <button disabled={scientistTargets.length !== 2} onClick={() => {
                  const p1 = players.find(p => p.id === scientistTargets[0]), p2 = players.find(p => p.id === scientistTargets[1]);
                  pub(`trb_game_sync_room_${roomId}`, { type: 'SCIENTIST_INIT', initiator: { id: uid, name: myInfo.name }, p1, p2 });
                  setScientistModal(false);
                }} className="w-full py-2 bg-lime-500 text-zinc-950 rounded-lg text-xs font-bold disabled:opacity-40">發送請求</button>
              </div>
            </div>
          )}

          {/* 瘋狂科學家目標確認 */}
          {scientistReq && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border-2 border-lime-500 w-full max-w-xs rounded-2xl p-5 text-center space-y-3">
                <div className="text-3xl">🧪</div>
                <div className="text-sm font-bold">瘋狂科學家想要將你與另一位玩家對調角色！</div>
                <div className="flex gap-2">
                  <button onClick={() => { pub(`trb_game_sync_room_${roomId}`, { type: 'SCIENTIST_VOTE', uid, ok: false, name: myInfo.name }); setScientistReq(null); }} className="flex-1 py-2 bg-zinc-800 rounded-lg text-xs">拒絕</button>
                  <button onClick={() => { pub(`trb_game_sync_room_${roomId}`, { type: 'SCIENTIST_VOTE', uid, ok: true, name: myInfo.name }); setScientistReq(null); }} className="flex-1 py-2 bg-lime-500 text-zinc-950 font-bold rounded-lg text-xs">同意</button>
                </div>
              </div>
            </div>
          )}

          {/* 卡池設定彈窗 */}
          {showDeck && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-900 border border-zinc-700 w-full max-w-md max-h-[80vh] rounded-2xl p-4 flex flex-col space-y-3">
                <div className="flex justify-between items-center pb-2 border-b border-zinc-800">
                  <span className="font-bold text-sm">🃏 卡池選擇 ({Object.values(tempRoles).reduce((s, c) => s + (c || 0), 0)}張)</span>
                  <button onClick={() => setShowDeck(false)}>✕</button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-1.5 pr-1">
                  {rolesCatalog.map(r => (
                    <div key={r.id} onClick={() => setTempRoles(prev => ({ ...prev, [r.id]: prev[r.id] ? 0 : 1 }))} className={`p-2 rounded-lg border text-xs flex justify-between items-center cursor-pointer ${tempRoles[r.id] ? 'bg-indigo-950/40 border-indigo-500' : 'bg-zinc-800/40 border-zinc-800'}`}>
                      <div>{r.icon} {r.name}</div>
                      <span>{tempRoles[r.id] ? '✔' : '＋'}</span>
                    </div>
                  ))}
                </div>
                <button onClick={() => { setRoleCounts(tempRoles); setShowDeck(false); broadcast({ roleCounts: tempRoles }); }} className="w-full py-2 bg-indigo-600 rounded-lg text-xs font-bold">確定保存</button>
              </div>
            </div>
          )}

          {/* 勝負判定推導 */}
          {victoryModal && isHost && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border-2 border-indigo-500 w-full max-w-xs rounded-2xl p-5 text-center space-y-4">
                <div className="text-sm font-bold">🏆 勝負推導問答</div>
                {victoryStep === 1 && (
                  <div className="space-y-3">
                    <p className="text-xs">👔 總統 與 💣 炸彈客 在同房間嗎？</p>
                    <div className="flex gap-2">
                      <button onClick={() => { const a = { sameRoom: true }; setVictoryAns(a); (roleCounts.engineer || 0) > 0 ? setVictoryStep(2) : finalizeResult(a); }} className="flex-1 py-2 bg-red-600 rounded-lg text-xs font-bold">是 (同房間)</button>
                      <button onClick={() => { const a = { sameRoom: false }; setVictoryAns(a); (roleCounts.doctor || 0) > 0 ? setVictoryStep(3) : finalizeResult(a); }} className="flex-1 py-2 bg-blue-600 rounded-lg text-xs font-bold">否 (分開)</button>
                    </div>
                  </div>
                )}
                {victoryStep === 2 && (
                  <div className="space-y-3">
                    <p className="text-xs">💣 炸彈客 與 ⚙️ 工程師 曾卡片分享？</p>
                    <div className="flex gap-2">
                      <button onClick={() => finalizeResult({ ...victoryAns, engShared: true })} className="flex-1 py-2 bg-emerald-600 rounded-lg text-xs font-bold">是</button>
                      <button onClick={() => {
                        const a = { ...victoryAns, engShared: false };
                        (roleCounts.doctor || 0) > 0 ? setVictoryStep(4) : finalizeResult(a);
                      }} className="flex-1 py-2 bg-zinc-700 rounded-lg text-xs font-bold">否</button>
                    </div>
                  </div>
                )}
                {victoryStep === 3 && (
                  <div className="space-y-3">
                    <p className="text-xs">👔 總統 與 🩺 醫生 曾卡片分享？</p>
                    <div className="flex gap-2">
                      <button onClick={() => finalizeResult({ ...victoryAns, docShared: true })} className="flex-1 py-2 bg-emerald-600 rounded-lg text-xs font-bold">是</button>
                      <button onClick={() => {
                        const a = { ...victoryAns, docShared: false };
                        (roleCounts.engineer || 0) > 0 ? setVictoryStep(5) : finalizeResult(a);
                      }} className="flex-1 py-2 bg-zinc-700 rounded-lg text-xs font-bold">否</button>
                    </div>
                  </div>
                )}
                {victoryStep >= 4 && (
                  <div className="space-y-3">
                    <p className="text-xs">{victoryStep === 4 ? '👔 總統 與 🩺 醫生 曾分享？' : '💣 炸彈客 與 ⚙️ 工程師 曾分享？'}</p>
                    <div className="flex gap-2">
                      <button onClick={() => finalizeResult({ ...victoryAns, [victoryStep === 4 ? 'docShared' : 'engShared']: true })} className="flex-1 py-2 bg-emerald-600 rounded-lg text-xs font-bold">是</button>
                      <button onClick={() => finalizeResult({ ...victoryAns, [victoryStep === 4 ? 'docShared' : 'engShared']: false })} className="flex-1 py-2 bg-zinc-700 rounded-lg text-xs font-bold">否</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );

      function finalizeResult(finalA) {
        const res = judgeVictory(finalA);
        setGameResult(res); setVictoryModal(false);
        broadcast({ gameResult: res });
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
