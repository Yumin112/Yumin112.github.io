<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Two Rooms and a Boom!</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MQTT.js (跨裝置中繼) -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- 引入獨立隊伍、角色資料庫與角色機制外掛 -->
  <script src="./team.js"></script>
  <script src="./roles.js"></script>
  <script src="./roles-mechanics.js"></script>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #09090b 100%);
      min-height: 100vh;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="p-2 sm:p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ==========================================
    // 0. EMQX 專屬伺服器連線配置
    // ==========================================
    const BROKER_URL = 'wss://vff8e223.ala.asia-southeast1.emqxsl.com:8084/mqtt';
    const MQTT_USER = 'yumin112for2r1b!';
    const MQTT_PASS = '2r1bweb!';
    const DISCOVERY_TOPIC = 'trb_public_lobby_discovery';

    // ==========================================
    // 1. 全域工具函式與規則配置 (Utilities & Rules)
    // ==========================================

    const getTeamMeta = (teamKey) => {
      const key = (teamKey || '').toLowerCase();
      const teamMap = (window.OFFICIAL_TEAM_CONFIG && window.OFFICIAL_TEAM_CONFIG[0]) || {};
      
      if (key === 'gray' && teamMap.grey) return teamMap.grey;
      if (teamMap[key]) return teamMap[key];

      return {
        label: `${teamKey || '未知'}隊`,
        cardBg: 'bg-gradient-to-br from-indigo-950 via-zinc-900 to-zinc-900 border-indigo-500',
        badge: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30',
        listBg: 'bg-indigo-950/20 border-indigo-900/40'
      };
    };

    const getHostageCount = (playerCount, totalRounds, roundIndex) => {
      let schedule5Rounds = [1, 1, 1, 1, 1];
      if (playerCount <= 10) schedule5Rounds = [1, 1, 1, 1, 1];
      else if (playerCount <= 13) schedule5Rounds = [2, 2, 2, 1, 1];
      else if (playerCount <= 17) schedule5Rounds = [3, 2, 2, 1, 1];
      else if (playerCount <= 21) schedule5Rounds = [4, 3, 2, 1, 1];
      else schedule5Rounds = [5, 4, 3, 2, 1];

      if (totalRounds === 3) {
        const schedule3Rounds = schedule5Rounds.slice(2);
        return schedule3Rounds[roundIndex] || 1;
      }
      return schedule5Rounds[roundIndex] || 1;
    };

    const formatTime = (secs) => {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    };

    // ==========================================
    // 2. 主應用程式組件 (Main App Component)
    // ==========================================

    function App() {
      const rolesCatalog = window.OFFICIAL_ROLES_CATALOG || [];

      // 連線與房間基礎
      const [gameState, setGameState] = useState('home'); 
      const [roomId, setRoomId] = useState('');
      const [joinRoomInput, setJoinRoomInput] = useState('');
      const [playerName, setPlayerName] = useState('');
      const [myPlayerId, setMyPlayerId] = useState('');
      const [isHost, setIsHost] = useState(false);
      const [connStatus, setConnStatus] = useState('未連線');
      const [isVerifying, setIsVerifying] = useState(false);

      // 線上房間大廳探索
      const [showRoomsModal, setShowRoomsModal] = useState(false);
      const [onlineRooms, setOnlineRooms] = useState([]);
      const [isSearchingRooms, setIsSearchingRooms] = useState(false);

      // 玩家名單與進度
      const [players, setPlayers] = useState([]);
      const [roomStatus, setRoomStatus] = useState('waiting');
      const [buriedCard, setBuriedCard] = useState(null);

      // 輪次與計時
      const [roundSettings, setRoundSettings] = useState([3, 2, 1]); 
      const [currentRoundIndex, setCurrentRoundIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(180);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [showRoundConfigModal, setShowRoundConfigModal] = useState(false);

      // 角色池與彈窗配置
      const [roleCounts, setRoleCounts] = useState({
        pres: 1, bomb: 1, doctor: 1, engineer: 1
      });
      const [showDeckModal, setShowDeckModal] = useState(false);
      const [tempRoundSettings, setTempRoundSettings] = useState([3, 2, 1]);
      const [tempRoleCounts, setTempRoleCounts] = useState({});
      const [deckViewMode, setDeckViewMode] = useState('detailed');

      // 角色互動與交換行為
      const [isColorOnly, setIsColorOnly] = useState(false);
      const [showSwapTargetModal, setShowSwapTargetModal] = useState(false);
      const [swapModalConfig, setSwapModalConfig] = useState(null);
      const [swapRequestData, setSwapRequestData] = useState(null); 
      const [swapStatusMessage, setSwapStatusMessage] = useState('');
      const [showDrunkConfirmModal, setShowDrunkConfirmModal] = useState(false);

      // 勝負判定問答
      const [showVictoryModal, setShowVictoryModal] = useState(false);
      const [victoryStep, setVictoryStep] = useState(1);
      const [victoryAns, setVictoryAns] = useState({});
      const [gameResult, setGameResult] = useState(null);

      // Refs
      const clientRef = useRef(null);
      const discoveryClientRef = useRef(null);
      const timerIntervalRef = useRef(null);
      const cardRef = useRef(null);
      const latestStateRef = useRef({});
      const debounceBroadcastTimerRef = useRef(null);

      // 記憶化狀態
      const myInfo = useMemo(() => {
        return players.find(p => p.id === myPlayerId) || {
          name: playerName, team: null, role: null, gameRoom: null, hasBeenLeprechaun: false
        };
      }, [players, myPlayerId, playerName]);

      const roomAPlayers = useMemo(() => players.filter(p => p.gameRoom?.includes('Room A')), [players]);
      const roomBPlayers = useMemo(() => players.filter(p => p.gameRoom?.includes('Room B')), [players]);
      const myTeamMeta = useMemo(() => getTeamMeta(myInfo.team), [myInfo.team]);

      const totalCardsInDeck = useMemo(() => Object.values(roleCounts).reduce((s, c) => s + (c || 0), 0), [roleCounts]);
      const tempTotalCardsInDeck = useMemo(() => Object.values(tempRoleCounts).reduce((s, c) => s + (c || 0), 0), [tempRoleCounts]);

      const hasDoctorInGame = useMemo(() => (roleCounts['doctor'] || 0) > 0, [roleCounts]);
      const hasEngineerInGame = useMemo(() => (roleCounts['engineer'] || 0) > 0, [roleCounts]);

      const currentHostageCount = useMemo(() => {
        return getHostageCount(players.length, roundSettings.length, currentRoundIndex);
      }, [players.length, roundSettings.length, currentRoundIndex]);

      const activeRolesInDeck = useMemo(() => {
        const groups = {};
        rolesCatalog.forEach(role => {
          const count = roleCounts[role.id] || 0;
          if (count > 0) {
            if (!groups[role.name]) {
              groups[role.name] = {
                name: role.name,
                icon: role.icon,
                desc: role.desc,
                teams: [role.team]
              };
            } else {
              if (!groups[role.name].teams.includes(role.team)) {
                groups[role.name].teams.push(role.team);
              }
            }
          }
        });
        return Object.values(groups);
      }, [rolesCatalog, roleCounts]);

      // 保持最新狀態快照
      useEffect(() => {
        latestStateRef.current = {
          players,
          roomStatus,
          roundSettings,
          roleCounts,
          currentRoundIndex,
          timeLeft,
          isTimerRunning,
          isHost,
          roomId,
          myPlayerId,
          playerName,
          gameState,
          buriedCard,
          gameResult
        };

        if (roomId && myPlayerId) {
          const myProfile = players.find(p => p.id === myPlayerId);
          const snapshot = {
            players,
            roomStatus,
            gameState,
            roundSettings,
            roleCounts,
            currentRoundIndex,
            timeLeft,
            isTimerRunning,
            buriedCard,
            gameResult,
            myProfile,
            savedAt: Date.now()
          };
          localStorage.setItem('trb_saved_game_context', JSON.stringify(snapshot));
        }
      }, [players, roomStatus, roundSettings, roleCounts, currentRoundIndex, timeLeft, isTimerRunning, isHost, roomId, myPlayerId, playerName, gameState, buriedCard, gameResult]);

      // 廣播全場狀態更新
      const broadcastLatest = useCallback((override = {}) => {
        if (!clientRef.current) return;
        const s = { ...latestStateRef.current, ...override };
        clientRef.current.publish(`trb_game_sync_room_${s.roomId}`, JSON.stringify({
          type: 'FULL_SYNC',
          senderId: s.myPlayerId,
          players: s.players,
          roomStatus: s.roomStatus,
          roleCounts: s.roleCounts,
          roundSettings: s.roundSettings,
          currentRoundIndex: s.currentRoundIndex,
          timeLeft: s.timeLeft,
          buriedCard: s.buriedCard,
          gameResult: s.gameResult
        }), { qos: 1 });
      }, []);

      const debouncedBroadcastLatest = useCallback((delay = 350) => {
        if (debounceBroadcastTimerRef.current) {
          clearTimeout(debounceBroadcastTimerRef.current);
        }
        debounceBroadcastTimerRef.current = setTimeout(() => {
          broadcastLatest();
          debounceBroadcastTimerRef.current = null;
        }, delay);
      }, [broadcastLatest]);

      // 房長回應大廳探索廣播
      const replyDiscoveryAsHost = useCallback(() => {
        if (!clientRef.current || !latestStateRef.current.isHost || !latestStateRef.current.roomId) return;
        const s = latestStateRef.current;
        clientRef.current.publish(DISCOVERY_TOPIC, JSON.stringify({
          type: 'DISCOVERY_ROOM_ANNOUNCE',
          roomId: s.roomId,
          hostName: s.playerName || '房長',
          playerCount: s.players.length,
          roomStatus: s.roomStatus
        }), { qos: 0 });
      }, []);

      // 重置本機所有遊戲狀態返回首頁
      const resetToHome = useCallback(() => {
        if (debounceBroadcastTimerRef.current) {
          clearTimeout(debounceBroadcastTimerRef.current);
          debounceBroadcastTimerRef.current = null;
        }
        if (clientRef.current) {
          try { clientRef.current.end(true); } catch(e) {}
          clientRef.current = null;
        }
        localStorage.removeItem('trb_saved_room_id');
        localStorage.removeItem('trb_saved_player_name');
        localStorage.removeItem('trb_saved_is_host');
        localStorage.removeItem('trb_saved_game_context');

        setRoomId('');
        setIsHost(false);
        setPlayers([]);
        setBuriedCard(null);
        setGameResult(null);
        setShowVictoryModal(false);
        setGameState('home');
        setRoomStatus('waiting');
        setIsTimerRunning(false);
        setSwapRequestData(null);
        setSwapStatusMessage('');
        setIsVerifying(false);
        setConnStatus('未連線');
      }, []);

      // 建立 MQTT 連線通道
      const setupConnection = useCallback((code, asHost, name, uid) => {
        setConnStatus('連線伺服器中...');
        const topic = `trb_game_sync_room_${code}`;

        if (clientRef.current) {
          try { clientRef.current.end(true); } catch(e) {}
        }

        const client = mqtt.connect(BROKER_URL, {
          clientId: `trb_${uid}_${Math.random().toString(16).substr(2, 6)}`,
          username: MQTT_USER,
          password: MQTT_PASS,
          clean: true,
          reconnectPeriod: 2000
        });

        clientRef.current = client;

        client.on('connect', () => {
          setConnStatus('🟢 已連線');
          // 訂閱遊戲房主題
          client.subscribe(topic, { qos: 1 });
          // 房長監聽公共探索主題，以便自動回報房間在線狀態
          if (asHost) {
            client.subscribe(DISCOVERY_TOPIC, { qos: 0 });
          }

          const currentProfile = latestStateRef.current.players?.find(p => p.id === uid) || {
            id: uid, name: name.trim(), isHost: asHost, team: null, role: null, gameRoom: null, hasBeenLeprechaun: false
          };

          if (asHost) {
            client.publish(topic, JSON.stringify({
              type: 'HOST_RECONNECTED',
              senderId: uid
            }), { qos: 1 });

            setTimeout(() => {
              broadcastLatest();
              replyDiscoveryAsHost();
            }, 400);
          } else {
            client.publish(topic, JSON.stringify({
              type: 'PLAYER_PING_SYNC',
              senderId: uid,
              isHost: false,
              player: currentProfile
            }), { qos: 1 });
          }
        });

        client.on('message', (t, msg) => {
          try {
            const data = JSON.parse(msg.toString());

            // 處理探索主題詢問
            if (t === DISCOVERY_TOPIC) {
              if (data.type === 'DISCOVERY_QUERY_ROOMS' && latestStateRef.current.isHost) {
                replyDiscoveryAsHost();
              }
              return;
            }

            if (data.type === 'ROOM_DISBANDED') {
              alert('房長已離開，房間已解散！');
              resetToHome();
              return;
            }

            if (data.type === 'HOST_RECONNECTED' && !latestStateRef.current.isHost) {
              const myCurrent = latestStateRef.current.players?.find(p => p.id === uid) || {
                id: uid, name: name.trim(), isHost: false, team: null, role: null, gameRoom: null, hasBeenLeprechaun: false
              };
              client.publish(topic, JSON.stringify({
                type: 'REPORT_PRESENCE',
                senderId: uid,
                player: myCurrent
              }), { qos: 1 });
              return;
            }

            if (data.type === 'REPORT_PRESENCE' && latestStateRef.current.isHost) {
              setPlayers(prev => {
                const exists = prev.some(p => p.id === data.player.id);
                const next = exists 
                  ? prev.map(p => p.id === data.player.id ? { ...p, ...data.player } : p)
                  : [...prev, data.player];
                debouncedBroadcastLatest(300);
                return next;
              });
              return;
            }

            // 【新增】：房長端驗證房間存在與檢查暱稱重複
            if (data.type === 'CHECK_ROOM_REQ' && latestStateRef.current.isHost) {
              const currentPlayers = latestStateRef.current.players || [];
              const targetName = (data.playerName || '').trim();
              
              // 檢查是否有非此 uid 的玩家已有相同名字
              const isDuplicated = currentPlayers.some(p => p.id !== data.senderId && p.name === targetName);

              if (isDuplicated) {
                client.publish(topic, JSON.stringify({
                  type: 'ROOM_JOIN_REJECTED',
                  targetId: data.senderId,
                  reason: 'NAME_DUPLICATED'
                }), { qos: 1 });
              } else {
                client.publish(topic, JSON.stringify({
                  type: 'ROOM_VERIFIED',
                  targetId: data.senderId,
                  senderId: uid
                }), { qos: 1 });
              }
              return;
            }

            if (data.type === 'EXECUTE_DRUNK_SWAP' && latestStateRef.current.isHost) {
              executeDrunkBuriedSwapOnHost(data.playerId);
              return;
            }

            if (data.senderId === uid) return;

            switch (data.type) {
              case 'PLAYER_PING_SYNC':
                if (latestStateRef.current.isHost) {
                  setPlayers(prev => {
                    const existing = prev.find(p => p.id === data.player.id);
                    let next;
                    if (existing) {
                      next = prev.map(p => p.id === data.player.id ? {
                        ...p,
                        name: data.player.name,
                        team: data.player.team || p.team,
                        role: data.player.role || p.role,
                        gameRoom: data.player.gameRoom || p.gameRoom
                      } : p);
                    } else {
                      next = [...prev, data.player];
                    }
                    debouncedBroadcastLatest(300);
                    return next;
                  });
                }
                break;

              case 'PLAYER_LEFT':
                setPlayers(prev => {
                  const next = prev.filter(p => p.id !== data.playerId);
                  if (latestStateRef.current.isHost) {
                    debouncedBroadcastLatest(150);
                  }
                  return next;
                });
                break;

              case 'SWAP_REQUEST':
                if (data.targetId === uid) {
                  setSwapRequestData({
                    fromId: data.fromId,
                    fromName: data.fromName,
                    fromRoleName: data.fromRoleName
                  });
                }
                break;

              case 'SWAP_REJECTED':
                if (data.fromId === uid) {
                  setSwapStatusMessage('對方拒絕了身分交換請求！');
                  setTimeout(() => setSwapStatusMessage(''), 3000);
                }
                break;

              case 'SWAP_SUCCESS':
                if (data.player1Id === uid || data.player2Id === uid) {
                  setSwapStatusMessage('🎉 身分已成功交換！');
                  setTimeout(() => setSwapStatusMessage(''), 2500);
                }
                break;

              case 'EXECUTE_SWAP':
                if (latestStateRef.current.isHost) {
                  executeSwapOnHost(data.player1Id, data.player2Id);
                }
                break;

              case 'FULL_SYNC':
                setPlayers(data.players);
                setRoomStatus(data.roomStatus);
                if (data.roleCounts) setRoleCounts(data.roleCounts);
                if (data.roundSettings) setRoundSettings(data.roundSettings);
                setCurrentRoundIndex(data.currentRoundIndex);
                setTimeLeft(data.timeLeft);
                if (data.buriedCard !== undefined) setBuriedCard(data.buriedCard);
                if (data.gameResult !== undefined) setGameResult(data.gameResult);

                if (data.roomStatus === 'round_active') {
                  setGameState('game');
                  setIsTimerRunning(true);
                } else if (data.roomStatus === 'round_paused' || data.roomStatus === 'room_assigned') {
                  setGameState('game');
                  setIsTimerRunning(false);
                } else if (data.roomStatus === 'ended') {
                  setGameState('game');
                  setIsTimerRunning(false);
                } else if (data.roomStatus === 'waiting') {
                  setGameState('lobby');
                  setIsTimerRunning(false);
                }
                break;

              case 'TIME_SYNC':
                if (!latestStateRef.current.isHost) {
                  setTimeLeft(prev => (Math.abs(prev - data.timeLeft) > 2 ? data.timeLeft : prev));
                }
                break;

              default:
                break;
            }
          } catch (e) {}
        });

        client.on('error', () => setConnStatus('連線重試中...'));
      }, [broadcastLatest, debouncedBroadcastLatest, resetToHome, replyDiscoveryAsHost]);

      // 初始化冷啟動狀態還原
      useEffect(() => {
        let storedId = localStorage.getItem('trb_player_uid_v5');
        if (!storedId) {
          storedId = 'u_' + Math.random().toString(36).substring(2, 9);
          localStorage.setItem('trb_player_uid_v5', storedId);
        }
        setMyPlayerId(storedId);

        const savedRoomId = localStorage.getItem('trb_saved_room_id');
        const savedPlayerName = localStorage.getItem('trb_saved_player_name');
        const savedIsHost = localStorage.getItem('trb_saved_is_host') === 'true';

        if (savedRoomId && savedPlayerName) {
          setRoomId(savedRoomId);
          setPlayerName(savedPlayerName);
          setIsHost(savedIsHost);

          let initialList = [];
          let restoredGameState = 'lobby';
          let restoredRoomStatus = 'waiting';

          try {
            const savedContext = JSON.parse(localStorage.getItem('trb_saved_game_context') || '{}');
            if (savedContext.roomStatus) {
              restoredRoomStatus = savedContext.roomStatus;
              restoredGameState = savedContext.gameState || 'lobby';
              setRoomStatus(restoredRoomStatus);
              setGameState(restoredGameState);

              if (savedContext.roundSettings) setRoundSettings(savedContext.roundSettings);
              if (savedContext.roleCounts) setRoleCounts(savedContext.roleCounts);
              if (savedContext.currentRoundIndex !== undefined) setCurrentRoundIndex(savedContext.currentRoundIndex);
              if (savedContext.buriedCard !== undefined) setBuriedCard(savedContext.buriedCard);
              if (savedContext.gameResult !== undefined) setGameResult(savedContext.gameResult);

              if (savedIsHost && savedContext.isTimerRunning && savedContext.savedAt && savedContext.timeLeft > 0) {
                const elapsedSec = Math.floor((Date.now() - savedContext.savedAt) / 1000);
                const remaining = Math.max(0, savedContext.timeLeft - elapsedSec);
                setTimeLeft(remaining);
                if (remaining > 0) {
                  setIsTimerRunning(true);
                } else {
                  setIsTimerRunning(false);
                  setRoomStatus('round_paused');
                }
              } else if (savedContext.timeLeft !== undefined) {
                setTimeLeft(savedContext.timeLeft);
                if (savedContext.isTimerRunning) setIsTimerRunning(true);
              }

              if (Array.isArray(savedContext.players) && savedContext.players.length > 0) {
                initialList = savedContext.players;
              } else if (savedContext.myProfile) {
                initialList = [savedContext.myProfile];
              }
            }
          } catch (e) {}

          if (initialList.length === 0) {
            initialList = [{
              id: storedId,
              name: savedPlayerName,
              isHost: savedIsHost,
              team: null,
              role: null,
              gameRoom: null,
              hasBeenLeprechaun: false
            }];
          }
          setPlayers(initialList);

          setupConnection(savedRoomId, savedIsHost, savedPlayerName, storedId);
        }
      }, [setupConnection]);

      // 計時器排程
      useEffect(() => {
        if (isTimerRunning && roomStatus === 'round_active' && timeLeft > 0) {
          timerIntervalRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timerIntervalRef.current);
                if (latestStateRef.current.isHost) {
                  setIsTimerRunning(false);
                  setRoomStatus('round_paused');
                  broadcastLatest({ roomStatus: 'round_paused', timeLeft: 0 });
                }
                return 0;
              }
              const nextSec = prev - 1;
              if (latestStateRef.current.isHost && nextSec % 30 === 0 && clientRef.current) {
                clientRef.current.publish(`trb_game_sync_room_${roomId}`, JSON.stringify({
                  type: 'TIME_SYNC',
                  senderId: myPlayerId,
                  timeLeft: nextSec
                }), { qos: 0 });
              }
              return nextSec;
            });
          }, 1000);
        } else {
          clearInterval(timerIntervalRef.current);
        }
        return () => clearInterval(timerIntervalRef.current);
      }, [isTimerRunning, roomStatus, timeLeft, roomId, myPlayerId, broadcastLatest]);

      // 房間管理業務函式
      const handleCreateRoom = () => {
        const trimmedName = playerName.trim() || '房長';
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        const me = { id: myPlayerId, name: trimmedName, isHost: true, team: null, role: null, gameRoom: null, hasBeenLeprechaun: false };

        localStorage.setItem('trb_saved_room_id', code);
        localStorage.setItem('trb_saved_player_name', trimmedName);
        localStorage.setItem('trb_saved_is_host', 'true');

        setRoomId(code);
        setIsHost(true);
        setPlayers([me]);
        setBuriedCard(null);
        setGameResult(null);
        setRoomStatus('waiting');
        setGameState('lobby');

        setupConnection(code, true, trimmedName, myPlayerId);
      };

      // 執行房間驗證與加入（支援直接傳入自訂代碼）
      const executeJoinRoom = (targetCode) => {
        const trimmedName = playerName.trim() || '特工';
        const code = (targetCode || joinRoomInput).trim();
        if (code.length !== 6) {
          alert('請輸入 6 碼數字房號！');
          return;
        }

        setIsVerifying(true);
        setConnStatus('連線伺服器中...');

        const topic = `trb_game_sync_room_${code}`;
        const tempClient = mqtt.connect(BROKER_URL, {
          clientId: `trb_v_${myPlayerId}_${Math.random().toString(16).slice(2, 8)}`,
          username: MQTT_USER,
          password: MQTT_PASS,
          clean: true,
          connectTimeout: 5000
        });

        let verified = false;

        const timeoutTimer = setTimeout(() => {
          if (!verified) {
            try { tempClient.end(true); } catch(e) {}
            setIsVerifying(false);
            setConnStatus('未連線');
            alert(`找不到房間「${code}」或房長不在線！\n（若使用 Instagram/LINE 開啟，請點選右上角改用 Safari 或 Chrome 瀏覽器）`);
          }
        }, 6000);

        tempClient.on('connect', () => {
          setConnStatus('🟢 已連線');
          tempClient.subscribe(topic, { qos: 1 }, (err) => {
            if (!err) {
              tempClient.publish(topic, JSON.stringify({
                type: 'CHECK_ROOM_REQ',
                senderId: myPlayerId,
                playerName: trimmedName
              }), { qos: 1 });
            }
          });
        });

        tempClient.on('message', (t, msg) => {
          try {
            const data = JSON.parse(msg.toString());
            
            // 暱稱重複檢查回報
            if (data.type === 'ROOM_JOIN_REJECTED' && (!data.targetId || data.targetId === myPlayerId)) {
              verified = true;
              clearTimeout(timeoutTimer);
              try { tempClient.end(true); } catch(e) {}
              setIsVerifying(false);
              setConnStatus('未連線');
              if (data.reason === 'NAME_DUPLICATED') {
                alert(`⚠️ 加入失敗：房間「${code}」內已存在名為「${trimmedName}」的玩家！\n請更換一個暱稱後再試。`);
              } else {
                alert('無法加入房間，已被房長拒絕！');
              }
              return;
            }

            if (data.type === 'ROOM_VERIFIED' && (!data.targetId || data.targetId === myPlayerId)) {
              verified = true;
              clearTimeout(timeoutTimer);
              try { tempClient.end(true); } catch(e) {}
              setIsVerifying(false);
              setShowRoomsModal(false);

              localStorage.setItem('trb_saved_room_id', code);
              localStorage.setItem('trb_saved_player_name', trimmedName);
              localStorage.setItem('trb_saved_is_host', 'false');

              setRoomId(code);
              setIsHost(false);
              setGameState('lobby');

              const selfPlayer = {
                id: myPlayerId,
                name: trimmedName,
                isHost: false,
                team: null,
                role: null,
                gameRoom: null,
                hasBeenLeprechaun: false
              };
              setPlayers([selfPlayer]);

              setupConnection(code, false, trimmedName, myPlayerId);
            }
          } catch(e) {}
        });

        tempClient.on('error', () => {
          clearTimeout(timeoutTimer);
          setIsVerifying(false);
          setConnStatus('未連線');
          try { tempClient.end(true); } catch(e) {}
          alert('伺服器連線失敗，請檢查網路或確認帳號密碼設定！');
        });
      };

      const handleJoinRoom = () => {
        executeJoinRoom(joinRoomInput);
      };

      // 搜尋線上房間
      const handleOpenRoomsModal = () => {
        setShowRoomsModal(true);
        setOnlineRooms([]);
        setIsSearchingRooms(true);
        setConnStatus('連線伺服器中...');

        if (discoveryClientRef.current) {
          try { discoveryClientRef.current.end(true); } catch(e) {}
        }

        const discClient = mqtt.connect(BROKER_URL, {
          clientId: `trb_disc_${myPlayerId}_${Math.random().toString(16).slice(2, 6)}`,
          username: MQTT_USER,
          password: MQTT_PASS,
          clean: true,
          connectTimeout: 5000
        });

        discoveryClientRef.current = discClient;

        discClient.on('connect', () => {
          setConnStatus('🟢 已連線');
          discClient.subscribe(DISCOVERY_TOPIC, { qos: 0 }, () => {
            // 發送探索廣播
            discClient.publish(DISCOVERY_TOPIC, JSON.stringify({
              type: 'DISCOVERY_QUERY_ROOMS',
              senderId: myPlayerId
            }), { qos: 0 });
          });
        });

        discClient.on('message', (topic, message) => {
          try {
            const data = JSON.parse(message.toString());
            if (data.type === 'DISCOVERY_ROOM_ANNOUNCE' && data.roomId) {
              setOnlineRooms(prev => {
                const filtered = prev.filter(r => r.roomId !== data.roomId);
                return [...filtered, {
                  roomId: data.roomId,
                  hostName: data.hostName,
                  playerCount: data.playerCount,
                  roomStatus: data.roomStatus,
                  receivedAt: Date.now()
                }];
              });
            }
          } catch(e) {}
        });

        discClient.on('error', () => {
          setConnStatus('連線重試中...');
        });

        setTimeout(() => {
          setIsSearchingRooms(false);
        }, 1500);
      };

      const handleCloseRoomsModal = () => {
        setShowRoomsModal(false);
        if (discoveryClientRef.current) {
          try { discoveryClientRef.current.end(true); } catch(e) {}
          discoveryClientRef.current = null;
        }
        if (gameState === 'home') {
          setConnStatus('未連線');
        }
      };

      const handleQuickJoinFromList = (selectedRoomId) => {
        setJoinRoomInput(selectedRoomId);
        executeJoinRoom(selectedRoomId);
      };

      const handleLeaveRoom = () => {
        const confirmMsg = isHost ? '您是房長，離開後將會解散房間，確定要離開嗎？' : '確定要離開當前房間嗎？';
        if (!window.confirm(confirmMsg)) return;

        if (clientRef.current && roomId) {
          const payload = JSON.stringify({
            type: isHost ? 'ROOM_DISBANDED' : 'PLAYER_LEFT',
            playerId: myPlayerId,
            senderId: myPlayerId
          });

          clientRef.current.publish(`trb_game_sync_room_${roomId}`, payload, { qos: 1 }, () => {
            resetToHome();
          });

          setTimeout(() => { resetToHome(); }, 400);
        } else {
          resetToHome();
        }
      };

      // 遊戲輪次與發牌
      const handleStartAssignRooms = () => {
        if (players.length < 2) {
          alert('至少需要 2 位玩家加入才能開始！');
          return;
        }

        const totalDeckCount = Object.values(roleCounts).reduce((s, c) => s + (c || 0), 0);
        if (totalDeckCount < players.length) {
          alert(`卡池張數 (${totalDeckCount} 張) 少於在線玩家 (${players.length} 人)！請於角色池設定增加卡片。`);
          return;
        }

        const shuffled = [...players].sort(() => Math.random() - 0.5);
        const half = Math.ceil(shuffled.length / 2);

        const assigned = shuffled.map((p, idx) => ({
          ...p,
          team: null,
          role: null,
          hasBeenLeprechaun: false,
          gameRoom: idx < half ? '房間 A (Room A)' : '房間 B (Room B)'
        }));

        setPlayers(assigned);
        setRoomStatus('room_assigned');
        setIsTimerRunning(false);
        setGameState('game');

        broadcastLatest({
          players: assigned,
          roomStatus: 'room_assigned',
          currentRoundIndex: 0,
          timeLeft: roundSettings[0] * 60,
          buriedCard: null,
          gameResult: null
        });
      };

      const handleConfirmDealCardsAndStart = () => {
        let deck = [];
        rolesCatalog.forEach(role => {
          const count = roleCounts[role.id] || 0;
          for (let i = 0; i < count; i++) deck.push({ ...role });
        });
        deck.sort(() => Math.random() - 0.5);

        const assignedWithRoles = players.map((p, idx) => {
          const r = deck[idx];
          return {
            ...p,
            team: r.team,
            role: r,
            hasBeenLeprechaun: r.id === 'leprechaun'
          };
        });

        let generatedBuried = null;
        if (deck.length === players.length + 1) {
          generatedBuried = deck[players.length];
        }

        const initialTime = roundSettings[0] * 60;
        setPlayers(assignedWithRoles);
        setBuriedCard(generatedBuried);
        setCurrentRoundIndex(0);
        setTimeLeft(initialTime);
        setRoomStatus('round_active');
        setIsTimerRunning(true);
        setGameResult(null);

        broadcastLatest({
          players: assignedWithRoles,
          roomStatus: 'round_active',
          currentRoundIndex: 0,
          timeLeft: initialTime,
          buriedCard: generatedBuried,
          gameResult: null
        });
      };

      const handleNextRoundConfirm = () => {
        if (currentRoundIndex + 1 < roundSettings.length) {
          const nextIdx = currentRoundIndex + 1;
          const nextTime = roundSettings[nextIdx] * 60;
          setCurrentRoundIndex(nextIdx);
          setTimeLeft(nextTime);
          setRoomStatus('round_active');
          setIsTimerRunning(true);
          broadcastLatest({ roomStatus: 'round_active', currentRoundIndex: nextIdx, timeLeft: nextTime });
        } else {
          setRoomStatus('ended');
          setIsTimerRunning(false);
          broadcastLatest({ roomStatus: 'ended', timeLeft: 0 });

          if (isHost) {
            setVictoryStep(1);
            setVictoryAns({});
            setShowVictoryModal(true);
          }
        }
      };

      // 勝負判定邏輯樹
      const resolveGameResult = (ans) => {
        const inSameRoom = ans.sameRoom;
        const engShared = ans.engineerShared;
        const docShared = ans.doctorShared;

        const needEngineer = hasEngineerInGame;
        const needDoctor = hasDoctorInGame;

        if (inSameRoom) {
          if (needEngineer) {
            if (engShared) return '紅隊獲勝';
            if (needDoctor) {
              return docShared ? '藍隊獲勝' : '沒有隊伍獲勝';
            } else {
              return '沒有隊伍獲勝';
            }
          } else {
            return '紅隊獲勝';
          }
        } else {
          if (needDoctor) {
            if (docShared) return '藍隊獲勝';
            if (needEngineer) {
              return engShared ? '紅隊獲勝' : '沒有隊伍獲勝';
            } else {
              return '沒有隊伍獲勝';
            }
          } else {
            return '藍隊獲勝';
          }
        }
      };

      const handleVictoryAnswer = (key, val) => {
        const updatedAns = { ...victoryAns, [key]: val };
        setVictoryAns(updatedAns);

        if (key === 'sameRoom') {
          if (val === true) {
            if (hasEngineerInGame) {
              setVictoryStep(2);
            } else {
              finalizeVictory(updatedAns);
            }
          } else {
            if (hasDoctorInGame) {
              setVictoryStep(3);
            } else {
              finalizeVictory(updatedAns);
            }
          }
        } else if (key === 'engineerShared') {
          if (victoryAns.sameRoom === true) {
            if (val === true) {
              finalizeVictory(updatedAns);
            } else {
              if (hasDoctorInGame) {
                setVictoryStep(4);
              } else {
                finalizeVictory(updatedAns);
              }
            }
          } else {
            finalizeVictory(updatedAns);
          }
        } else if (key === 'doctorShared') {
          if (victoryAns.sameRoom === false) {
            if (val === true) {
              finalizeVictory(updatedAns);
            } else {
              if (hasEngineerInGame) {
                setVictoryStep(5);
              } else {
                finalizeVictory(updatedAns);
              }
            }
          } else {
            finalizeVictory(updatedAns);
          }
        }
      };

      const finalizeVictory = (finalAns) => {
        const result = resolveGameResult(finalAns);
        setGameResult(result);
        setShowVictoryModal(false);
        broadcastLatest({ gameResult: result });
      };

      // 互動操作
      const handleTouchMove = (e) => {
        if (!isColorOnly || !cardRef.current) return;
        const touch = e.touches[0];
        if (!touch) return;
        const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
        if (!targetElement || !cardRef.current.contains(targetElement)) {
          setIsColorOnly(false);
        }
      };

      const handleSendSwapRequest = (targetPlayer) => {
        setShowSwapTargetModal(false);
        if (!clientRef.current || targetPlayer.id === myPlayerId) return;

        setSwapStatusMessage(`已向 ${targetPlayer.name} 發送交換請求，等待對方確認中...`);
        clientRef.current.publish(`trb_game_sync_room_${roomId}`, JSON.stringify({
          type: 'SWAP_REQUEST',
          senderId: myPlayerId,
          fromId: myPlayerId,
          fromName: myInfo.name,
          fromRoleName: myInfo.role?.name,
          targetId: targetPlayer.id
        }));
      };

      const handleAcceptSwap = () => {
        if (!swapRequestData) return;
        const p1Id = swapRequestData.fromId;
        const p2Id = myPlayerId;
        setSwapRequestData(null);

        if (latestStateRef.current.isHost) {
          executeSwapOnHost(p1Id, p2Id);
        } else if (clientRef.current) {
          clientRef.current.publish(`trb_game_sync_room_${roomId}`, JSON.stringify({
            type: 'EXECUTE_SWAP',
            senderId: myPlayerId,
            player1Id: p1Id,
            player2Id: p2Id
          }));
        }
      };

      const handleRejectSwap = () => {
        if (!swapRequestData || !clientRef.current) return;
        clientRef.current.publish(`trb_game_sync_room_${roomId}`, JSON.stringify({
          type: 'SWAP_REJECTED',
          senderId: myPlayerId,
          fromId: swapRequestData.fromId
        }));
        setSwapRequestData(null);
      };

      // 房長端交換業務
      const executeSwapOnHost = useCallback((id1, id2) => {
        setPlayers(prev => {
          const next = window.RoleMechanics 
            ? window.RoleMechanics.applyPlayerSwap(prev, id1, id2) 
            : prev;

          if (clientRef.current) {
            clientRef.current.publish(`trb_game_sync_room_${latestStateRef.current.roomId}`, JSON.stringify({
              type: 'SWAP_SUCCESS',
              player1Id: id1,
              player2Id: id2
            }), { qos: 1 });
          }

          setTimeout(() => { broadcastLatest({ players: next }); }, 50);
          return next;
        });
      }, [broadcastLatest]);

      // 房長端酒鬼交換業務
      const executeDrunkBuriedSwapOnHost = useCallback((drunkPlayerId) => {
        const curBuried = latestStateRef.current.buriedCard;
        if (!curBuried || !window.RoleMechanics) return;

        setPlayers(prev => {
          const { nextPlayers, newBuried } = window.RoleMechanics.applyDrunkBuriedSwap(
            prev,
            curBuried,
            drunkPlayerId
          );

          setBuriedCard(newBuried);

          setTimeout(() => {
            broadcastLatest({ players: nextPlayers, buriedCard: newBuried });
          }, 50);

          return nextPlayers;
        });
      }, [broadcastLatest]);

      const handleConfirmDrunkSwap = () => {
        setShowDrunkConfirmModal(false);
        if (!buriedCard) return;

        if (latestStateRef.current.isHost) {
          executeDrunkBuriedSwapOnHost(myPlayerId);
        } else if (clientRef.current) {
          clientRef.current.publish(`trb_game_sync_room_${roomId}`, JSON.stringify({
            type: 'EXECUTE_DRUNK_SWAP',
            senderId: myPlayerId,
            playerId: myPlayerId
          }), { qos: 1 });
        }
      };

      const handleToggleRole = (roleId) => {
        if (!isHost) return;
        setTempRoleCounts(prev => {
          const isSelected = (prev[roleId] || 0) > 0;
          const nextCounts = { ...prev };

          if (isSelected) {
            nextCounts[roleId] = 0;
          } else {
            nextCounts[roleId] = 1;

            const currentRole = rolesCatalog.find(r => r.id === roleId);
            if (currentRole && currentRole.pairs) {
              let pairIds = [];
              if (Array.isArray(currentRole.pairs)) {
                pairIds = currentRole.pairs;
              } else if (typeof currentRole.pairs === 'string') {
                pairIds = currentRole.pairs.split(',').map(s => s.trim()).filter(Boolean);
              }

              pairIds.forEach(pId => {
                nextCounts[pId] = 1;
              });
            }
          }

          return nextCounts;
        });
      };

      const handleDeselectAllRoles = () => {
        if (!isHost) return;
        const cleared = {};
        rolesCatalog.forEach(role => {
          cleared[role.id] = 0;
        });
        setTempRoleCounts(cleared);
      };

      // ==========================================
      // 3. 畫面渲染樹 (JSX Render Tree)
      // ==========================================

      return (
        <div className="max-w-4xl mx-auto pb-12">
          
          {/* 頂部導覽列 */}
          <header className="flex justify-between items-center py-4 border-b border-zinc-800 mb-6">
            <div className="flex items-center gap-2">
              <span className="text-3xl">💣</span>
              <div>
                <h1 className="text-xl font-black tracking-wider bg-gradient-to-r from-red-500 via-amber-400 to-blue-500 bg-clip-text text-transparent uppercase">
                  Two Rooms and a Boom!
                </h1>
                <div className="flex items-center gap-2 text-xs text-zinc-400">
                  <span className={connStatus.includes('🟢') ? 'text-emerald-400 font-medium' : ''}>{connStatus}</span>
                  {roomId && <span>玩家: {players.length} 人</span>}
                </div>
              </div>
            </div>

            {roomId && (
              <div className="flex items-center gap-2">
                <div className="bg-zinc-800/80 border border-zinc-700 px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-xs text-zinc-400">房號:</span>
                  <span className="text-base font-mono font-bold tracking-widest text-amber-400">{roomId}</span>
                  <span className="text-xs bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded">
                    {isHost ? '房長' : '玩家'}
                  </span>
                </div>
                <button
                  onClick={handleLeaveRoom}
                  className="bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-300 hover:text-rose-200 text-xs px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 active:scale-95"
                >
                  🚪 離開
                </button>
              </div>
            )}
          </header>

          {/* 首頁：建立 / 加入房間 */}
          {gameState === 'home' && (
            <div className="max-w-md mx-auto bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-xl mt-6">
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-zinc-300 mb-1">您的暱稱</label>
                  <input
                    type="text"
                    value={playerName}
                    onChange={(e) => setPlayerName(e.target.value)}
                    placeholder="輸入暱稱 (例如: 特工 007)"
                    className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <button
                  type="button"
                  onClick={handleCreateRoom}
                  className="w-full bg-gradient-to-r from-red-600 via-purple-600 to-blue-600 hover:opacity-90 text-white font-semibold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2 active:scale-95"
                >
                  <span>👑 建立新房間 (當房長)</span>
                </button>

                {/* 【新增】：查看當前所有線上房間按鈕 */}
                <button
                  type="button"
                  onClick={handleOpenRoomsModal}
                  className="w-full bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 font-semibold py-2.5 rounded-xl transition shadow flex items-center justify-center gap-2 active:scale-95 text-sm"
                >
                  <span>📋 查看當前所有線上房間</span>
                </button>

                <div className="relative flex py-1 items-center">
                  <div className="flex-grow border-t border-zinc-800"></div>
                  <span className="flex-shrink mx-4 text-xs text-zinc-500">或手動輸入 6 碼房間號</span>
                  <div className="flex-grow border-t border-zinc-800"></div>
                </div>

                <div className="flex gap-2">
                  <input
                    type="tel"
                    maxLength={6}
                    value={joinRoomInput}
                    onChange={(e) => setJoinRoomInput(e.target.value)}
                    placeholder="輸入 6 碼房號"
                    className="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2 text-white font-mono text-center tracking-widest placeholder-zinc-500 focus:outline-none"
                  />
                  <button
                    type="button"
                    disabled={isVerifying}
                    onClick={handleJoinRoom}
                    className="bg-zinc-700 hover:bg-zinc-600 px-6 py-2 rounded-xl text-white font-medium transition active:scale-95 disabled:opacity-50 min-w-[80px]"
                  >
                    {isVerifying ? '驗證中...' : '加入'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：查看線上房間列表 */}
          {showRoomsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl flex flex-col shadow-2xl overflow-hidden max-h-[85vh]">
                <div className="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950/40">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📋</span>
                    <h3 className="font-bold text-white text-base">線上房間列表</h3>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleOpenRoomsModal}
                      disabled={isSearchingRooms}
                      className="text-xs bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 px-2.5 py-1 rounded-lg transition"
                    >
                      {isSearchingRooms ? '掃描中...' : '🔄 重新整理'}
                    </button>
                    <button onClick={handleCloseRoomsModal} className="text-zinc-400 hover:text-white text-sm w-7 h-7 flex items-center justify-center rounded-lg bg-zinc-800">
                      ✕
                    </button>
                  </div>
                </div>

                <div className="p-4 overflow-y-auto space-y-2.5 flex-1">
                  {onlineRooms.length === 0 ? (
                    <div className="text-center py-10 space-y-2">
                      <div className="text-3xl animate-pulse">📡</div>
                      <p className="text-sm text-zinc-400 font-medium">
                        {isSearchingRooms ? '正在搜尋附近的線上房間...' : '目前沒有探索到在線房間'}
                      </p>
                      <p className="text-xs text-zinc-500">
                        您可以直接建立房間，或請房長開啟房間後點選右上角重新整理。
                      </p>
                    </div>
                  ) : (
                    onlineRooms.map(room => (
                      <div
                        key={room.roomId}
                        className="bg-zinc-800/80 border border-zinc-700/80 hover:border-indigo-500/60 p-3.5 rounded-xl flex items-center justify-between gap-3 transition"
                      >
                        <div className="space-y-1">
                          <div className="flex items-center gap-2">
                            <span className="font-mono text-base font-bold text-amber-400 tracking-wider">
                              #{room.roomId}
                            </span>
                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${
                              room.roomStatus === 'waiting'

                        );
                      })()}

                      <div className="text-[11px] text-zinc-400 text-center bg-zinc-950/40 py-1.5 rounded-lg border border-zinc-800/60 pointer-events-none">
                        玩家: <strong className="text-zinc-200">{myInfo.name}</strong>
                      </div>
                    </React.Fragment>
                  )}
                </div>
              </div>

              {/* 進行中：角色池一覽 */}
              <div className="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-xl">
                <div className="flex items-center justify-between pb-3 mb-4 border-b border-zinc-800">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">🃏</span>
                    <h3 className="font-bold text-white text-sm sm:text-base">本局使用角色池一覽</h3>
                  </div>
                  <span className="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-full font-medium">
                    總共 {totalCardsInDeck} 張卡片
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {activeRolesInDeck.map(group => {
                    const hasBlue = group.teams.includes('blue');
                    const hasRed = group.teams.includes('red');
                    
                    let bgStyle = 'bg-zinc-900/40 border-zinc-800';
                    if (hasBlue && hasRed) {
                      bgStyle = 'bg-gradient-to-r from-blue-950/30 via-zinc-900/40 to-red-950/30 border-indigo-500/30';
                    } else if (hasBlue) {
                      bgStyle = getTeamMeta('blue').listBg;
                    } else if (hasRed) {
                      bgStyle = getTeamMeta('red').listBg;
                    } else if (group.teams.length > 0) {
                      bgStyle = getTeamMeta(group.teams[0]).listBg;
                    }

                    return (
                      <div
                        key={group.name}
                        className={`p-3 rounded-xl border flex items-start justify-between gap-3 ${bgStyle}`}
                      >
                        <div className="flex items-start gap-2.5">
                          <span className="text-2xl mt-0.5">{group.icon}</span>
                          <div>
                            <div className="flex items-center gap-1.5 flex-wrap">
                              <span className="font-bold text-sm text-zinc-100">{group.name}</span>
                              {group.teams.map(t => {
                                const meta = getTeamMeta(t);
                                return (
                                  <span key={t} className={`text-[10px] px-1.5 py-0.5 rounded font-bold border ${meta.badge}`}>
                                    {meta.label}
                                  </span>
                                );
                              })}
                            </div>
                            <p className="text-xs text-zinc-400 mt-1 leading-relaxed break-words">{group.desc}</p>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：勝負判定問答 */}
          {showVictoryModal && isHost && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border-2 border-indigo-500 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                  <h3 className="text-base font-bold text-white flex items-center gap-1.5">
                    <span>🏆 勝負判定推導</span>
                  </h3>
                  <button onClick={() => setShowVictoryModal(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>

                {victoryStep === 1 && (
                  <div className="space-y-4 text-center">
                    <p className="text-base font-black text-white">
                      👔 總統 與 💣 炸彈客<br />在同一個房間嗎？
                    </p>
                    <div className="flex gap-3">
                      <button
                        onClick={() => handleVictoryAnswer('sameRoom', true)}
                        className="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition active:scale-95"
                      >
                        是 (在同房間)
                      </button>
                      <button
                        onClick={() => handleVictoryAnswer('sameRoom', false)}
                        className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition active:scale-95"
                      >
                        否 (在不同房間)
                      </button>
                    </div>
                  </div>
                )}

                {victoryStep === 2 && (
                  <div className="space-y-4 text-center">
                    <p className="text-base font-black text-white">
                      💣 炸彈客 有和 ⚙️ 工程師<br />進行『卡片分享』嗎？
                    </p>
                    <div className="flex gap-3">
                      <button
                        onClick={() => handleVictoryAnswer('engineerShared', true)}
                        className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition active:scale-95"
                      >
                        是
                      </button>
                      <button
                        onClick={() => handleVictoryAnswer('engineerShared', false)}
                        className="flex-1 bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3 rounded-xl transition active:scale-95"
                      >
                        否
                      </button>
                    </div>
                  </div>
                )}

                {victoryStep === 3 && (
                  <div className="space-y-4 text-center">
                    <p className="text-base font-black text-white">
                      👔 總統 有和 🩺 醫生<br />進行『卡片分享』嗎？
                    </p>
                    <div className="flex gap-3">
                      <button
                        onClick={() => handleVictoryAnswer('doctorShared', true)}
                        className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition active:scale-95"
                      >
                        是
                      </button>
                      <button
                        onClick={() => handleVictoryAnswer('doctorShared', false)}
                        className="flex-1 bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3 rounded-xl transition active:scale-95"
                      >
                        否
                      </button>
                    </div>
                  </div>
                )}

                {victoryStep === 4 && (
                  <div className="space-y-4 text-center">
                    <p className="text-base font-black text-white">
                      👔 總統 有和 🩺 醫生<br />進行『卡片分享』嗎？
                    </p>
                    <div className="flex gap-3">
                      <button
                        onClick={() => handleVictoryAnswer('doctorShared', true)}
                        className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition active:scale-95"
                      >
                        是
                      </button>
                      <button
                        onClick={() => handleVictoryAnswer('doctorShared', false)}
                        className="flex-1 bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3 rounded-xl transition active:scale-95"
                      >
                        否
                      </button>
                    </div>
                  </div>
                )}

                {victoryStep === 5 && (
                  <div className="space-y-4 text-center">
                    <p className="text-base font-black text-white">
                      💣 炸彈客 有和 ⚙️ 工程師<br />進行『卡片分享』嗎？
                    </p>
                    <div className="flex gap-3">
                      <button
                        onClick={() => handleVictoryAnswer('engineerShared', true)}
                        className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition active:scale-95"
                      >
                        是
                      </button>
                      <button
                        onClick={() => handleVictoryAnswer('engineerShared', false)}
                        className="flex-1 bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3 rounded-xl transition active:scale-95"
                      >
                        否
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 彈窗：酒鬼與埋葬卡交換確認 */}
          {showDrunkConfirmModal && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border-2 border-purple-500 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 text-center">
                <div className="text-4xl animate-bounce">🍺</div>
                <h3 className="text-lg font-black text-white">酒醒時刻！換取埋葬卡？</h3>
                <p className="text-sm text-zinc-300 leading-relaxed">
                  你目前持有 <strong className="text-purple-400">酒鬼</strong> 身分。點擊確認後，你將直接換取本局未知的<strong className="text-amber-400">【埋葬卡】</strong>身分，並將酒鬼牌作為新的埋葬卡！
                </p>
                <p className="text-xs text-zinc-400">此動作不可復原，是否確定交換？</p>

                <div className="flex gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setShowDrunkConfirmModal(false)}
                    className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2.5 rounded-xl border border-zinc-700 transition active:scale-95 text-sm"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmDrunkSwap}
                    className="flex-1 bg-gradient-to-r from-purple-500 to-amber-500 hover:opacity-90 text-zinc-950 font-black py-2.5 rounded-xl shadow-lg transition active:scale-95 text-sm"
                  >
                    確認換取
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：主動身分交換對象選擇 */}
          {showSwapTargetModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border border-amber-500/50 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                  <h3 className="text-base font-bold text-amber-400 flex items-center gap-1.5">
                    <span>🔄 選擇交換身分的對象</span>
                  </h3>
                  <button onClick={() => setShowSwapTargetModal(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>
                
                {swapModalConfig?.ruleDesc && (
                  <p className="text-xs text-zinc-300">{swapModalConfig.ruleDesc}</p>
                )}

                <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
                  {players.filter(p => p.id !== myPlayerId).map(p => {
                    const isDisabled = swapModalConfig?.isTargetDisabled ? swapModalConfig.isTargetDisabled(p) : false;
                    return (
                      <button
                        key={p.id}
                        type="button"
                        disabled={isDisabled}
                        onClick={() => handleSendSwapRequest(p)}
                        className={`w-full text-left p-3 rounded-xl border transition flex items-center justify-between ${
                          isDisabled
                            ? 'bg-zinc-900/60 border-zinc-800/80 opacity-40 cursor-not-allowed'
                            : 'bg-zinc-800/80 hover:bg-zinc-700 border-zinc-700 hover:border-amber-400 cursor-pointer active:scale-95'
                        }`}
                      >
                        <div className="flex items-center gap-1.5">
                          <span className="font-bold text-sm text-zinc-100">{p.name}</span>
                          {p.isHost && <span className="text-amber-400 text-xs">👑(房長)</span>}
                        </div>
                        <div>
                          {isDisabled ? (
                            <span className="text-[10px] text-rose-400 bg-rose-950/60 px-2 py-0.5 rounded border border-rose-900/60">
                              {swapModalConfig?.disabledBadge || '無法選擇'}
                            </span>
                          ) : (
                            <span className="text-xs text-indigo-400 bg-indigo-950/60 px-2 py-1 rounded-md border border-indigo-900/60">
                              {p.gameRoom ? p.gameRoom.split(' ')[0] : '同場'}
                            </span>
                          )}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：被動身分交換確認請求 */}
          {swapRequestData && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
              <div className="bg-zinc-900 border-2 border-amber-500 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 text-center">
                <div className="text-4xl animate-bounce">🔄</div>
                <h3 className="text-lg font-black text-white">身分交換請求！</h3>
                <p className="text-sm text-zinc-300 leading-relaxed">
                  玩家 <strong className="text-amber-400 font-bold">{swapRequestData.fromName}</strong> 
                  （持有身分：<strong className="text-emerald-400">{swapRequestData.fromRoleName}</strong>）想要與你交換身分卡。
                </p>
                <p className="text-xs text-zinc-400">若同意，你的身分將立刻轉變為對方的身分！</p>

                <div className="flex gap-3 pt-2">
                  <button
                    type="button"
                    onClick={handleRejectSwap}
                    className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2.5 rounded-xl border border-zinc-700 transition active:scale-95 text-sm"
                  >
                    拒絕
                  </button>
                  <button
                    type="button"
                    onClick={handleAcceptSwap}
                    className="flex-1 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-black py-2.5 rounded-xl shadow-lg transition active:scale-95 text-sm"
                  >
                    確認交換
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 彈窗：輪次與時間長度設定 */}
          {showRoundConfigModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <h3 className="text-base font-bold text-white">⚙️ 調整回合數與每輪時間</h3>
                  <button onClick={() => setShowRoundConfigModal(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>

                <div>
                  <label className="block text-xs font-bold text-zinc-400 mb-2">選擇總輪數 (3 輪 / 5 輪):</label>
                  <div className="grid grid-cols-2 gap-3">
                    {[3, 5].map(cnt => (
                      <button
                        key={cnt}
                        type="button"
                        onClick={() => {
                          let newSettings = [...tempRoundSettings];
                          if (cnt > newSettings.length) {
                            while (newSettings.length < cnt) newSettings.push(1);
                          } else {
                            newSettings = newSettings.slice(0, cnt);
                          }
                          setTempRoundSettings(newSettings);
                        }}
                        className={`py-2.5 rounded-xl text-sm font-bold border transition ${
                          tempRoundSettings.length === cnt ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-zinc-800 border-zinc-700 text-zinc-300 hover:bg-zinc-700'
                        }`}
                      >
                        {cnt} 輪
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-2">
                  <label className="block text-xs font-bold text-zinc-400">設定各輪分鐘數 (分):</label>
                  {tempRoundSettings.map((min, idx) => (
                    <div key={idx} className="flex justify-between items-center bg-zinc-800/80 px-3 py-2 rounded-xl border border-zinc-700">
                      <span className="text-xs text-zinc-300 font-semibold">第 {idx + 1} 輪:</span>
                      <div className="flex items-center gap-2">
                        <input
                          type="number"
                          min="1"
                          max="15"
                          value={min}
                          onChange={(e) => {
                            const val = Math.max(1, parseInt(e.target.value) || 1);
                            const updated = [...tempRoundSettings];
                            updated[idx] = val;
                            setTempRoundSettings(updated);
                          }}
                          className="w-16 bg-zinc-900 border border-zinc-600 rounded-lg px-2 py-1 text-center text-sm font-bold text-amber-400"
                        />
                        <span className="text-xs text-zinc-400">分鐘</span>
                      </div>
                    </div>
                  ))}
                </div>

                <button
                  type="button"
                  onClick={() => {
                    setRoundSettings(tempRoundSettings);
                    setShowRoundConfigModal(false);
                    broadcastLatest({ roundSettings: tempRoundSettings });
                  }}
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition text-sm shadow-lg active:scale-95"
                >
                  確認保存設定
                </button>
              </div>
            </div>
          )}

          {/* 彈窗：角色池配置 */}
          {showDeckModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-900 border border-zinc-700 w-full max-w-3xl max-h-[90vh] rounded-2xl flex flex-col shadow-2xl">
                <div className="p-4 border-b border-zinc-800 flex flex-wrap justify-between items-center gap-2">
                  <div className="flex items-center gap-2">
                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                      <span>🃏 角色池配置</span>
                      <span className="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded">
                        目前: {tempTotalCardsInDeck} 張 / 玩家: {players.length} 人
                      </span>
                      {tempTotalCardsInDeck === players.length + 1 && (
                        <span className="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded font-bold">
                          ⚰️️ 將多出 1 張埋葬卡
                        </span>
                      )}
                    </h3>
                  </div>

                  <div className="flex items-center gap-2">
                    {isHost && (
                      <button
                        type="button"
                        onClick={handleDeselectAllRoles}
                        className="bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 text-xs px-2.5 py-1.5 rounded-lg transition active:scale-95"
                      >
                        清空選取
                      </button>
                    )}

                    <button
                      type="button"
                      onClick={() => setDeckViewMode(prev => prev === 'detailed' ? 'iconOnly' : 'detailed')}
                      className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 text-xs px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 active:scale-95"
                    >
                      {deckViewMode === 'detailed' ? '👁️ 僅圖示' : '📄 詳細資料'}
                    </button>

                    <button onClick={() => setShowDeckModal(false)} className="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 flex items-center justify-center hover:text-white">
                      ✕
                    </button>
                  </div>
                </div>

                <div className="p-4 overflow-y-auto space-y-3 flex-1">
                  <div className={`grid gap-2.5 ${deckViewMode === 'iconOnly' ? 'grid-cols-2 sm:grid-cols-3 md:grid-cols-4' : 'grid-cols-1 md:grid-cols-2'}`}>
                    {rolesCatalog.map(role => {
                      const isSelected = (tempRoleCounts[role.id] || 0) > 0;
                      const meta = getTeamMeta(role.team);

                      if (deckViewMode === 'iconOnly') {
                        return (
                          <div 
                            key={role.id} 
                            onClick={() => handleToggleRole(role.id)}
                            className={`p-3 rounded-xl border flex items-center justify-between gap-2 transition cursor-pointer select-none ${
                              isSelected 
                                ? `${meta.listBg} border-indigo-400 ring-2 ring-indigo-500/40 shadow-md` 
                                : 'bg-zinc-900/60 border-zinc-800 hover:border-zinc-700 opacity-60'
                            }`}
                          >
                            <div className="flex items-center gap-2 truncate">
                              <span className="text-xl shrink-0">{role.icon}</span>
                              <div className="truncate">
                                <div className={`text-xs font-bold truncate ${isSelected ? 'text-white' : 'text-zinc-400'}`}>
                                  {role.name}
                                </div>
                                <span className={`text-[9px] px-1 py-0.2 rounded font-semibold border inline-block mt-0.5 ${meta.badge}`}>
                                  {meta.label.split(' ')[0]}
                                </span>
                              </div>
                            </div>
                            <span className={`text-xs shrink-0 font-bold ${isSelected ? 'text-emerald-400' : 'text-zinc-600'}`}>
                              {isSelected ? '✔' : '＋'}
                            </span>
                          </div>
                        );
                      }

                      return (
                        <div 
                          key={role.id} 
                          onClick={() => handleToggleRole(role.id)}
                          className={`p-3.5 rounded-xl border flex flex-col justify-between gap-3 transition cursor-pointer select-none ${
                            isSelected 
                              ? `${meta.listBg} border-indigo-400 ring-2 ring-indigo-500/40 shadow-lg scale-[1.01]` 
                              : 'bg-zinc-900/60 border-zinc-800 hover:border-zinc-700 opacity-60'
                          }`}
                        >
                          <div className="flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2">
                              <span className="text-2xl shrink-0">{role.icon}</span>
                              <span className={`text-sm font-bold ${isSelected ? 'text-white' : 'text-zinc-400'}`}>
                                {role.name}
                              </span>
                              <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold border shrink-0 ${meta.badge}`}>
                                {meta.label}
                              </span>
                            </div>

                            <div className="shrink-0">
                              <span className={`text-xs px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 transition ${
                                isSelected 
                                  ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-sm' 
                                  : 'bg-zinc-800 text-zinc-500 border border-zinc-700/60'
                              }`}>
                                {isSelected ? '✔ 已啟用' : '未加入'}
                              </span>
                            </div>
                          </div>

                          <p className={`text-xs leading-relaxed p-2.5 rounded-lg border break-words ${
                            isSelected 
                              ? 'text-zinc-200 bg-zinc-950/60 border-zinc-800/80' 
                              : 'text-zinc-500 bg-zinc-950/30 border-zinc-900'
                          }`}>
                            {role.desc}
                          </p>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="p-4 border-t border-zinc-800 flex justify-between items-center bg-zinc-950/40">
                  <span className="text-xs text-zinc-400">
                    {tempTotalCardsInDeck === players.length + 1 
                      ? '💡 角色數比人數多 1 張，本局將產生 1 張未分配的【埋葬卡】' 
                      : '請確認卡牌總數大於或等於玩家人數'}
                  </span>
                  <button
                    type="button"
                    onClick={() => {
                      setRoleCounts(tempRoleCounts);
                      setShowDeckModal(false);
                      broadcastLatest({ roleCounts: tempRoleCounts });
                    }}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg active:scale-95"
                  >
                    確定保存設定
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
