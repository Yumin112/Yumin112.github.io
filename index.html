<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Two Rooms and a Boom!</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- 引入獨立角色資料庫 -->
  <script src="./roles.js"></script>
  
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #09090b 100%);
      min-height: 100vh;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="p-2 sm:p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    function App() {
      const rolesCatalog = window.OFFICIAL_ROLES_CATALOG || [];

      const [gameState, setGameState] = useState('home'); // 'home' | 'lobby' | 'game'
      const [roomId, setRoomId] = useState('');
      const [joinRoomInput, setJoinRoomInput] = useState('');
      const [playerName, setPlayerName] = useState('');
      const [myPlayerId, setMyPlayerId] = useState('');
      const [isHost, setIsHost] = useState(false);
      const [connStatus, setConnStatus] = useState('未連線');

      // 房間狀態與玩家名單
      const [players, setPlayers] = useState([]);
      const [roomStatus, setRoomStatus] = useState('waiting'); // 'waiting' | 'round_active' | 'round_paused' | 'ended'

      // 回合計時與設定 (3~5 輪)
      const [roundSettings, setRoundSettings] = useState([3, 2, 1]); 
      const [currentRoundIndex, setCurrentRoundIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(180);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [showRoundConfigModal, setShowRoundConfigModal] = useState(false);

      // 卡池數量配置
      const [roleCounts, setRoleCounts] = useState({
        'pres': 1, 'bomb': 1, 'doctor': 1, 'engineer': 1,
        'blue_mem': 8, 'red_mem': 8
      });
      const [showDeckModal, setShowDeckModal] = useState(false);

      // 彈窗內部臨時狀態
      const [tempRoundSettings, setTempRoundSettings] = useState([3, 2, 1]);
      const [tempRoleCounts, setTempRoleCounts] = useState({});

      // 身分防窺與上帝視角
      const [isRevealed, setIsRevealed] = useState(false);
      const [isGodMode, setIsGodMode] = useState(false);

      const clientRef = useRef(null);
      const timerIntervalRef = useRef(null);
      const latestStateRef = useRef({
        players: [],
        roomStatus: 'waiting',
        roundSettings: [3, 2, 1],
        roleCounts: {},
        currentRoundIndex: 0,
        timeLeft: 180,
        isHost: false,
        roomId: '',
        myPlayerId: ''
      });

      useEffect(() => {
        latestStateRef.current = {
          players,
          roomStatus,
          roundSettings,
          roleCounts,
          currentRoundIndex,
          timeLeft,
          isHost,
          roomId,
          myPlayerId
        };
      }, [players, roomStatus, roundSettings, roleCounts, currentRoundIndex, timeLeft, isHost, roomId, myPlayerId]);

      // 廣播全場狀態
      const broadcastLatest = (override = {}) => {
        if (!clientRef.current) return;
        const s = { ...latestStateRef.current, ...override };
        clientRef.current.publish(`trb_game_sync_room_${s.roomId}`, JSON.stringify({
          type: 'FULL_SYNC',
          senderId: s.myPlayerId,
          players: s.players,
          roomStatus: s.roomStatus,
          roleCounts: s.roleCounts,
          roundSettings: s.roundSettings,
          currentRoundIndex: s.currentRoundIndex,
          timeLeft: s.timeLeft
        }));
      };

      // 雲端 MQTT 連線通道
      const setupConnection = (code, asHost, name, uid) => {
        setConnStatus('連線伺服器中...');
        const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
        const topic = `trb_game_sync_room_${code}`;

        if (clientRef.current) {
          try { clientRef.current.end(true); } catch(e) {}
        }

        const client = mqtt.connect(brokerUrl, {
          clientId: `trb_${uid}_${Math.random().toString(16).substr(2, 6)}`,
          clean: true,
          reconnectPeriod: 2000
        });

        clientRef.current = client;

        client.on('connect', () => {
          setConnStatus('🟢 雲端就緒');
          client.subscribe(topic, { qos: 1 }, () => {
            // 自動廣播加入／重連請求
            client.publish(topic, JSON.stringify({
              type: 'PLAYER_PING_SYNC',
              senderId: uid,
              isHost: asHost,
              player: { id: uid, name: name.trim(), isHost: asHost, team: null, role: null, gameRoom: null }
            }));
          });
        });

        client.on('message', (t, msg) => {
          try {
            const data = JSON.parse(msg.toString());
            if (data.senderId === uid) return;

            // 房長收到新玩家加入或重連
            if (data.type === 'PLAYER_PING_SYNC' && latestStateRef.current.isHost) {
              setPlayers(prev => {
                const existing = prev.find(p => p.id === data.player.id);
                let next;
                if (existing) {
                  // 重連回來：保留原有的房間、身分與陣營
                  next = prev.map(p => p.id === data.player.id ? { ...p, name: data.player.name } : p);
                } else {
                  next = [...prev, data.player];
                }
                setTimeout(() => {
                  broadcastLatest({ players: next });
                }, 80);
                return next;
              });
            }

            // 玩家主動離開通知
            if (data.type === 'PLAYER_LEFT') {
              setPlayers(prev => {
                const next = prev.filter(p => p.id !== data.playerId);
                if (latestStateRef.current.isHost) {
                  setTimeout(() => { broadcastLatest({ players: next }); }, 50);
                }
                return next;
              });
            }

            // 全局同步
            if (data.type === 'FULL_SYNC') {
              setPlayers(data.players);
              setRoomStatus(data.roomStatus);
              if (data.roleCounts) setRoleCounts(data.roleCounts);
              if (data.roundSettings) setRoundSettings(data.roundSettings);
              setCurrentRoundIndex(data.currentRoundIndex);
              setTimeLeft(data.timeLeft);

              if (data.roomStatus === 'round_active') {
                setGameState('game');
                setIsTimerRunning(true);
              } else if (data.roomStatus === 'round_paused' || data.roomStatus === 'ended') {
                setGameState('game');
                setIsTimerRunning(false);
              } else if (data.roomStatus === 'waiting') {
                setGameState('lobby');
                setIsTimerRunning(false);
              }
            }

            // 時間校正 (每 5 秒校正一次)
            if (data.type === 'TIME_SYNC' && !latestStateRef.current.isHost) {
              setTimeLeft(prev => (Math.abs(prev - data.timeLeft) > 1 ? data.timeLeft : prev));
            }
          } catch(e) {}
        });

        client.on('error', () => setConnStatus('連線重試中...'));
      };

      // 檢查 localStorage 達成「斷線與重新整理自動恢復」
      useEffect(() => {
        let storedId = localStorage.getItem('trb_player_uid_v5');
        if (!storedId) {
          storedId = 'u_' + Math.random().toString(36).substring(2, 9);
          localStorage.setItem('trb_player_uid_v5', storedId);
        }
        setMyPlayerId(storedId);

        const savedRoomId = localStorage.getItem('trb_saved_room_id');
        const savedPlayerName = localStorage.getItem('trb_saved_player_name');
        const savedIsHost = localStorage.getItem('trb_saved_is_host') === 'true';

        if (savedRoomId && savedPlayerName) {
          setRoomId(savedRoomId);
          setPlayerName(savedPlayerName);
          setIsHost(savedIsHost);
          setGameState('lobby'); // 先切回大廳，連線成功後 FULL_SYNC 會自動推進到遊戲畫面
          setupConnection(savedRoomId, savedIsHost, savedPlayerName, storedId);
        }
      }, []);

      // 全員本地每秒獨立倒數，房長每 5 秒廣播校準一次
      useEffect(() => {
        if (isTimerRunning && roomStatus === 'round_active' && timeLeft > 0) {
          timerIntervalRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timerIntervalRef.current);
                if (latestStateRef.current.isHost) handleRoundTimeUp();
                return 0;
              }
              const nextSec = prev - 1;
              // 房長每 5 秒發送一次對時校準
              if (latestStateRef.current.isHost && nextSec % 5 === 0 && clientRef.current) {
                clientRef.current.publish(`trb_game_sync_room_${roomId}`, JSON.stringify({
                  type: 'TIME_SYNC',
                  senderId: myPlayerId,
                  timeLeft: nextSec
                }));
              }
              return nextSec;
            });
          }, 1000);
        } else {
          clearInterval(timerIntervalRef.current);
        }
        return () => clearInterval(timerIntervalRef.current);
      }, [isTimerRunning, roomStatus, timeLeft, roomId, isHost, myPlayerId]);

      const handleRoundTimeUp = () => {
        setIsTimerRunning(false);
        setRoomStatus('round_paused');
        broadcastLatest({ roomStatus: 'round_paused', timeLeft: 0 });
      };

      // 1. 建立房間
      const handleCreateRoom = () => {
        const trimmedName = playerName.trim() || '房長';
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        const me = { id: myPlayerId, name: trimmedName, isHost: true, team: null, role: null, gameRoom: null };

        // 存入本機避免重整丟失
        localStorage.setItem('trb_saved_room_id', code);
        localStorage.setItem('trb_saved_player_name', trimmedName);
        localStorage.setItem('trb_saved_is_host', 'true');

        setRoomId(code);
        setIsHost(true);
        setPlayers([me]);
        setRoomStatus('waiting');
        setGameState('lobby');

        setupConnection(code, true, trimmedName, myPlayerId);
      };

      // 2. 加入房間
      const handleJoinRoom = () => {
        const trimmedName = playerName.trim() || '特工';
        const code = joinRoomInput.trim();
        if (code.length !== 6) {
          alert('請輸入 6 碼數字房號！');
          return;
        }

        // 存入本機避免重整丟失
        localStorage.setItem('trb_saved_room_id', code);
        localStorage.setItem('trb_saved_player_name', trimmedName);
        localStorage.setItem('trb_saved_is_host', 'false');

        setRoomId(code);
        setIsHost(false);
        setGameState('lobby');

        setupConnection(code, false, trimmedName, myPlayerId);
      };

      // 3. 離開房間功能
      const handleLeaveRoom = () => {
        if (!window.confirm('確定要離開當前房間嗎？')) return;

        // 廣播告知所有人自己離開
        if (clientRef.current && roomId) {
          clientRef.current.publish(`trb_game_sync_room_${roomId}`, JSON.stringify({
            type: 'PLAYER_LEFT',
            playerId: myPlayerId
          }));
          try { clientRef.current.end(true); } catch(e) {}
        }

        // 清理本地儲存
        localStorage.removeItem('trb_saved_room_id');
        localStorage.removeItem('trb_saved_player_name');
        localStorage.removeItem('trb_saved_is_host');

        // 重置所有狀態回首頁
        setRoomId('');
        setIsHost(false);
        setPlayers([]);
        setGameState('home');
        setRoomStatus('waiting');
        setIsTimerRunning(false);
        setConnStatus('未連線');
      };

      // 開啟輪次設定
      const openRoundConfigModal = () => {
        setTempRoundSettings([...roundSettings]);
        setShowRoundConfigModal(true);
      };

      // 保存輪次設定
      const saveRoundConfig = () => {
        setRoundSettings(tempRoundSettings);
        setShowRoundConfigModal(false);
        broadcastLatest({ roundSettings: tempRoundSettings });
      };

      // 開啟角色池彈窗
      const openDeckModal = () => {
        setTempRoleCounts({ ...roleCounts });
        setShowDeckModal(true);
      };

      // 保存角色池設定
      const saveDeckConfig = () => {
        setRoleCounts(tempRoleCounts);
        setShowDeckModal(false);
        broadcastLatest({ roleCounts: tempRoleCounts });
      };

      const totalCardsInDeck = useMemo(() => {
        return Object.values(roleCounts).reduce((sum, c) => sum + (c || 0), 0);
      }, [roleCounts]);

      const tempTotalCardsInDeck = useMemo(() => {
        return Object.values(tempRoleCounts).reduce((sum, c) => sum + (c || 0), 0);
      }, [tempRoleCounts]);

      // 4. 開始遊戲
      const handleStartGame = () => {
        if (players.length < 2) {
          alert('至少需要 2 位玩家加入才能開始！');
          return;
        }

        let deck = [];
        rolesCatalog.forEach(role => {
          const count = roleCounts[role.id] || 0;
          for (let i = 0; i < count; i++) deck.push({ ...role });
        });

        if (deck.length < players.length) {
          alert(`卡池張數 (${deck.length} 張) 少於在線玩家 (${players.length} 人)！請於角色池設定增加卡片。`);
          return;
        }

        deck.sort(() => Math.random() - 0.5);
        const shuffled = [...players].sort(() => Math.random() - 0.5);
        const half = Math.ceil(shuffled.length / 2);

        const assigned = shuffled.map((p, idx) => {
          const r = deck[idx];
          return {
            ...p,
            team: r.team,
            role: r,
            gameRoom: idx < half ? '房間 A (Room A)' : '房間 B (Room B)'
          };
        });

        const initialTime = roundSettings[0] * 60;
        setPlayers(assigned);
        setCurrentRoundIndex(0);
        setTimeLeft(initialTime);
        setRoomStatus('round_active');
        setIsTimerRunning(true);
        setGameState('game');

        broadcastLatest({
          players: assigned,
          roomStatus: 'round_active',
          currentRoundIndex: 0,
          timeLeft: initialTime
        });
      };

      // 5. 進入下一輪或揭示
      const handleNextRoundConfirm = () => {
        if (currentRoundIndex + 1 < roundSettings.length) {
          const nextIdx = currentRoundIndex + 1;
          const nextTime = roundSettings[nextIdx] * 60;
          setCurrentRoundIndex(nextIdx);
          setTimeLeft(nextTime);
          setRoomStatus('round_active');
          setIsTimerRunning(true);

          broadcastLatest({
            roomStatus: 'round_active',
            currentRoundIndex: nextIdx,
            timeLeft: nextTime
          });
        } else {
          setRoomStatus('ended');
          setIsTimerRunning(false);
          setIsGodMode(true);

          broadcastLatest({
            roomStatus: 'ended',
            timeLeft: 0
          });
        }
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const myInfo = players.find(p => p.id === myPlayerId) || { name: playerName, team: null, role: null, gameRoom: null };
      const roomAPlayers = players.filter(p => p.gameRoom && p.gameRoom.includes('Room A'));
      const roomBPlayers = players.filter(p => p.gameRoom && p.gameRoom.includes('Room B'));

      return (
        <div className="max-w-4xl mx-auto pb-12">
          {/* Header 導覽列 */}
          <header className="flex justify-between items-center py-4 border-b border-zinc-800 mb-6">
            <div className="flex items-center gap-2">
              <span className="text-3xl">💣</span>
              <div>
                <h1 className="text-xl font-black tracking-wider bg-gradient-to-r from-red-500 via-amber-400 to-blue-500 bg-clip-text text-transparent uppercase">
                  Two Rooms and a Boom!
                </h1>
                <div className="flex items-center gap-2 text-xs text-zinc-400">
                  <span>{connStatus}</span>
                  {roomId && <span>• 回合: {roundSettings.length} 輪</span>}
                </div>
              </div>
            </div>

            {roomId && (
              <div className="flex items-center gap-2">
                <div className="bg-zinc-800/80 border border-zinc-700 px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <span className="text-xs text-zinc-400">房號:</span>
                  <span className="text-base font-mono font-bold tracking-widest text-amber-400">{roomId}</span>
                  <span className="text-xs bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded">
                    {isHost ? '房長' : '玩家'}
                  </span>
                </div>

                {/* 離開房間按鈕 */}
                <button
                  onClick={handleLeaveRoom}
                  className="bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-300 hover:text-rose-200 text-xs px-2.5 py-1.5 rounded-lg transition flex items-center gap-1"
                >
                  🚪 離開
                </button>
              </div>
            )}
          </header>

          {/* 首頁：建立 / 加入 */}
          {gameState === 'home' && (
            <div className="max-w-md mx-auto bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-xl mt-6">
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-zinc-300 mb-1">您的暱稱</label>
                  <input
                    type="text"
                    value={playerName}
                    onChange={(e) => setPlayerName(e.target.value)}
                    placeholder="輸入暱稱 (例如: 特工 007)"
                    className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2.5 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                <button
                  type="button"
                  onClick={handleCreateRoom}
                  className="w-full bg-gradient-to-r from-red-600 via-purple-600 to-blue-600 hover:opacity-90 text-white font-semibold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2 active:scale-95"
                >
                  <span>👑 建立新房間 (當房長)</span>
                </button>

                <div className="relative flex py-1 items-center">
                  <div className="flex-grow border-t border-zinc-800"></div>
                  <span className="flex-shrink mx-4 text-xs text-zinc-500">或輸入 6 碼房間號</span>
                  <div className="flex-grow border-t border-zinc-800"></div>
                </div>

                <div className="flex gap-2">
                  <input
                    type="tel"
                    maxLength={6}
                    value={joinRoomInput}
                    onChange={(e) => setJoinRoomInput(e.target.value)}
                    placeholder="輸入 6 碼房號"
                    className="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-2 text-white font-mono text-center tracking-widest placeholder-zinc-500 focus:outline-none"
                  />
                  <button
                    type="button"
                    onClick={handleJoinRoom}
                    className="bg-zinc-700 hover:bg-zinc-600 px-6 py-2 rounded-xl text-white font-medium transition active:scale-95"
                  >
                    加入
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 等待大廳 */}
          {gameState === 'lobby' && (
            <div className="space-y-6">
              <div className="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <span>等待大廳</span>
                    <span className="text-sm bg-zinc-800 px-3 py-0.5 rounded-full text-zinc-300">
                      在線人數: <strong className="text-amber-400">{players.length}</strong> 人
                    </span>
                  </h2>
                  <p className="text-xs text-zinc-400 mt-1">
                    斷線或重新整理頁面皆可自動連回。房號：<strong className="text-white font-mono text-sm">{roomId}</strong>
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2.5">
                  {isHost && (
                    <button
                      onClick={openRoundConfigModal}
                      className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-3.5 py-2 rounded-xl text-xs font-semibold text-zinc-200 transition"
                    >
                      ⚙️ 回合設定 ({roundSettings.length}輪)
                    </button>
                  )}

                  <button
                    onClick={openDeckModal}
                    className="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-3.5 py-2 rounded-xl text-xs font-semibold text-zinc-200 transition"
                  >
                    🃏 角色池配置 ({totalCardsInDeck}張)
                  </button>

                  {isHost ? (
                    <button
                      onClick={handleStartGame}
                      className="bg-gradient-to-r from-red-600 to-blue-600 hover:opacity-90 px-6 py-2.5 rounded-xl font-bold text-white shadow-lg transition"
                    >
                      🎲 開始遊戲 & 分房
                    </button>
                  ) : (
                    <span className="text-xs text-amber-400 bg-amber-400/10 px-3 py-2 rounded-xl border border-amber-400/20 animate-pulse">
                      ⏳ 等待房長開始遊戲...
                    </span>
                  )}
                </div>
              </div>

              {/* 回合資訊預覽 */}
              <div className="bg-zinc-900/60 border border-zinc-800/80 p-4 rounded-xl flex flex-wrap gap-4 text-xs text-zinc-400 justify-between items-center">
                <div className="flex items-center gap-2">
                  <span className="text-amber-400 font-bold">⏱️ 回合時間規劃:</span>
                  {roundSettings.map((min, idx) => (
                    <span key={idx} className="bg-zinc-800 border border-zinc-700 px-2 py-0.5 rounded text-zinc-200">
                      第 {idx + 1} 輪: <strong>{min}</strong> 分鐘
                    </span>
                  ))}
                </div>
                <div>計時結束後需等候房長確認才進入下一輪。</div>
              </div>

              {/* 線上玩家列表 */}
              <div className="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
                <h3 className="text-sm font-semibold text-zinc-400 mb-3">線上玩家列表 ({players.length})</h3>
                <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3">
                  {players.map((p, idx) => (
                    <div
                      key={p.id}
                      className={`p-3 rounded-xl border flex items-center gap-2.5 ${
                        p.id === myPlayerId ? 'bg-indigo-950/40 border-indigo-500/50' : 'bg-zinc-800/40 border-zinc-800'
                      }`}
                    >
                      <div className="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-xs">
                        {idx + 1}
                      </div>
                      <div className="truncate">
                        <div className="text-sm font-medium truncate flex items-center gap-1">
                          {p.name}
                          {p.isHost && <span className="text-amber-400 text-xs">👑</span>}
                        </div>
                        {p.id === myPlayerId && <div className="text-[10px] text-indigo-400">你自己</div>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 遊戲進行中 */}
          {gameState === 'game' && (
            <div className="space-y-6">
              {/* 頂部回合計時看板 */}
              <div className={`p-4 rounded-2xl border flex flex-col md:flex-row justify-between items-center gap-4 ${
                roomStatus === 'round_paused' ? 'bg-amber-950/40 border-amber-500 animate-pulse' :
                roomStatus === 'ended' ? 'bg-red-950/40 border-red-500' : 'bg-zinc-900 border-zinc-800'
              }`}>
                <div className="flex items-center gap-3">
                  <div className="text-center md:text-left">
                    <span className="text-xs uppercase tracking-wider text-zinc-400 font-bold">
                      {roomStatus === 'ended' ? '遊戲結束' : `第 ${currentRoundIndex + 1} / ${roundSettings.length} 輪`}
                    </span>
                    <h2 className="text-3xl font-black font-mono tracking-tight text-white">
                      {roomStatus === 'ended' ? '全體身分揭曉' : formatTime(timeLeft)}
                    </h2>
                  </div>

                  {roomStatus === 'round_paused' && (
                    <div className="bg-amber-500/20 border border-amber-500 text-amber-300 text-xs px-3 py-1.5 rounded-lg font-bold">
                      ⚠️ 本輪時間到！請選出人質交換，等候房長確認。
                    </div>
                  )}
                </div>

                <div className="flex items-center gap-2.5">
                  {isHost && roomStatus === 'round_paused' && (
                    <button
                      onClick={handleNextRoundConfirm}
                      className="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-black px-5 py-2.5 rounded-xl shadow-lg transition"
                    >
                      👉 房長確認：{currentRoundIndex + 1 < roundSettings.length ? `進入第 ${currentRoundIndex + 2} 輪` : '揭開身分結算'}
                    </button>
                  )}

                  {isHost && (
                    <button
                      onClick={() => setIsGodMode(!isGodMode)}
                      className={`text-xs px-3 py-2 rounded-xl border transition ${
                        isGodMode ? 'bg-amber-500 text-black border-amber-400 font-bold' : 'bg-zinc-800 border-zinc-700 text-zinc-300'
                      }`}
                    >
                      {isGodMode ? '👁️ 上帝視角 (開)' : '🔒 上帝視角 (關)'}
                    </button>
                  )}

                  {isHost && (
                    <button
                      onClick={() => {
                        setRoomStatus('waiting');
                        setGameState('lobby');
                        broadcastLatest({ roomStatus: 'waiting', currentRoundIndex: 0, timeLeft: roundSettings[0] * 60 });
                      }}
                      className="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-2 rounded-xl transition"
                    >
                      結束回大廳
                    </button>
                  )}
                </div>
              </div>

              {/* 初始實體房間分配 */}
              <div className="bg-indigo-950/40 border border-indigo-500/40 p-3 rounded-xl flex items-center justify-between">
                <span className="text-xs text-indigo-300">你的初始房間分配：</span>
                <span className="text-sm font-black text-indigo-200 bg-indigo-900/60 px-3 py-1 rounded-lg">
                  📍 {myInfo.gameRoom || '未分配'}
                </span>
              </div>

              {/* 手機防窺翻牌卡片 */}
              <div className="max-w-sm mx-auto">
                <div className="text-center mb-2">
                  <span className="text-xs text-zinc-400">👇 按住卡片翻開（手放開立即隱藏防窺）</span>
                </div>

                <div
                  onMouseDown={() => setIsRevealed(true)}
                  onMouseUp={() => setIsRevealed(false)}
                  onTouchStart={() => setIsRevealed(true)}
                  onTouchEnd={() => setIsRevealed(false)}
                  className="w-full h-80 cursor-pointer select-none perspective-1000"
                >
                  <div className={`relative w-full h-full duration-300 transform-style-3d ${isRevealed ? 'rotate-y-180' : ''}`}>
                    {/* 卡背 */}
                    <div className="absolute inset-0 backface-hidden bg-gradient-to-br from-zinc-800 to-zinc-900 border-2 border-indigo-500/40 rounded-2xl flex flex-col items-center justify-center p-6 shadow-2xl">
                      <div className="w-20 h-20 rounded-full bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-4xl mb-4">
                        🔒
                      </div>
                      <h3 className="text-lg font-bold text-zinc-100">TWO ROOMS AND A BOOM</h3>
                      <p className="text-xs text-zinc-400 mt-2">按住檢視機密身分</p>
                      <div className="mt-4 text-[11px] text-zinc-500 bg-zinc-950/60 px-3 py-1 rounded-full">
                        玩家: {myInfo.name}
                      </div>
                    </div>

                    {/* 卡面 */}
                    <div className={`absolute inset-0 backface-hidden rotate-y-180 rounded-2xl p-6 flex flex-col justify-between shadow-2xl border-2 ${
                      myInfo.team === 'red' ? 'bg-gradient-to-br from-red-950 via-zinc-900 to-zinc-900 border-red-500' :
                      myInfo.team === 'blue' ? 'bg-gradient-to-br from-blue-950 via-zinc-900 to-zinc-900 border-blue-500' :
                      myInfo.team === 'green' ? 'bg-gradient-to-br from-emerald-950 via-zinc-900 to-zinc-900 border-emerald-500' :
                      'bg-gradient-to-br from-zinc-800 via-zinc-900 to-zinc-900 border-zinc-400'
                    }`}>
                      <div className="flex justify-between items-start">
                        <span className={`text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wider ${
                          myInfo.team === 'red' ? 'bg-red-500/20 text-red-400 border border-red-500/30' :
                          myInfo.team === 'blue' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' :
                          myInfo.team === 'green' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                          'bg-zinc-500/20 text-zinc-300 border border-zinc-500/30'
                        }`}>
                          {myInfo.team === 'red' ? 'RED TEAM (紅隊)' :
                           myInfo.team === 'blue' ? 'BLUE TEAM (藍隊)' :
                           myInfo.team === 'green' ? 'GREEN TEAM (綠隊)' : 'GREY TEAM (灰隊中立)'}
                        </span>
                        <span className="text-3xl">{myInfo.role?.icon || '⭐'}</span>
                      </div>

                      <div className="text-center my-auto">
                        <h2 className="text-xl font-black text-white">{myInfo.role?.name || '身分載入中...'}</h2>
                        <p className="text-xs text-zinc-300 mt-3 px-2 leading-relaxed bg-zinc-950/60 py-2.5 rounded-xl border border-zinc-800">
                          {myInfo.role?.desc || '暫無專屬說明'}
                        </p>
                      </div>

                      <div className="text-[11px] text-zinc-400 text-center">
                        鬆手立刻蓋牌隱藏
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* 兩房間成員名單 */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-zinc-900/80 border border-zinc-700/80 rounded-2xl p-4">
                  <h3 className="font-bold text-indigo-300 mb-3 flex items-center justify-between">
                    <span>🏠 房間 A (Room A)</span>
                    <span className="text-xs bg-indigo-900/40 px-2 py-0.5 rounded-full">{roomAPlayers.length} 人</span>
                  </h3>
                  <div className="space-y-2">
                    {roomAPlayers.map(p => (
                      <div key={p.id} className="flex justify-between items-center bg-zinc-800/60 p-2.5 rounded-xl border border-zinc-700/50">
                        <span className="text-sm font-medium">{p.name} {p.id === myPlayerId && '(你)'}</span>
                        <span className="text-xs font-mono">
                          {p.id === myPlayerId || isGodMode ? (
                            <span className={`font-semibold ${
                              p.team === 'red' ? 'text-red-400' :
                              p.team === 'blue' ? 'text-blue-400' :
                              p.team === 'green' ? 'text-emerald-400' : 'text-zinc-300'
                            }`}>
                              {p.role?.icon} {p.role?.name}
                            </span>
                          ) : (
                            <span className="text-zinc-500">🔒 機密身分</span>
                          )}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-zinc-900/80 border border-zinc-700/80 rounded-2xl p-4">
                  <h3 className="font-bold text-amber-300 mb-3 flex items-center justify-between">
                    <span>🚪 房間 B (Room B)</span>
                    <span className="text-xs bg-amber-900/40 px-2 py-0.5 rounded-full">{roomBPlayers.length} 人</span>
                  </h3>
                  <div className="space-y-2">
                    {roomBPlayers.map(p => (
                      <div key={p.id} className="flex justify-between items-center bg-zinc-800/60 p-2.5 rounded-xl border border-zinc-700/50">
                        <span className="text-sm font-medium">{p.name} {p.id === myPlayerId && '(你)'}</span>
                        <span className="text-xs font-mono">
                          {p.id === myPlayerId || isGodMode ? (
                            <span className={`font-semibold ${
                              p.team === 'red' ? 'text-red-400' :
                              p.team === 'blue' ? 'text-blue-400' :
                              p.team === 'green' ? 'text-emerald-400' : 'text-zinc-300'
                            }`}>
                              {p.role?.icon} {p.role?.name}
                            </span>
                          ) : (
                            <span className="text-zinc-500">🔒 機密身分</span>
                          )}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 回合設定彈窗 */}
          {showRoundConfigModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                  <h3 className="text-base font-bold text-white">⚙️ 調整回合數與每輪時間</h3>
                  <button onClick={() => setShowRoundConfigModal(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>

                <div>
                  <label className="block text-xs font-bold text-zinc-400 mb-2">選擇總輪數 (3 ~ 5 輪):</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[3, 4, 5].map(cnt => (
                      <button
                        key={cnt}
                        type="button"
                        onClick={() => {
                          let newSettings = [...tempRoundSettings];
                          if (cnt > newSettings.length) {
                            while (newSettings.length < cnt) newSettings.push(1);
                          } else {
                            newSettings = newSettings.slice(0, cnt);
                          }
                          setTempRoundSettings(newSettings);
                        }}
                        className={`py-2 rounded-xl text-sm font-bold border transition ${
                          tempRoundSettings.length === cnt ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-zinc-800 border-zinc-700 text-zinc-300'
                        }`}
                      >
                        {cnt} 輪
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-2">
                  <label className="block text-xs font-bold text-zinc-400">設定各輪分鐘數 (分):</label>
                  {tempRoundSettings.map((min, idx) => (
                    <div key={idx} className="flex justify-between items-center bg-zinc-800/80 px-3 py-2 rounded-xl border border-zinc-700">
                      <span className="text-xs text-zinc-300 font-semibold">第 {idx + 1} 輪:</span>
                      <div className="flex items-center gap-2">
                        <input
                          type="number"
                          min="1"
                          max="15"
                          value={min}
                          onChange={(e) => {
                            const val = Math.max(1, parseInt(e.target.value) || 1);
                            const updated = [...tempRoundSettings];
                            updated[idx] = val;
                            setTempRoundSettings(updated);
                          }}
                          className="w-16 bg-zinc-900 border border-zinc-600 rounded-lg px-2 py-1 text-center text-sm font-bold text-amber-400"
                        />
                        <span className="text-xs text-zinc-400">分鐘</span>
                      </div>
                    </div>
                  ))}
                </div>

                <button
                  type="button"
                  onClick={saveRoundConfig}
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition text-sm shadow-lg active:scale-95"
                >
                  確認保存設定
                </button>
              </div>
            </div>
          )}

          {/* 卡池設定彈窗 */}
          {showDeckModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-zinc-900 border border-zinc-700 w-full max-w-2xl max-h-[90vh] rounded-2xl flex flex-col shadow-2xl">
                <div className="p-4 border-b border-zinc-800 flex justify-between items-center">
                  <div>
                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                      <span>🃏 角色池配置</span>
                      <span className="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded">
                        目前: {tempTotalCardsInDeck} 張 / 玩家: {players.length} 人
                      </span>
                    </h3>
                  </div>
                  <button onClick={() => setShowDeckModal(false)} className="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 flex items-center justify-center">
                    ✕
                  </button>
                </div>

                <div className="p-4 overflow-y-auto space-y-3 flex-1">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {rolesCatalog.map(role => {
                      const count = tempRoleCounts[role.id] || 0;
                      return (
                        <div key={role.id} className="p-3 rounded-xl border flex items-center justify-between gap-3 bg-zinc-800/80 border-zinc-700">
                          <div className="flex items-center gap-2 truncate">
                            <span className="text-2xl">{role.icon}</span>
                            <div className="truncate">
                              <div className="text-sm font-semibold truncate flex items-center gap-1.5">
                                {role.name}
                                <span className={`text-[10px] px-1 rounded ${
                                  role.team === 'red' ? 'bg-red-500/20 text-red-400' :
                                  role.team === 'blue' ? 'bg-blue-500/20 text-blue-400' :
                                  role.team === 'green' ? 'bg-emerald-500/20 text-emerald-400' :
                                  'bg-zinc-500/20 text-zinc-300'
                                }`}>
                                  {role.team === 'red' ? '紅' : role.team === 'blue' ? '藍' : role.team === 'green' ? '綠' : '灰'}
                                </span>
                              </div>
                              <p className="text-[11px] text-zinc-400 truncate max-w-[130px]">{role.desc}</p>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <button
                              disabled={!isHost}
                              type="button"
                              onClick={() => {
                                const next = Math.max(0, count - 1);
                                setTempRoleCounts({ ...tempRoleCounts, [role.id]: next });
                              }}
                              className="w-7 h-7 bg-zinc-700 rounded-lg flex items-center justify-center font-bold active:scale-95 disabled:opacity-40"
                            >-</button>
                            <span className="w-5 text-center font-mono font-bold text-sm">{count}</span>
                            <button
                              disabled={!isHost}
                              type="button"
                              onClick={() => {
                                setTempRoleCounts({ ...tempRoleCounts, [role.id]: count + 1 });
                              }}
                              className="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center font-bold active:scale-95 disabled:opacity-40"
                            >+</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="p-4 border-t border-zinc-800 flex justify-between items-center bg-zinc-950/40">
                  <span className="text-xs text-zinc-400">請確認卡牌總數大於或等於玩家人數</span>
                  <button
                    type="button"
                    onClick={saveDeckConfig}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-lg active:scale-95"
                  >
                    確定保存設定
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
